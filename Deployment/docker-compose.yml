services:
  # =================================================================
  # SHARED POSTGRES (single DB, per-service schemas)
  #   masterdata  → schema: masterdata
  #   transaction → schema: transactions
  #   user-service → schema: users
  # =================================================================
  postgres-prod:
    build:
      context: ./docker-images/postgres
      dockerfile: Dockerfile
    # Pinned explicitly — without this, Compose would tag the built image after the
    # compose project name (e.g. "deployment-postgres-prod"), which would silently
    # break the `docker run qalitrack-postgres-prod:latest ...` restore command below
    # (Backup__PostgresImage) since that name wouldn't exist.
    image: qalitrack-postgres-prod:latest
    container_name: qalitrack-postgres-prod
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=-E UTF8 --locale=en_US.utf8
      - POSTGRES_SHARED_BUFFERS=512MB
      - POSTGRES_MAX_CONNECTIONS=600
      - POSTGRES_WORK_MEM=2MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=1GB
      # pgBackRest defaults to connecting as role "postgres", but the bootstrapped
      # superuser role here is whatever DB_USER is — without this it fails stanza-create/
      # check/backup with "role postgres does not exist". docker exec/archive_command
      # both inherit this container's environment, so pgbackrest picks it up automatically.
      - PGBACKREST_PG1_USER=${DB_USER}
    # archive_mode + archive_command hand every completed WAL segment to pgBackRest
    # so full backups can be chained into incrementals instead of re-dumping everything.
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest --stanza=qalitrack archive-push %p"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - pgbackrest_repo:/var/lib/pgbackrest
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - qalitrack-proxy
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # =================================================================
  # GATEWAY SERVICE
  # =================================================================
  gateway-service-prod:
    build:
      context: ../packages/microservices/QalitrackGateWay
      dockerfile: Dockerfile
    container_name: qalitrack-gateway-service-prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:7000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ISSUER=qalitrack
      - JWT_AUDIENCE=qalitrack
    networks:
      - qalitrack-proxy
    ports:
      - "7000:7000"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =================================================================
  # USER SERVICE
  # =================================================================
  user-service-prod:
    build:
      context: ../packages/microservices/masterdata/user-service
      dockerfile: Dockerfile
    container_name: qalitrack-user-service-prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - UsePostgreSQL=true
      - UseRedis=true
      - ConnectionStrings__DefaultConnection=Host=postgres-prod;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;
      - ConnectionStrings__Redis=redis-cache-prod:6379,password=${REDIS_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ISSUER=qalitrack
      - JWT_AUDIENCE=qalitrack
      - Backup__Path=/app/Backups
    volumes:
      - ./user-service/data:/app/data
      - ./user-service/logs:/app/logs
      - ./user-service/userservice-backups:/app/Backups
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-cache-prod:
        condition: service_healthy
    networks:
      - qalitrack-proxy
    ports:
      - "7001:80"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  redis-cache-prod:
    image: redis:7-alpine
    container_name: qalitrack-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru --tcp-keepalive 60 --timeout 300
    volumes:
      - redis_prod_data:/data
    networks:
      - qalitrack-proxy
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =================================================================
  # MASTERDATA SERVICE
  # =================================================================
  masterdata-service-prod:
    build:
      context: ../packages/microservices/masterdata/masterdata
      dockerfile: Dockerfile
    container_name: qalitrack-masterdata-service-prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - POSTGRES_HOST=postgres-prod
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${DB_NAME}
      - POSTGRES_USERNAME=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ISSUER=qalitrack
      - JWT_AUDIENCE=qalitrack
    volumes:
      - ./masterdata/logs:/app/logs
      - ./masterdata/docs:/app/wwwroot/docs
      - ./masterdata/data:/app/data
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - qalitrack-proxy
    ports:
      - "7002:80"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # =================================================================
  # TRANSACTION SERVICE
  # =================================================================
  transaction-service-prod:
    build:
      context: ../packages/microservices/masterdata/transaction
      dockerfile: Dockerfile
    container_name: qalitrack-transaction-service-prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - UsePostgreSQL=true
      - UseRedis=true
      - ConnectionStrings__DefaultConnection=Host=postgres-prod;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;
      - ConnectionStrings__Redis=redis-cache-prod:6379,password=${REDIS_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ISSUER=qalitrack
      - JWT_AUDIENCE=qalitrack
      - Transaction__MetadataPath=/app/transaction-metadata
      - Transaction__ReceiptPrefix=${RECEIPT_PREFIX:-NCCU}
    volumes:
      - ./transaction-service/data:/app/data
      - ./transaction-service/logs:/app/logs
      - ./transaction-service/metadata:/app/transaction-metadata
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-cache-prod:
        condition: service_healthy
    networks:
      - qalitrack-proxy
    ports:
      - "7004:80"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # =================================================================
  # BACKUP SERVICE (schema: backup)
  # =================================================================
  backup-service-prod:
    build:
      context: ../packages/microservices/masterdata/BackupService
      dockerfile: Dockerfile
    container_name: qalitrack-backup-service-prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - UsePostgreSQL=true
      - UseRedis=true
      - ConnectionStrings__DefaultConnection=Host=postgres-prod;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;
      - ConnectionStrings__Redis=redis-cache-prod:6379,password=${REDIS_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ISSUER=qalitrack
      - JWT_AUDIENCE=qalitrack
      - Backup__Path=/app/Backups
      - Backup__MetadataPath=/app/backup-metadata
      - Backup__PgBackRestStanza=qalitrack
      - Backup__PostgresContainerName=qalitrack-postgres-prod
      - Backup__PostgresImage=qalitrack-postgres-prod:latest
      - Backup__PostgresDataVolume=postgres_prod_data
      - Backup__PgBackRestRepoVolume=pgbackrest_repo
    volumes:
      - ./backup-service/data:/app/data
      - ./backup-service/logs:/app/logs
      - ./backup-service/backups:/app/Backups
      - ./backup-service/metadata:/app/backup-metadata
      # Needed to `docker exec`/`docker run` against postgres-prod for pgBackRest
      # backup/restore — physical backups must run where PGDATA lives, and Compose
      # gives no other way to reach into a sibling container. This grants
      # backup-service-prod effective control of the whole Docker host; accepted
      # for this single-tenant on-prem deployment, see RUNBOOK.md.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-cache-prod:
        condition: service_started
    networks:
      - qalitrack-proxy
    ports:
      - "7003:80"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

volumes:
  postgres_prod_data:
    driver: local
    name: postgres_prod_data
  pgbackrest_repo:
    driver: local
    name: pgbackrest_repo
  redis_prod_data:
    driver: local
    name: redis_prod_data

networks:
  qalitrack-proxy:
    driver: bridge
    name: qalitrack-proxy
