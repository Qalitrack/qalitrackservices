replicaCount: 1
image:
  repository: ghcr.io/qalitrack/qalitrackservices/backup-service
  pullPolicy: Always
  tag: "main-4ece1b1"
imagePullSecrets:
  - name: ghcr-credentials
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "7004"
  prometheus.io/path: "/metrics"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
service:
  type: ClusterIP
  port: 7004
  targetPort: 7004
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi
autoscaling:
  enabled: false
livenessProbe:
  tcpSocket:
    port: 7004
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
readinessProbe:
  tcpSocket:
    port: 7004
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3
nodeSelector: {}
tolerations: []
affinity: {}
env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Production"
  - name: ASPNETCORE_URLS
    value: "http://+:7004"
  - name: JWT_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: JWT_SECRET_KEY
  - name: USER_SERVICE_DB_HOST
    value: "user-service-postgresql"
  - name: USER_SERVICE_DB_PORT
    value: "5432"
  - name: USER_SERVICE_DB_NAME
    value: "qalitrack_user_service"
  - name: USER_SERVICE_DB_USERNAME
    value: "postgres"
  - name: USER_SERVICE_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: USER_SERVICE_DB_PASSWORD
  - name: MASTER_DATA_DB_HOST
    value: "masterdata-service-postgresql"
  - name: MASTER_DATA_DB_PORT
    value: "5432"
  - name: MASTER_DATA_DB_NAME
    value: "qalitrack_master_data"
  - name: MASTER_DATA_DB_USERNAME
    value: "postgres"
  - name: MASTER_DATA_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: MASTER_DATA_DB_PASSWORD
  - name: TRANSACTION_DB_HOST
    value: "transaction-service-postgresql"
  - name: TRANSACTION_DB_PORT
    value: "5432"
  - name: TRANSACTION_DB_NAME
    value: "qalitrack_transaction"
  - name: TRANSACTION_DB_USERNAME
    value: "postgres"
  - name: TRANSACTION_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: TRANSACTION_DB_PASSWORD
  - name: BACKUP_SCHEDULE
    value: "0 2 * * *"
  - name: BACKUP_RETENTION_DAYS
    value: "30"
  - name: RABBITMQ_HOST
    value: "qalitrack-rabbitmq"
  - name: RABBITMQ_PORT
    value: "5672"
  - name: RABBITMQ_USERNAME
    value: "qalitrack"
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: RABBITMQ_PASSWORD
  - name: ConnectionStrings__DefaultConnection
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: BACKUP_SERVICE_DB_CONNECTION_STRING
  - name: ConnectionStrings__Redis
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: BACKUP_SERVICE_REDIS_CONNECTION_STRING
  - name: EMAIL_SMTP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_SMTP_PASSWORD
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: RABBITMQ_PASSWORD
  - name: UsePostgreSQL
    value: "true"
  - name: UseRedis
    value: "true"
  - name: Backup__Path
    value: "/backups"
  - name: Backup__MetadataPath
    value: "/backups/metadata"
volumeMounts:
  - name: backup-storage
    mountPath: /backups
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /app/logs
volumes:
  - name: backup-storage
    persistentVolumeClaim:
      claimName: backup-storage-pvc
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 50Gi
  annotations: {}
# ============================================================================
# PostgreSQL for Backup Service metadata
# ============================================================================
postgresql:
  enabled: false
  auth:
    username: backupservice
    password: backupservice123
    database: backupservicedb
    postgresPassword: backupservice123
  primary:
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
    persistence:
      enabled: true
      size: 10Gi
    extendedConfiguration: |
      shared_buffers = 512MB
      max_connections = 600
      work_mem = 2MB
      effective_cache_size = 1GB
# ============================================================================
# Redis for Backup Service caching
# ============================================================================
redis:
  enabled: false
  auth:
    password: backupservice123
  master:
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "250m"
    persistence:
      enabled: true
      size: 2Gi
  replica:
    replicaCount: 0 # No replicas for 64GB VPS optimization
  commonConfiguration: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru
# ============================================================================
# RabbitMQ for Backup Service messaging
# ============================================================================
rabbitmq:
  enabled: false
  auth:
    username: admin
    password: securepassword
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  persistence:
    enabled: true
    size: 5Gi
  replicaCount: 1 # Single instance for 64GB VPS
