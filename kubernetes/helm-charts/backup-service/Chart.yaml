apiVersion: v2
name: backup-service
description: Qalitrack Backup Service - API-driven backup management with scheduling
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - qalitrack
  - backup
  - recovery
  - database
  - api
  - scheduling

maintainers:
  - name: Qalitrack Team
    email: dev@qalitrack.com

home: https://github.com/Qalitrack/qalitrackservices
sources:
  - https://github.com/Qalitrack/qalitrackservices

dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: rabbitmq
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
