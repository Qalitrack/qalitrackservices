apiVersion: v2
name: qalitrack-platform
description: Qalitrack Microservices Platform - Complete weighbridge management system
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - qalitrack
  - weighbridge
  - microservices
  - gateway
  - transaction
home: https://github.com/Qalitrack/qalitrackservices
sources:
  - https://github.com/Qalitrack/qalitrackservices
maintainers:
  - name: Qalitrack Team
    email: support@qalitrack.com
icon: https://qalitrack.com/logo.png
dependencies:
  - name: gateway-service
    version: "1.0.0"
    repository: "file://../gateway-service"
    condition: gateway.enabled
  - name: user-service
    version: "1.0.0"
    repository: "file://../user-service"
    condition: userService.enabled
  - name: masterdata-service
    version: "1.0.0"
    repository: "file://../masterdata-service"
    condition: masterdata.enabled
  - name: transaction-service
    version: "1.0.0"
    repository: "file://../transaction-service"
    condition: transaction.enabled
  - name: backup-service
    version: "1.0.0"
    repository: "file://../backup-service"
    condition: backup.enabled
  - name: technician-service
    version: "1.0.0"
    repository: "file://../technician-service"
    condition: technicianService.enabled
  - name: qtruck-service
    version: "1.0.0"
    repository: "file://../qtruck-service"
    condition: qtruckService.enabled
  - name: postgresql
    version: "18.5.11"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "25.3.7"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: rabbitmq
    version: "16.0.14"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled
  - name: prometheus
    version: "25.8.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "7.0.8"
    repository: "https://grafana.github.io/helm-charts"
    condition: monitoring.grafana.enabled
  - name: loki
    version: "5.41.4"
    repository: "https://grafana.github.io/helm-charts"
    condition: monitoring.loki.enabled
