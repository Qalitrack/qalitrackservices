# ============================================================================
# Qalitrack Platform - Main Configuration (64GB VPS Optimized)
# ============================================================================

global:
  environment: production
  namespace: qalitrack-prod
  imagePullPolicy: Always
  storageClass: "local-path"
  # JWT Configuration
  jwt:
    issuer: "qalitrack"
    audience: "qalitrack"
    expirationMinutes: 60
  # Image Registry (empty so Bitnami sub-charts use their own registries)
  imageRegistry: ""
  security:
    allowInsecureImages: true
# ============================================================================
# GATEWAY SERVICE - API Gateway with JWT Authentication
# ============================================================================
gateway:
  enabled: true
  replicaCount: 2
  fullnameOverride: "gateway-service"
  image:
    repository: gateway-service
    tag: main-39cda0b
    pullPolicy: Always
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  service:
    type: LoadBalancer
    port: 7000
    targetPort: 80
  env:
    ASPNETCORE_ENVIRONMENT: "Production"
    ASPNETCORE_URLS: "http://+:7000"
    ASPNETCORE_AllowedHosts: "*"
# ============================================================================
# USER SERVICE - Authentication & User Management
# ============================================================================
userService:
  enabled: true
  replicaCount: 2
  fullnameOverride: "user-service"
  image:
    repository: user-service
    tag: main-ff13374
    pullPolicy: Always
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 7001
    targetPort: 80
  postgresql:
    enabled: true
    fullnameOverride: "user-service-postgresql"
    auth:
      existingSecret: "qalitrack-secrets"
      secretKeys:
        adminPasswordKey: "USER_SERVICE_DB_PASSWORD"
    primary:
      resources:
        requests:
          memory: "1Gi"
          cpu: "250m"
        limits:
          memory: "3Gi"
          cpu: "1000m"
      persistence:
        size: 20Gi
# ============================================================================
# MASTERDATA SERVICE - Vehicles, Products, Suppliers
# ============================================================================
masterdata:
  enabled: true
  replicaCount: 2
  fullnameOverride: "masterdata-service"
  image:
    repository: masterdata-service
    tag: main-ff13374
    pullPolicy: Always
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 7002
    targetPort: 80
  postgresql:
    enabled: true
    fullnameOverride: "masterdata-service-postgresql"
    auth:
      existingSecret: "qalitrack-secrets"
      secretKeys:
        adminPasswordKey: "MASTER_DATA_DB_PASSWORD"
    primary:
      resources:
        requests:
          memory: "1Gi"
          cpu: "250m"
        limits:
          memory: "3Gi"
          cpu: "1000m"
      persistence:
        size: 30Gi
# ============================================================================
# TRANSACTION SERVICE - Weighbridge Transactions
# ============================================================================
transaction:
  enabled: true
  replicaCount: 2
  fullnameOverride: "transaction-service"
  image:
    repository: transaction-service
    tag: main-ff13374
    pullPolicy: Always
  resources:
    requests:
      memory: "768Mi"
      cpu: "250m"
    limits:
      memory: "2.5Gi"
      cpu: "1500m"
  service:
    type: ClusterIP
    port: 7003
    targetPort: 80
  postgresql:
    enabled: true
    fullnameOverride: "transaction-service-postgresql"
    auth:
      existingSecret: "qalitrack-secrets"
      secretKeys:
        adminPasswordKey: "TRANSACTION_DB_PASSWORD"
    primary:
      resources:
        requests:
          memory: "1Gi"
          cpu: "250m"
        limits:
          memory: "3Gi"
          cpu: "1000m"
      persistence:
        size: 50Gi
# ============================================================================
# BACKUP SERVICE - Scheduled Database Backups
# ============================================================================
backup:
  enabled: true
  replicaCount: 1
  fullnameOverride: "backup-service"
  image:
    repository: backup-service
    tag: main-ff13374
    pullPolicy: Always
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  service:
    type: ClusterIP
    port: 7004
    targetPort: 80
  schedule: "0 2 * * *" # Daily at 2 AM
  retention: 30 # Keep backups for 30 days
# ============================================================================
# TECHNICIAN SERVICE - Technician Management
# ============================================================================
technicianService:
  enabled: true
  replicaCount: 2
  fullnameOverride: "technician-service"
  image:
    repository: technician-api
    tag: main-ff13374
    pullPolicy: Always
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 7006
    targetPort: 80
  postgresql:
    enabled: true
    fullnameOverride: "technician-service-postgresql"
    auth:
      existingSecret: "qalitrack-secrets"
      secretKeys:
        adminPasswordKey: "TECHNICIAN_DB_PASSWORD"
    primary:
      resources:
        requests:
          memory: "1Gi"
          cpu: "250m"
        limits:
          memory: "3Gi"
          cpu: "1000m"
      persistence:
        size: 20Gi
# ============================================================================
# QTRUCK SERVICE - Drivers & Fleet Management
# ============================================================================
qtruckService:
  enabled: false # Images not yet built — enable after running CI workflows
  fullnameOverride: "qtruck-service"
  api:
    enabled: true
    replicaCount: 2
    fullnameOverride: "qtruck-api"
    image:
      repository: qtruck-api
      tag: main
    service:
      port: 7007
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
  frontend:
    enabled: true
    replicaCount: 2
    fullnameOverride: "qtruck-frontend"
    image:
      repository: qtruck-frontend
      tag: main
    service:
      port: 7008
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  postgresql:
    enabled: true
    fullnameOverride: "qtruck-service-postgresql"
    primary:
      resources:
        requests:
          memory: "1Gi"
          cpu: "250m"
        limits:
          memory: "3Gi"
          cpu: "1000m"
      persistence:
        size: 20Gi
# ============================================================================
# POSTGRESQL - Shared Configuration
# ============================================================================
postgresql:
  enabled: true
  auth:
    existingSecret: "qalitrack-secrets"
    secretKeys:
      adminPasswordKey: "POSTGRES_ADMIN_PASSWORD"
    database: "qalitrack"
  primary:
    persistence:
      enabled: true
      storageClass: "local-path"
    resources:
      requests:
        memory: "1Gi"
        cpu: "250m"
      limits:
        memory: "3Gi"
        cpu: "1000m"
    # PostgreSQL Performance Tuning for 64GB VPS
    extendedConfiguration: |
      shared_buffers = 1GB
      effective_cache_size = 3GB
      maintenance_work_mem = 256MB
      checkpoint_completion_target = 0.9
      wal_buffers = 16MB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200
      work_mem = 10MB
      min_wal_size = 1GB
      max_wal_size = 4GB
      max_connections = 200
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
# ============================================================================
# REDIS - Caching Layer
# ============================================================================
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: "qalitrack-secrets"
    existingSecretPasswordKey: "USER_SERVICE_REDIS_PASSWORD"
  master:
    resources:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        memory: "2Gi"
        cpu: "500m"
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "local-path"
  # Redis Configuration for performance
  commonConfiguration: |-
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    save ""
    appendonly yes
    appendfsync everysec
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
# ============================================================================
# RABBITMQ - Message Queue
# ============================================================================
rabbitmq:
  enabled: true
  replicaCount: 1
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1
  auth:
    username: "qalitrack"
    existingPasswordSecret: "qalitrack-secrets"
    existingSecretPasswordKey: "RABBITMQ_PASSWORD"
    existingErlangCookieSecret: "qalitrack-secrets"
    existingErlangCookieSecretKey: "RABBITMQ_ERLANG_COOKIE"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "local-path"
  # RabbitMQ Configuration
  extraConfiguration: |-
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.relative = 1.0
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
# ============================================================================
# INGRESS - External Access (Optional - Enable if you want SSL/domain routing)
# By default, Gateway Service is exposed as LoadBalancer
# ============================================================================
ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: "qalitrack-prod-cors-allow-all@kubernetescrd"
  hosts:
    - host: api.qalibrated.co.ke
      paths:
        - path: /
          pathType: Prefix
          service: qalitrack-gateway-service
          port: 7000
    - host: grafana.qalibrated.co.ke
      paths:
        - path: /
          pathType: Prefix
          service: qalitrack-grafana
          port: 80
    - host: prometheus.qalibrated.co.ke
      paths:
        - path: /
          pathType: Prefix
          service: qalitrack-prometheus-server
          port: 80
  tls:
    - secretName: api-qalibrated-tls
      hosts:
        - api.qalibrated.co.ke
    - secretName: grafana-qalibrated-tls
      hosts:
        - grafana.qalibrated.co.ke
    - secretName: prometheus-qalibrated-tls
      hosts:
        - prometheus.qalibrated.co.ke
# ============================================================================
# MONITORING & OBSERVABILITY
# ============================================================================
monitoring:
  enabled: true
  prometheus:
    enabled: true
    fullnameOverride: "prometheus"
    server:
      fullnameOverride: "prometheus-server"
      retention: "15d"
      persistentVolume:
        enabled: true
        size: 50Gi
      resources:
        requests:
          memory: "2Gi"
          cpu: "500m"
        limits:
          memory: "4Gi"
          cpu: "2000m"
      service:
        type: ClusterIP
        port: 80
  grafana:
    enabled: true
    fullnameOverride: "grafana"
    admin:
      existingSecret: "grafana-admin-secret"
      userKey: admin-user
      passwordKey: admin-password
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    service:
      type: ClusterIP
      port: 80
    # Grafana configuration
    grafana.ini:
      server:
        root_url: "https://grafana.qalibrated.co.ke"
        serve_from_sub_path: false
      auth.anonymous:
        enabled: false
      security:
        admin_user: admin
    # Datasources
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://qalitrack-prometheus-server:80
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki-gateway:80
            access: proxy
          - name: Alertmanager
            type: alertmanager
            url: http://qalitrack-alertmanager:9093
            access: proxy
            jsonData:
              implementation: prometheus
    # Pre-installed dashboards
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        argocd:
          gnetId: 19993
          revision: 2
          datasource: Prometheus
        argocd-notifications:
          gnetId: 14584
          revision: 1
          datasource: Prometheus
        alertmanager:
          gnetId: 9578
          revision: 4
          datasource: Alertmanager
        cert-manager:
          gnetId: 20842
          revision: 2
          datasource: Prometheus
  loki:
    enabled: true
    fullnameOverride: "loki"
    persistence:
      enabled: true
      size: 30Gi
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
# ============================================================================
# AUTOSCALING
# ============================================================================
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
# ============================================================================
# RESOURCE SUMMARY for 64GB VPS
# ============================================================================
# Service                Requests    Limits
# ----------------      ---------   --------
# Gateway (x2)           256Mi       512Mi
# User Service (x2)      1Gi         4Gi
# MasterData (x2)        1Gi         4Gi
# Transaction (x2)       1.5Gi       5Gi
# Backup (x1)            256Mi       512Mi
# PostgreSQL (x3)        3Gi         9Gi
# Redis (x1)             512Mi       2Gi
# RabbitMQ (x1)          512Mi       2Gi
# =====================================
# TOTAL Requests:        ~8.5Gi
# TOTAL Limits:          ~27Gi
# Leaves room for OS/system: ~37GB

# Sub-chart overrides (must be at top level, keyed by chart name)
grafana:
  admin:
    existingSecret: "grafana-admin-secret"
    userKey: admin-user
    passwordKey: admin-password
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://qalitrack-prometheus-server:80
          access: proxy
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki-gateway:80
          access: proxy
        - name: Alertmanager
          type: alertmanager
          url: http://qalitrack-alertmanager:9093
          access: proxy
          jsonData:
            implementation: prometheus
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      argocd:
        gnetId: 19993
        revision: 2
        datasource: Prometheus
      argocd-notifications:
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      alertmanager:
        gnetId: 13637
        revision: 2
        datasource: Prometheus
      cert-manager:
        gnetId: 20842
        revision: 2
        datasource: Prometheus
      # Kubernetes
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      kubernetes-pods:
        gnetId: 6336
        revision: 1
        datasource: Prometheus
      kubernetes-nodes:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      # Infrastructure
      postgresql:
        gnetId: 9628
        revision: 7
        datasource: Prometheus
      redis:
        gnetId: 11835
        revision: 1
        datasource: Prometheus
      rabbitmq:
        gnetId: 10991
        revision: 11
        datasource: Prometheus
      # Backend Services (.NET)
      aspnetcore-endpoints:
        gnetId: 17706
        revision: 1
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
      aspnetcore-http:
        gnetId: 10915
        revision: 1
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
          - name: DS_PROMETHEUS-MEDIUM
            value: Prometheus
      # Loki / Logs
      loki-logs:
        gnetId: 13639
        revision: 2
        datasource: Loki
prometheus:
  serverFiles:
    prometheus.yml:
      scrape_configs:
        - job_name: loki
          static_configs:
            - targets:
                - qalitrack-loki.qalitrack-prod.svc:3100
          metrics_path: /metrics
        - job_name: alertmanager
          static_configs:
            - targets:
                - qalitrack-alertmanager.qalitrack-prod.svc:9093
          metrics_path: /metrics
        - job_name: kube-state-metrics
          static_configs:
            - targets:
                - qalitrack-kube-state-metrics.qalitrack-prod.svc:8080
          metrics_path: /metrics
        - job_name: argocd
          static_configs:
            - targets:
                - argocd-metrics.argocd.svc:8082
                - argocd-server-metrics.argocd.svc:8083
                - argocd-notifications-controller-metrics.argocd.svc:9001
          metrics_path: /metrics
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                  - qalitrack-prod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
    alerting_rules.yml:
      groups:
        - name: qalitrack.pods
          rules:
            - alert: PodCrashLooping
              expr: rate(kube_pod_container_status_restarts_total{namespace="qalitrack-prod"}[5m]) * 60 > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Pod {{ $labels.pod }} is crash looping"
                description: "Pod {{ $labels.pod }} is restarting frequently."
            - alert: PodNotReady
              expr: kube_pod_status_ready{namespace="qalitrack-prod",condition="true"} == 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.pod }} not ready"
                description: "Pod {{ $labels.pod }} has been non-ready for 5+ minutes."
        - name: qalitrack.resources
          rules:
            - alert: HighMemoryUsage
              expr: (container_memory_working_set_bytes{namespace="qalitrack-prod",container!=""} / container_spec_memory_limit_bytes{namespace="qalitrack-prod",container!=""}) * 100 > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "High memory on {{ $labels.pod }}"
                description: "Container {{ $labels.container }} using >85% of memory limit."
            - alert: NodeDiskPressure
              expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Disk usage above 80%"
                description: "Node disk available is {{ $value | humanize }}%."
            - alert: PVCUsageHigh
              expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 80
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "PVC {{ $labels.persistentvolumeclaim }} above 80%"
                description: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanize }}% full."
        - name: qalitrack.postgresql
          rules:
            - alert: PostgreSQLConnectionPoolExhaustion
              expr: sum(pg_stat_activity_count) by (instance) > 180
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "PostgreSQL connections near limit"
                description: "PostgreSQL has {{ $value }} active connections (max 200)."
            - alert: PostgreSQLDown
              expr: pg_up == 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "PostgreSQL is down"
                description: "PostgreSQL instance {{ $labels.instance }} is not responding."
        - name: qalitrack.services
          rules:
            - alert: ServiceDown
              expr: up{namespace="qalitrack-prod"} == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Service {{ $labels.job }} is down"
                description: "Service {{ $labels.job }} has been unreachable for 2+ minutes."
        - name: qalitrack.certificates
          rules:
            - alert: CertificateExpiringSoon
              expr: certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 24 * 3600
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Certificate {{ $labels.name }} expiring in <30 days"
                description: "Certificate {{ $labels.name }} in {{ $labels.namespace }} expires soon."
            - alert: CertificateExpired
              expr: certmanager_certificate_expiration_timestamp_seconds - time() < 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Certificate {{ $labels.name }} has expired"
                description: "Certificate {{ $labels.name }} in {{ $labels.namespace }} has expired."
  alertmanager:
    enabled: true
    # Real config (with SMTP password) is applied manually to the cluster.
    # ArgoCD is set to ignoreDifferences on this ConfigMap so it won't overwrite it.
    # To reapply: kubectl replace -f kubernetes/monitoring/alertmanager-config-secret.yaml
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname', 'cluster', 'service']
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 12h
        receiver: 'default'
        routes:
          - match:
              alertname: Watchdog
            receiver: 'null'
          - match:
              severity: critical
            receiver: 'critical'
      receivers:
        - name: 'null'
        - name: 'default'
        - name: 'critical'
loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
  singleBinary:
    replicas: 1
    affinity: {}
    persistence:
      enabled: true
      size: 30Gi
      storageClass: local-path
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    replicas: 1
    affinity: {}
  grafana-agent-operator:
    crds:
      install: false # CRD annotations exceed 262KB K8s limit — CRD already installed
