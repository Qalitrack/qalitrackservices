# ============================================================================
# Qalitrack Platform - Main Configuration (64GB VPS Optimized)
# ============================================================================

global:
  environment: production
  namespace: qalitrack-prod
  imagePullPolicy: Always
  storageClass: "local-path"
  # JWT Configuration
  jwt:
    issuer: "qalitrack"
    audience: "qalitrack"
    expirationMinutes: 60
  # Image Registry (empty so Bitnami sub-charts use their own registries)
  imageRegistry: ""
  security:
    allowInsecureImages: true
# ============================================================================
# GATEWAY SERVICE - API Gateway with JWT Authentication
# ============================================================================
gateway:
  enabled: true
  replicaCount: 2
  fullnameOverride: "gateway-service"
  image:
    repository: gateway-service
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  service:
    type: LoadBalancer
    port: 7000
    targetPort: 80
  env:
    ASPNETCORE_ENVIRONMENT: "Production"
    ASPNETCORE_URLS: "http://+:7000"
# ============================================================================
# USER SERVICE - Authentication & User Management
# ============================================================================
userService:
  enabled: true
  replicaCount: 2
  fullnameOverride: "user-service"
  image:
    repository: user-service
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 7001
    targetPort: 80
  env:
    ASPNETCORE_ENVIRONMENT: "Production"
    ASPNETCORE_URLS: "http://+:80"
    UsePostgreSQL: "true"
    UseRedis: "true"
  postgresql:
    enabled: true
    fullnameOverride: "user-service-postgresql"
    primary:
      resources:
        requests:
          memory: "1Gi"
          cpu: "250m"
        limits:
          memory: "3Gi"
          cpu: "1000m"
      persistence:
        size: 20Gi
# ============================================================================
# MASTERDATA SERVICE - Vehicles, Products, Suppliers
# ============================================================================
masterdata:
  enabled: true
  replicaCount: 2
  fullnameOverride: "masterdata-service"
  image:
    repository: masterdata-service
    tag: main-7bcf9dd
    pullPolicy: Always
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 7002
    targetPort: 80
  postgresql:
    enabled: true
    fullnameOverride: "masterdata-service-postgresql"
    primary:
      resources:
        requests:
          memory: "1Gi"
          cpu: "250m"
        limits:
          memory: "3Gi"
          cpu: "1000m"
      persistence:
        size: 30Gi
# ============================================================================
# TRANSACTION SERVICE - Weighbridge Transactions
# ============================================================================
transaction:
  enabled: true
  replicaCount: 2
  fullnameOverride: "transaction-service"
  image:
    repository: transaction-service
    tag: main-7bcf9dd
    pullPolicy: Always
  resources:
    requests:
      memory: "768Mi"
      cpu: "250m"
    limits:
      memory: "2.5Gi"
      cpu: "1500m"
  service:
    type: ClusterIP
    port: 7003
    targetPort: 80
  postgresql:
    enabled: true
    fullnameOverride: "transaction-service-postgresql"
    primary:
      resources:
        requests:
          memory: "1Gi"
          cpu: "250m"
        limits:
          memory: "3Gi"
          cpu: "1000m"
      persistence:
        size: 50Gi
# ============================================================================
# BACKUP SERVICE - Scheduled Database Backups
# ============================================================================
backup:
  enabled: true
  replicaCount: 1
  fullnameOverride: "backup-service"
  image:
    repository: backup-service
    tag: main-7bcf9dd
    pullPolicy: Always
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  service:
    type: ClusterIP
    port: 7004
    targetPort: 80
  schedule: "0 2 * * *" # Daily at 2 AM
  retention: 30 # Keep backups for 30 days
# ============================================================================
# TECHNICIAN SERVICE - Technician Management
# ============================================================================
technicianService:
  enabled: true
  replicaCount: 2
  fullnameOverride: "technician-service"
  image:
    repository: technician-api
    tag: main-7bcf9dd
    pullPolicy: Always
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 7006
    targetPort: 80
  env:
    ASPNETCORE_ENVIRONMENT: "Production"
    ASPNETCORE_URLS: "http://+:80"
    UsePostgreSQL: "true"
  postgresql:
    enabled: true
    fullnameOverride: "technician-service-postgresql"
    primary:
      resources:
        requests:
          memory: "1Gi"
          cpu: "250m"
        limits:
          memory: "3Gi"
          cpu: "1000m"
      persistence:
        size: 20Gi
# ============================================================================
# QTRUCK SERVICE - Drivers & Fleet Management
# ============================================================================
qtruckService:
  enabled: false # Images not yet built — enable after running CI workflows
  fullnameOverride: "qtruck-service"
  api:
    enabled: true
    replicaCount: 2
    fullnameOverride: "qtruck-api"
    image:
      repository: qtruck-api
      tag: main
    service:
      port: 7007
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
  frontend:
    enabled: true
    replicaCount: 2
    fullnameOverride: "qtruck-frontend"
    image:
      repository: qtruck-frontend
      tag: main
    service:
      port: 7008
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  postgresql:
    enabled: true
    fullnameOverride: "qtruck-service-postgresql"
    primary:
      resources:
        requests:
          memory: "1Gi"
          cpu: "250m"
        limits:
          memory: "3Gi"
          cpu: "1000m"
      persistence:
        size: 20Gi
# ============================================================================
# POSTGRESQL - Shared Configuration
# ============================================================================
postgresql:
  enabled: true
  auth:
    postgresPassword: "changeme"
    database: "qalitrack"
  primary:
    persistence:
      enabled: true
      storageClass: "local-path"
    resources:
      requests:
        memory: "1Gi"
        cpu: "250m"
      limits:
        memory: "3Gi"
        cpu: "1000m"
    # PostgreSQL Performance Tuning for 64GB VPS
    extendedConfiguration: |
      shared_buffers = 1GB
      effective_cache_size = 3GB
      maintenance_work_mem = 256MB
      checkpoint_completion_target = 0.9
      wal_buffers = 16MB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200
      work_mem = 10MB
      min_wal_size = 1GB
      max_wal_size = 4GB
      max_connections = 200
# ============================================================================
# REDIS - Caching Layer
# ============================================================================
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: "changeme"
  master:
    resources:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        memory: "2Gi"
        cpu: "500m"
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "local-path"
  # Redis Configuration for performance
  commonConfiguration: |-
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    save ""
    appendonly yes
    appendfsync everysec
# ============================================================================
# RABBITMQ - Message Queue
# ============================================================================
rabbitmq:
  enabled: true
  replicaCount: 1
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1
  auth:
    username: "qalitrack"
    password: "changeme"
    erlangCookie: "secretcookie"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "local-path"
  # RabbitMQ Configuration
  extraConfiguration: |-
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.relative = 1.0
# ============================================================================
# INGRESS - External Access (Optional - Enable if you want SSL/domain routing)
# By default, Gateway Service is exposed as LoadBalancer
# ============================================================================
ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.qalibrated.co.ke
      paths:
        - path: /
          pathType: Prefix
          service: qalitrack-gateway-service
          port: 7000
    - host: grafana.qalibrated.co.ke
      paths:
        - path: /
          pathType: Prefix
          service: qalitrack-grafana
          port: 80
    - host: prometheus.qalibrated.co.ke
      paths:
        - path: /
          pathType: Prefix
          service: qalitrack-prometheus-server
          port: 80
  tls:
    - secretName: api-qalibrated-tls
      hosts:
        - api.qalibrated.co.ke
    - secretName: grafana-qalibrated-tls
      hosts:
        - grafana.qalibrated.co.ke
    - secretName: prometheus-qalibrated-tls
      hosts:
        - prometheus.qalibrated.co.ke
# ============================================================================
# MONITORING & OBSERVABILITY
# ============================================================================
monitoring:
  enabled: true
  prometheus:
    enabled: true
    fullnameOverride: "prometheus"
    server:
      fullnameOverride: "prometheus-server"
      retention: "15d"
      persistentVolume:
        enabled: true
        size: 50Gi
      resources:
        requests:
          memory: "2Gi"
          cpu: "500m"
        limits:
          memory: "4Gi"
          cpu: "2000m"
      service:
        type: ClusterIP
        port: 80
  grafana:
    enabled: true
    fullnameOverride: "grafana"
    adminPassword: "Qalitrack@2024!"
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    service:
      type: ClusterIP
      port: 80
    # Grafana configuration
    grafana.ini:
      server:
        root_url: "https://grafana.qalibrated.co.ke"
        serve_from_sub_path: false
      auth.anonymous:
        enabled: false
      security:
        admin_user: admin
    # Datasources
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://prometheus-server:80
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki-gateway:80
            access: proxy
    # Pre-installed dashboards
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
  loki:
    enabled: true
    fullnameOverride: "loki"
    persistence:
      enabled: true
      size: 30Gi
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
# ============================================================================
# AUTOSCALING
# ============================================================================
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
# ============================================================================
# RESOURCE SUMMARY for 64GB VPS
# ============================================================================
# Service                Requests    Limits
# ----------------      ---------   --------
# Gateway (x2)           256Mi       512Mi
# User Service (x2)      1Gi         4Gi
# MasterData (x2)        1Gi         4Gi
# Transaction (x2)       1.5Gi       5Gi
# Backup (x1)            256Mi       512Mi
# PostgreSQL (x3)        3Gi         9Gi
# Redis (x1)             512Mi       2Gi
# RabbitMQ (x1)          512Mi       2Gi
# =====================================
# TOTAL Requests:        ~8.5Gi
# TOTAL Limits:          ~27Gi
# Leaves room for OS/system: ~37GB

# Sub-chart overrides (must be at top level, keyed by chart name)
loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
  singleBinary:
    replicas: 1
    affinity: {}
    persistence:
      enabled: true
      size: 30Gi
      storageClass: local-path
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    replicas: 1
    affinity: {}
