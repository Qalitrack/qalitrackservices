apiVersion: v2
name: technician-service
description: Qalitrack Technician Service - Technician management and operations with dedicated user service
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - qalitrack
  - technician
  - management
  - operations

maintainers:
  - name: Qalitrack Team
    email: dev@qalitrack.com

home: https://github.com/Qalitrack/qalitrackservices
sources:
  - https://github.com/Qalitrack/qalitrackservices

dependencies:
  # PostgreSQL for Technician Service
  - name: postgresql
    version: "13.2.24"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
    alias: postgresql

  # PostgreSQL for User Service
  - name: postgresql
    version: "13.2.24"
    repository: "https://charts.bitnami.com/bitnami"
    condition: userServicePostgresql.enabled
    alias: userServicePostgresql

  # Redis for caching (shared)
  - name: redis
    version: "18.6.1"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

  # RabbitMQ for messaging (shared)
  - name: rabbitmq
    version: "12.10.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled
