replicaCount: 1
image:
  repository: ghcr.io/qalitrack/qalitrackservices/technician-api
  pullPolicy: Always
  tag: "main-03acbfa"
imagePullSecrets:
  - name: ghcr-credentials
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podSecurityContext: {}
securityContext:
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
service:
  type: ClusterIP
  port: 7006
  targetPort: 80
resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 5
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3
nodeSelector: {}
tolerations: []
affinity: {}
env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Production"
  - name: ASPNETCORE_URLS
    value: "http://+:80"
  - name: UsePostgreSQL
    value: "true"
  - name: ConnectionStrings__DefaultConnection
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: TECHNICIAN_DB_CONNECTION_STRING
  - name: JWT_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: JWT_SECRET_KEY
  - name: JWT_ISSUER
    value: "qalitrack"
  - name: JWT_AUDIENCE
    value: "qalitrack"
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /app/logs
  - name: wwwroot
    mountPath: /app/wwwroot
volumes:
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}
  - name: wwwroot
    emptyDir: {}
# Dedicated User Service for Technician deployment
userService:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/qalitrack/qalitrackservices/user-service
    pullPolicy: Always
    tag: "main-03acbfa"
  service:
    type: ClusterIP
    port: 7001
    targetPort: 80
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  env:
    - name: ASPNETCORE_ENVIRONMENT
      value: "Production"
    - name: ASPNETCORE_URLS
      value: "http://+:80"
    - name: UsePostgreSQL
      value: "true"
    - name: UseRedis
      value: "true"
    - name: ConnectionStrings__DefaultConnection
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: TECHNICIAN_USER_SERVICE_DB_CONNECTION_STRING
    - name: ConnectionStrings__Redis
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: TECHNICIAN_REDIS_CONNECTION_STRING
    - name: JWT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: JWT_SECRET_KEY
    - name: JWT_ISSUER
      value: "UserService"
    - name: JWT_AUDIENCE
      value: "UserService"
    - name: RABBITMQ_HOST
      value: "technician-rabbitmq"
    - name: RABBITMQ_PORT
      value: "5672"
    - name: RABBITMQ_USERNAME
      value: "admin"
    - name: RABBITMQ_PASSWORD
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: RABBITMQ_PASSWORD
    - name: Email__SmtpHost
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_SMTP_HOST
    - name: Email__SmtpPort
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_SMTP_PORT
    - name: Email__SmtpUsername
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_SMTP_USERNAME
    - name: Email__SmtpPassword
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_SMTP_PASSWORD
    - name: Email__FromEmail
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_FROM_EMAIL
    - name: Email__EnableSsl
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_ENABLE_SSL
    - name: EMAIL_SMTP_HOST
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_SMTP_HOST
    - name: EMAIL_SMTP_PORT
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_SMTP_PORT
    - name: EMAIL_SMTP_USERNAME
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_SMTP_USERNAME
    - name: EMAIL_SMTP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_SMTP_PASSWORD
    - name: EMAIL_FROM_EMAIL
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_FROM_EMAIL
    - name: EMAIL_ENABLE_SSL
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: EMAIL_ENABLE_SSL
postgresql:
  enabled: false
  auth:
    existingSecret: "qalitrack-secrets"
    secretKeys:
      adminPasswordKey: "TECHNICIAN_DB_PASSWORD"
    database: "qalitrack_techniciandb"
  primary:
    resources:
      requests:
        memory: "1Gi"
        cpu: "250m"
      limits:
        memory: "3Gi"
        cpu: "1000m"
    persistence:
      enabled: true
      size: 20Gi
    extendedConfiguration: |
      shared_buffers = 512MB
      max_connections = 600
      work_mem = 2MB
      effective_cache_size = 1GB
      maintenance_work_mem = 128MB
      checkpoint_completion_target = 0.9
      wal_buffers = 16MB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200
      min_wal_size = 1GB
      max_wal_size = 4GB
# PostgreSQL for User Service
userServicePostgresql:
  enabled: false
  auth:
    existingSecret: "qalitrack-secrets"
    secretKeys:
      adminPasswordKey: "TECHNICIAN_DB_PASSWORD"
    database: "userservicedb"
  primary:
    resources:
      requests:
        memory: "1Gi"
        cpu: "250m"
      limits:
        memory: "3Gi"
        cpu: "1000m"
    persistence:
      enabled: true
      size: 20Gi
    extendedConfiguration: |
      shared_buffers = 512MB
      max_connections = 600
      work_mem = 2MB
      effective_cache_size = 1GB
      maintenance_work_mem = 128MB
      checkpoint_completion_target = 0.9
      wal_buffers = 16MB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200
      min_wal_size = 1GB
      max_wal_size = 4GB
# Redis for caching (shared between user service and technician service)
redis:
  enabled: false
  auth:
    enabled: true
    existingSecret: "qalitrack-secrets"
    existingSecretPasswordKey: "TECHNICIAN_REDIS_CONNECTION_STRING"
  master:
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    persistence:
      enabled: true
      size: 5Gi
# RabbitMQ for messaging (shared between user service and technician service)
rabbitmq:
  enabled: false
  auth:
    username: "admin"
    existingPasswordSecret: "qalitrack-secrets"
    existingSecretPasswordKey: "RABBITMQ_PASSWORD"
    existingErlangCookieSecret: "qalitrack-secrets"
    existingErlangCookieSecretKey: "RABBITMQ_ERLANG_COOKIE"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 5Gi
