{{- if .Values.userService.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "technician-service.fullname" . }}-user-service
  labels:
    {{- include "technician-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-service
spec:
  type: {{ .Values.userService.service.type }}
  ports:
    - port: {{ .Values.userService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "technician-service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: user-service
{{- end }}
