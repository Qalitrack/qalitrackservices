# QTruck Service Configuration

imagePullSecrets:
  - name: ghcr-secret

# QTruck API (Django/Python Backend)
api:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/qalitrack/qalitrackservices/qtruck-api
    pullPolicy: Always
    tag: "main"

  service:
    type: ClusterIP
    port: 7007
    targetPort: 8000

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  env:
    - name: DB_ENGINE
      value: "postgresql"
    - name: DB_HOST
      value: "qtruck-service-postgresql"
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: "qtruck"
    - name: DB_USER
      value: "postgres"
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: qalitrack-secrets
          key: QTRUCK_DB_PASSWORD
    - name: ALLOWED_HOSTS
      value: "*"
    - name: CORS_ALLOW_ALL_ORIGINS
      value: "True"

# QTruck Frontend (Next.js)
frontend:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/qalitrack/qalitrackservices/qtruck-frontend
    pullPolicy: Always
    tag: "main"

  service:
    type: ClusterIP
    port: 7008
    targetPort: 3000

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  env:
    - name: API_URL
      value: "http://qtruck-service-api:7007/api"
    - name: SITE_URL
      value: "https://qalibrated.co.ke"
    - name: APP_NAME
      value: "QTruck"
    - name: NEXT_PUBLIC_API_URL
      value: "/api/qtruck"
    - name: NEXT_PUBLIC_SITE_URL
      value: "https://qalibrated.co.ke"
    - name: NEXT_PUBLIC_APP_NAME
      value: "QTruck"

# PostgreSQL with PostGIS
postgresql:
  enabled: true
  auth:
    existingSecret: "qalitrack-secrets"
    secretKeys:
      adminPasswordKey: "POSTGRES_ADMIN_PASSWORD"
    database: "qtruck"

  image:
    registry: docker.io
    repository: postgis/postgis
    tag: "15-3.4-alpine"

  primary:
    resources:
      requests:
        memory: "1Gi"
        cpu: "250m"
      limits:
        memory: "3Gi"
        cpu: "1000m"

    persistence:
      enabled: true
      size: 20Gi

    extendedConfiguration: |
      shared_buffers = 512MB
      max_connections = 600
      work_mem = 2MB
      effective_cache_size = 1GB
      maintenance_work_mem = 128MB
      checkpoint_completion_target = 0.9
      wal_buffers = 16MB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200
      min_wal_size = 1GB
      max_wal_size = 4GB
