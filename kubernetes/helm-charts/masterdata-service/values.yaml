replicaCount: 1
image:
  repository: ghcr.io/qalitrack/qalitrackservices/masterdata-service
  pullPolicy: Always
  tag: "main-5461564"
imagePullSecrets:
  - name: ghcr-credentials
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "7002"
  prometheus.io/path: "/metrics"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
service:
  type: ClusterIP
  port: 7002
  targetPort: 7002
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
startupProbe:
  httpGet:
    path: /health
    port: 7002
  failureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 5
livenessProbe:
  httpGet:
    path: /health
    port: 7002
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: 7002
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - masterdata-service
          topologyKey: kubernetes.io/hostname
env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Production"
  - name: ASPNETCORE_URLS
    value: "http://+:7002"
  - name: JWT_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: JWT_SECRET_KEY
  - name: MASTER_DATA_DB_HOST
    value: "masterdata-service-postgresql"
  - name: MASTER_DATA_DB_PORT
    value: "5432"
  - name: MASTER_DATA_DB_NAME
    value: "qalitrack_master_data"
  - name: MASTER_DATA_DB_USERNAME
    value: "postgres"
  - name: MASTER_DATA_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: MASTER_DATA_DB_PASSWORD
  - name: POSTGRES_HOST
    value: "masterdata-service-postgresql"
  - name: POSTGRES_PORT
    value: "5432"
  - name: POSTGRES_DATABASE
    value: "qalitrack_master_data"
  - name: POSTGRES_USERNAME
    value: "postgres"
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: MASTER_DATA_DB_PASSWORD
  - name: ConnectionStrings__DefaultConnection
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: MASTER_DATA_DB_CONNECTION_STRING
  - name: EMAIL_SMTP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_SMTP_PASSWORD
  - name: RABBITMQ_HOST
    value: "rabbitmq"
  - name: RABBITMQ_PORT
    value: "5672"
  - name: RABBITMQ_USERNAME
    value: "qalitrack"
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: RABBITMQ_PASSWORD
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /app/logs
volumes:
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}
