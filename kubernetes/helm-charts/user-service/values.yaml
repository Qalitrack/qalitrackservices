replicaCount: 2
image:
  repository: ghcr.io/qalitrack/qalitrackservices/user-service
  pullPolicy: Always
  tag: "main-03acbfa"
imagePullSecrets:
  - name: ghcr-credentials
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "7001"
  prometheus.io/path: "/metrics"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
service:
  type: ClusterIP
  port: 7001
  targetPort: 7001
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
startupProbe:
  httpGet:
    path: /health
    port: 7001
  failureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 5
livenessProbe:
  httpGet:
    path: /health
    port: 7001
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: 7001
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - user-service
          topologyKey: kubernetes.io/hostname
env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Production"
  - name: ASPNETCORE_URLS
    value: "http://+:7001"
  - name: JWT_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: JWT_SECRET_KEY
  - name: USER_SERVICE_DB_HOST
    value: "user-service-postgresql"
  - name: USER_SERVICE_DB_PORT
    value: "5432"
  - name: USER_SERVICE_DB_NAME
    value: "qalitrack_user_service"
  - name: USER_SERVICE_DB_USERNAME
    value: "postgres"
  - name: USER_SERVICE_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: USER_SERVICE_DB_PASSWORD
  - name: USER_SERVICE_REDIS_HOST
    value: "user-service-redis-master"
  - name: USER_SERVICE_REDIS_PORT
    value: "6379"
  - name: USER_SERVICE_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: USER_SERVICE_REDIS_PASSWORD
        optional: true
  - name: ConnectionStrings__Redis
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: USER_SERVICE_REDIS_CONNECTION_STRING
  - name: ConnectionStrings__DefaultConnection
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: USER_SERVICE_DB_CONNECTION_STRING
  - name: Email__SmtpHost
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_SMTP_HOST
  - name: Email__SmtpPort
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_SMTP_PORT
  - name: Email__SmtpUsername
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_SMTP_USERNAME
  - name: Email__SmtpPassword
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_SMTP_PASSWORD
  - name: Email__FromEmail
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_FROM_EMAIL
  - name: Email__EnableSsl
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_ENABLE_SSL
  - name: EMAIL_SMTP_HOST
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_SMTP_HOST
  - name: EMAIL_SMTP_PORT
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_SMTP_PORT
  - name: EMAIL_SMTP_USERNAME
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_SMTP_USERNAME
  - name: EMAIL_SMTP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_SMTP_PASSWORD
  - name: EMAIL_FROM_EMAIL
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_FROM_EMAIL
  - name: EMAIL_ENABLE_SSL
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: EMAIL_ENABLE_SSL
  - name: RABBITMQ_HOST
    value: "rabbitmq"
  - name: RABBITMQ_PORT
    value: "5672"
  - name: RABBITMQ_USERNAME
    value: "qalitrack"
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qalitrack-secrets
        key: RABBITMQ_PASSWORD
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /app/logs
volumes:
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}
