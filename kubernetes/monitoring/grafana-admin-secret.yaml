# Grafana admin credentials
# Apply manually — do NOT commit with real values:
#   kubectl create secret generic grafana-admin-secret \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="YOUR_GRAFANA_PASSWORD" \
#     -n monitoring
#
# Current password: Qalitrack@2024! (change after first login)
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: qalitrack
type: Opaque
stringData:
  admin-user: admin
  # admin-password: managed outside git — apply manually using the command above
