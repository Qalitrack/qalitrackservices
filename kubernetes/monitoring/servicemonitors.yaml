# ServiceMonitors for Qalitrack microservices
# Tells Prometheus which services to scrape for metrics
#
# NOTE: These are standalone Kubernetes resources (not Helm templates)
# If deploying to a different namespace, update all "namespace: qalitrack-prod" lines below
# Or use: kubectl apply -f servicemonitors.yaml -n <your-namespace>

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service-metrics
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: qalitrack
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 7000
      targetPort: 7000
      protocol: TCP
  selector:
    app.kubernetes.io/name: gateway-service

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway-service
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: qalitrack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

