# NGINX Ingress Controller Configuration for 64GB VPS

controller:
  # Number of replicas
  replicaCount: 2

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Service configuration
  service:
    type: LoadBalancer
    # External traffic policy for preserving client IP
    externalTrafficPolicy: Local

    # Annotations for cloud providers (customize if needed)
    annotations: {}
      # For AWS:
      # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      # For GCP:
      # cloud.google.com/load-balancer-type: "Internal"
      # For DigitalOcean:
      # service.beta.kubernetes.io/do-loadbalancer-enable-proxy-protocol: "true"

  # Ingress class name
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
    controllerValue: "k8s.io/ingress-nginx"

  # Enable metrics for Prometheus
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false  # Set to true if you have Prometheus Operator
      namespace: qalitrack-monitoring

  # Pod anti-affinity for high availability
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - ingress-nginx
          topologyKey: kubernetes.io/hostname

  # Configure timeouts
  config:
    # Client body size (max upload size)
    proxy-body-size: "50m"

    # Timeouts
    proxy-connect-timeout: "60"
    proxy-send-timeout: "60"
    proxy-read-timeout: "60"

    # Enable real IP forwarding
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"

    # SSL configuration
    ssl-protocols: "TLSv1.2 TLSv1.3"
    ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

    # Logging
    log-format-upstream: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_length $request_time [$proxy_upstream_name] [$proxy_alternative_upstream_name] $upstream_addr $upstream_response_length $upstream_response_time $upstream_status $req_id'

  # Enable admission webhooks
  admissionWebhooks:
    enabled: true

# Default backend (404 page)
defaultBackend:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 20Mi
    limits:
      cpu: 50m
      memory: 64Mi

# RBAC
rbac:
  create: true

# Service account
serviceAccount:
  create: true
  name: ingress-nginx

# Resource summary for 64GB VPS:
# Controller:      128Mi - 512Mi (x2 replicas) = 256Mi - 1Gi
# Default Backend: 20Mi  - 64Mi
# ----------------------------------
# TOTAL:           ~276Mi - 1.06Gi
