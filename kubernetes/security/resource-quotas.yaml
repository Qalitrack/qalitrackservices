# Resource Quotas and Limit Ranges for qalitrack-prod namespace
# Prevents resource exhaustion and ensures fair resource allocation

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: qalitrack-compute-quota
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/part-of: qalitrack
spec:
  hard:
    # Total CPU/Memory limits for entire namespace
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "50"
    limits.memory: 60Gi

    # Storage
    requests.storage: 500Gi
    persistentvolumeclaims: "25"

    # Objects
    pods: "100"
    services: "50"
    configmaps: "50"
    secrets: "50"

    # Load Balancers (limit external IPs)
    services.loadbalancers: "5"

    # Node Ports (limit exposed ports)
    services.nodeports: "5"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: qalitrack-limit-range
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/part-of: qalitrack
spec:
  limits:
    # Pod limits
    - type: Pod
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: "10m"
        memory: "32Mi"

    # Container limits
    - type: Container
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: "10m"
        memory: "32Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      maxLimitRequestRatio:
        cpu: "4"
        memory: "4"

    # PVC limits
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
      min:
        storage: 1Gi

---
# Additional quotas for monitoring best practices
apiVersion: v1
kind: ResourceQuota
metadata:
  name: qalitrack-object-quota
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/part-of: qalitrack
spec:
  hard:
    # Limit HPA to prevent quota exhaustion
    count/horizontalpodautoscalers.autoscaling: "20"

    # Limit ingresses
    count/ingresses.networking.k8s.io: "10"

    # Limit jobs and cronjobs
    count/jobs.batch: "50"
    count/cronjobs.batch: "10"
