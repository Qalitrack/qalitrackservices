apiVersion: batch/v1
kind: Job
metadata:
  name: manual-postgres-backup
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: qalitrack
    backup-type: manual
spec:
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-backup
        app.kubernetes.io/part-of: qalitrack
    spec:
      restartPolicy: OnFailure

      containers:
      - name: backup
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent

        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Starting MANUAL PostgreSQL backup at $(date)"

          BACKUP_DIR="/backups/manual-$(date +%Y-%m-%d-%H%M%S)"
          mkdir -p $BACKUP_DIR

          # Backup the shared qalitrackdb (all per-service schemas: masterdata, transactions, users, backup)
          echo "Backing up qalitrackdb database..."
          PGPASSWORD=$DB_PASSWORD pg_dump \
            -h $DB_HOST \
            -p 5432 \
            -U $DB_USER \
            -d $DB_NAME \
            -F c \
            -f $BACKUP_DIR/qalitrackdb.backup

          # Create checksums
          echo "Creating checksums..."
          cd $BACKUP_DIR
          sha256sum *.backup > checksums.txt

          # Compress backup directory
          echo "Compressing backups..."
          tar -czf /backups/qalitrack-manual-backup-$(date +%Y-%m-%d-%H%M%S).tar.gz \
            -C /backups $(basename $BACKUP_DIR)

          # Remove uncompressed directory
          rm -rf $BACKUP_DIR

          echo "MANUAL backup completed successfully at $(date)"

          # List current backups
          echo "Current backups:"
          ls -lh /backups/*.tar.gz | tail -10

        env:
        - name: DB_HOST
          value: "qalitrack-postgresql"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: qalitrack-secrets
              key: DB_USER
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: qalitrack-secrets
              key: DB_NAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qalitrack-secrets
              key: DB_PASSWORD

        volumeMounts:
        - name: backup-storage
          mountPath: /backups

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi

      volumes:
      - name: backup-storage
        persistentVolumeClaim:
          claimName: backup-storage-pvc
