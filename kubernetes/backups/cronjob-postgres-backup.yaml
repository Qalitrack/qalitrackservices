apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: qalitrack
spec:
  # Run daily at 2:00 AM UTC
  schedule: "0 2 * * *"

  # Keep last 3 successful jobs and 1 failed job
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # Don't start new job if previous one is still running
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      # Clean up finished pods after 1 hour
      ttlSecondsAfterFinished: 3600

      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: qalitrack
        spec:
          restartPolicy: OnFailure

          containers:
          - name: backup
            image: postgres:15-alpine
            imagePullPolicy: IfNotPresent

            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting PostgreSQL backup at $(date)"

              BACKUP_DIR="/backups/$(date +%Y-%m-%d)"
              mkdir -p $BACKUP_DIR

              # Backup User Service DB
              echo "Backing up user-service database..."
              PGPASSWORD=$USER_DB_PASSWORD pg_dump \
                -h $USER_DB_HOST \
                -p 5432 \
                -U postgres \
                -d qalitrack_user_service \
                -F c \
                -f $BACKUP_DIR/user-service.backup

              # Backup MasterData Service DB
              echo "Backing up masterdata-service database..."
              PGPASSWORD=$MASTERDATA_DB_PASSWORD pg_dump \
                -h $MASTERDATA_DB_HOST \
                -p 5432 \
                -U postgres \
                -d qalitrack_master_data \
                -F c \
                -f $BACKUP_DIR/masterdata-service.backup

              # Backup Transaction Service DB
              echo "Backing up transaction-service database..."
              PGPASSWORD=$TRANSACTION_DB_PASSWORD pg_dump \
                -h $TRANSACTION_DB_HOST \
                -p 5432 \
                -U postgres \
                -d qalitrack_transaction \
                -F c \
                -f $BACKUP_DIR/transaction-service.backup

              # Backup Technician Service DB
              echo "Backing up technician-service database..."
              PGPASSWORD=$TECHNICIAN_DB_PASSWORD pg_dump \
                -h $TECHNICIAN_DB_HOST \
                -p 5432 \
                -U postgres \
                -d qalitrack_techniciandb \
                -F c \
                -f $BACKUP_DIR/technician-service.backup

              # Create checksums
              echo "Creating checksums..."
              cd $BACKUP_DIR
              sha256sum *.backup > checksums.txt

              # Compress backup directory
              echo "Compressing backups..."
              tar -czf /backups/qalitrack-backup-$(date +%Y-%m-%d).tar.gz \
                -C /backups $(date +%Y-%m-%d)

              # Remove uncompressed directory
              rm -rf $BACKUP_DIR

              # Clean up old backups (keep last 30 days)
              echo "Cleaning up old backups..."
              find /backups -name "qalitrack-backup-*.tar.gz" -mtime +30 -delete

              echo "Backup completed successfully at $(date)"

              # List current backups
              echo "Current backups:"
              ls -lh /backups/*.tar.gz | tail -10

            env:
            - name: USER_DB_HOST
              value: "user-service-postgresql"
            - name: USER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qalitrack-secrets
                  key: USER_SERVICE_DB_PASSWORD

            - name: MASTERDATA_DB_HOST
              value: "masterdata-service-postgresql"
            - name: MASTERDATA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qalitrack-secrets
                  key: MASTER_DATA_DB_PASSWORD

            - name: TRANSACTION_DB_HOST
              value: "transaction-service-postgresql"
            - name: TRANSACTION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qalitrack-secrets
                  key: TRANSACTION_DB_PASSWORD

            - name: TECHNICIAN_DB_HOST
              value: "technician-service-postgresql"
            - name: TECHNICIAN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qalitrack-secrets
                  key: TECHNICIAN_DB_PASSWORD

            volumeMounts:
            - name: backup-storage
              mountPath: /backups

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi

          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-storage-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-storage-pvc
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: qalitrack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # storageClassName: local-path  # Uncomment if using specific storage class
