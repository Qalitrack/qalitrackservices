apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: qalitrack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-backup
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: qalitrack
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["qalitrack-secrets"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-backup
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: qalitrack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-backup
subjects:
- kind: ServiceAccount
  name: postgres-backup
  namespace: qalitrack-prod
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: qalitrack
spec:
  # Run daily at 2:00 AM UTC
  schedule: "0 2 * * *"

  # Keep last 3 successful jobs and 1 failed job
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # Don't start new job if previous one is still running
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      # Clean up finished pods after 1 hour
      ttlSecondsAfterFinished: 3600

      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: qalitrack
        spec:
          restartPolicy: OnFailure
          serviceAccountName: postgres-backup

          containers:
          - name: backup
            image: postgres:15-alpine
            imagePullPolicy: IfNotPresent

            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting PostgreSQL backup at $(date)"

              BACKUP_DIR="/backups/$(date +%Y-%m-%d)"
              mkdir -p $BACKUP_DIR

              # Backup the shared qalitrackdb (all per-service schemas: masterdata, transactions, users, backup)
              echo "Backing up qalitrackdb database..."
              PGPASSWORD=$DB_PASSWORD pg_dump \
                -h $DB_HOST \
                -p 5432 \
                -U $DB_USER \
                -d $DB_NAME \
                -F c \
                -f $BACKUP_DIR/qalitrackdb.backup

              # Create checksums
              echo "Creating checksums..."
              cd $BACKUP_DIR
              sha256sum *.backup > checksums.txt

              # Compress backup directory
              echo "Compressing backups..."
              tar -czf /backups/qalitrack-backup-$(date +%Y-%m-%d).tar.gz \
                -C /backups $(date +%Y-%m-%d)

              # Remove uncompressed directory
              rm -rf $BACKUP_DIR

              # Clean up old backups (keep last 30 days)
              echo "Cleaning up old backups..."
              find /backups -name "qalitrack-backup-*.tar.gz" -mtime +30 -delete

              echo "Backup completed successfully at $(date)"

              # List current backups
              echo "Current backups:"
              ls -lh /backups/*.tar.gz | tail -10

            env:
            - name: DB_HOST
              value: "qalitrack-postgresql"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: qalitrack-secrets
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: qalitrack-secrets
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qalitrack-secrets
                  key: DB_PASSWORD

            volumeMounts:
            - name: backup-storage
              mountPath: /backups

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi

          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-storage-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-storage-pvc
  namespace: qalitrack-prod
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: qalitrack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # storageClassName: local-path  # Uncomment if using specific storage class
