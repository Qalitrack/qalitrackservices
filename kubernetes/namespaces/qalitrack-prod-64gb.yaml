apiVersion: v1
kind: Namespace
metadata:
  name: qalitrack-prod
  labels:
    name: qalitrack-prod
    environment: production
    managed-by: qalitrack
    app.kubernetes.io/part-of: qalitrack
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: qalitrack-prod-quota
  namespace: qalitrack-prod
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 10Gi
    limits.cpu: "12"
    limits.memory: 30Gi
    persistentvolumeclaims: "20"
    services: "20"
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: qalitrack-prod-limits
  namespace: qalitrack-prod
spec:
  limits:
  - max:
      cpu: "2"
      memory: 4Gi
    min:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container
  - max:
      cpu: "8"
      memory: 16Gi
    min:
      cpu: 100m
      memory: 128Mi
    type: Pod
