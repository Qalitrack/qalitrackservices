apiVersion: v1
kind: Namespace
metadata:
  name: qalitrack-monitoring
  labels:
    name: qalitrack-monitoring
    environment: shared
    managed-by: qalitrack
    app.kubernetes.io/part-of: qalitrack
    purpose: observability
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: qalitrack-monitoring-quota
  namespace: qalitrack-monitoring
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    services: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: qalitrack-monitoring-limits
  namespace: qalitrack-monitoring
spec:
  limits:
  - max:
      cpu: "2"
      memory: 4Gi
    min:
      cpu: 50m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 256Mi
    type: Container
