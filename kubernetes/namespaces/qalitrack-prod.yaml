apiVersion: v1
kind: Namespace
metadata:
  name: qalitrack-prod
  labels:
    name: qalitrack-prod
    environment: production
    managed-by: qalitrack
    app.kubernetes.io/part-of: qalitrack
---
apiVersion: v1
kind: LimitRange
metadata:
  name: qalitrack-prod-limits
  namespace: qalitrack-prod
spec:
  limits:
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 250m
      memory: 256Mi
    type: Container
