version: '3.8'

services:
  # API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "7000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__SecretKey=ProductionSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
      - Jwt__Issuer=UserService
      - Jwt__Audience=UserService
    depends_on:
      - user-service
      - organization-service
      - vehicle-service
      - driver-service
      - product-service
      - route-service
      - weighbridge-service
      - customer-service
      - supplier-service
      - transporter-service
      - sacco-service
      - weight-data-service
      - compliance-service
      - operational-data-service
      - transaction-service
      - analytics-service
      - data-sync-service
      - archive-service
    networks:
      - qalitrack-network
    restart: unless-stopped
    volumes:
      - ./gateway/logs:/app/logs

  # Master Data Services
  user-service:
    build:
      context: ./apps/masterdata/user-service
      dockerfile: Dockerfile
    ports:
      - "7001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/userservice.db
      - Jwt__SecretKey=ProductionSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
      - Jwt__Issuer=UserService
      - Jwt__Audience=UserService
      - Jwt__AccessTokenExpirationMinutes=60
      - Jwt__RefreshTokenExpirationDays=7
    volumes:
      - user-data:/data
      - ./apps/masterdata/user-service/logs:/app/logs
    networks:
      - qalitrack-network
    restart: unless-stopped

  organization-service:
