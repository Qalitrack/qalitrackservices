version: '3.8'

services:
  # API Gateway
  gateway:
    build:
      context: ../../packages/microservices/ProductionGateway
      dockerfile: Dockerfile
    ports:
      - "7000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__SecretKey=DevelopmentSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
      - Jwt__Issuer=QalitrackGateway
      - Jwt__Audience=QalitrackGateway
    depends_on:
      - user-service
      - masterdata-service
      - transaction-service
    networks:
      - qalitrack-network
    restart: unless-stopped
    volumes:
      - gateway-logs:/app/logs

  # User Service
  user-service:
    build:
      context: ../../packages/microservices/masterdata/user-service
      dockerfile: Dockerfile
    ports:
      - "7001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UsePostgreSQL=false
      - ConnectionStrings__DefaultConnection=Data Source=/data/userservice.db
      - Jwt__SecretKey=DevelopmentSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
      - Jwt__Issuer=UserService
      - Jwt__Audience=UserService
      - Jwt__AccessTokenExpirationMinutes=60
      - Jwt__RefreshTokenExpirationDays=7
    volumes:
      - user-data:/data
      - user-logs:/app/logs
    networks:
      - qalitrack-network
    restart: unless-stopped

  # Masterdata Service (consolidated masterdata APIs)
  masterdata-service:
    build:
      context: ../../packages/microservices/masterdata/masterdata
      dockerfile: Dockerfile
    ports:
      - "7002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UsePostgreSQL=false
      - ConnectionStrings__DefaultConnection=Data Source=/data/masterdata.db
    volumes:
      - masterdata-data:/data
      - masterdata-logs:/app/logs
    networks:
      - qalitrack-network
    restart: unless-stopped

  # Transaction Service
  transaction-service:
    build:
      context: ../../packages/microservices/masterdata/transaction
      dockerfile: Dockerfile
    ports:
      - "7015:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UsePostgreSQL=false
      - ConnectionStrings__DefaultConnection=Data Source=/data/transaction.db
    volumes:
      - transaction-data:/data
      - transaction-logs:/app/logs
    networks:
      - qalitrack-network
    restart: unless-stopped

  # Backup Service
  backup-service:
    build:
      context: ../../packages/microservices/masterdata/BackupService
      dockerfile: Dockerfile
    ports:
      - "7020:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/backup.db
    volumes:
      - backup-data:/data
      - backup-logs:/app/logs
      - backup-storage:/backups
    networks:
      - qalitrack-network
    restart: unless-stopped

  # --- COMMENTED OUT: Services not yet implemented ---
