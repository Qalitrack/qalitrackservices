        condition: service_healthy
volumes:
  user_service_data: null
  organization_service_data: null
  weighbridge_service_data: null
  compliance_service_data: null
  analytics_service_data: null
  data_sync_service_data: null
  archive_service_data: null
  weight_data_service_data: null
  transaction_service_data: null
networks:
  qalitrack-nwa:
    driver: bridge
