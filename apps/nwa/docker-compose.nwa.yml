version: '3.8'
services:
  gateway:
    build:
      context: ../../packages/qalitrack-gateway
      dockerfile: Dockerfile
    ports:
    - 7000:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Government
    - CLIENT_CODE=nwa
    - Jwt__SecretKey=ProductionSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
    - Jwt__Issuer=UserService
    - Jwt__Audience=UserService
    networks:
    - qalitrack-nwa
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - ../../configs/clients/nwa.yml:/app/configs/clients/nwa.yml:ro
    - ../../configs/auth/nwa-ocelot.json:/app/ocelot.json:ro
    depends_on:
      user-service:
        condition: service_healthy
    deploy:
      replicas: 3
  user-service:
    build:
      context: ../../packages/microservices/masterdata/user-service
      dockerfile: Dockerfile
    ports:
    - 7001:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Government
    - CLIENT_CODE=nwa
    - ConnectionStrings__DefaultConnection=Data Source=/data/userservice.db
    - Jwt__SecretKey=ProductionSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
    - Jwt__Issuer=UserService
    - Jwt__Audience=UserService
    networks:
    - qalitrack-nwa
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - user_service_data:/data
    - ./user-service/logs:/app/logs
    deploy:
      replicas: 2
  organization-service:
    build:
      context: ../../packages/microservices/masterdata/organization-service
      dockerfile: Dockerfile
    ports:
    - 7002:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Government
    - CLIENT_CODE=nwa
    - ConnectionStrings__DefaultConnection=Data Source=/data/organizationservice.db
    networks:
    - qalitrack-nwa
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - organization_service_data:/data
    - ./organization-service/logs:/app/logs
    depends_on:
      user-service:
        condition: service_healthy
    deploy:
      replicas: 2
  weighbridge-service:
    build:
      context: ../../packages/microservices/masterdata/weighbridge-service
      dockerfile: Dockerfile
    ports:
    - 7007:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Government
    - CLIENT_CODE=nwa
    - ConnectionStrings__DefaultConnection=Data Source=/data/weighbridgeservice.db
    networks:
    - qalitrack-nwa
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - weighbridge_service_data:/data
    - ./weighbridge-service/logs:/app/logs
    depends_on:
      user-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
    deploy:
      replicas: 2
  compliance-service:
    build:
      context: ../../packages/microservices/datamanager/compliance-service
      dockerfile: Dockerfile
    ports:
    - 7013:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Government
    - CLIENT_CODE=nwa
    - ConnectionStrings__DefaultConnection=Data Source=/data/complianceservice.db
    networks:
