services:
  nginx-proxy:
    build: .  # Use our custom image with certbot
    container_name: nginx-main-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./templates:/templates:ro  # Template configs
      - ./logs:/var/log/nginx
      - ./ssl-certs:/etc/letsencrypt  # SSL certificates (read-write for certbot)
      - ./certbot-webroot:/var/www/certbot
    networks:
      - proxy-network
      - website_qs-network  # Connect to app networks directly

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./ssl-certs:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
    networks:
      - proxy-network
    profiles:
      - ssl-setup

networks:
  proxy-network:
    driver: bridge
    name: proxy-network
  website_qs-network:
    external: true  # Use existing network from website services