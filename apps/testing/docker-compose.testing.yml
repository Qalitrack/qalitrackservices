version: '3.8'
services:
  gateway:
    build:
      context: ../../packages/qalitrack-gateway
      dockerfile: Dockerfile
    ports:
    - 7000:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - CLIENT_CODE=testing
    - Jwt__SecretKey=ProductionSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
    - Jwt__Issuer=UserService
    - Jwt__Audience=UserService
    networks:
    - qalitrack-testing
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - ../../configs/clients/testing.yml:/app/configs/clients/testing.yml:ro
    - ../../configs/auth/testing-ocelot.json:/app/ocelot.json:ro
    depends_on:
      user-service:
        condition: service_healthy
  user-service:
    build:
      context: ../../packages/microservices/masterdata/user-service
      dockerfile: Dockerfile
    ports:
    - 7001:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - CLIENT_CODE=testing
    - ConnectionStrings__DefaultConnection=Data Source=/data/userservice.db
    - Jwt__SecretKey=ProductionSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
    - Jwt__Issuer=UserService
    - Jwt__Audience=UserService
    networks:
    - qalitrack-testing
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - user_service_data:/data
    - ./user-service/logs:/app/logs
  service-discovery:
    build:
      context: ../../packages/service-discovery
      dockerfile: Dockerfile
    ports:
    - 7019:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - CLIENT_CODE=testing
    - ConnectionStrings__DefaultConnection=Data Source=/data/servicediscovery.db
    networks:
    - qalitrack-testing
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - service_discovery_data:/data
    - ./service-discovery/logs:/app/logs
  swagger-aggregator:
    build:
      context: ../../packages/swagger-aggregator
      dockerfile: Dockerfile
    ports:
    - 8000:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - CLIENT_CODE=testing
    - ASPNETCORE_URLS=http://+:80
    - ASPNETCORE_HTTP_PORTS=80
    networks:
    - qalitrack-testing
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - ../../configs/clients/testing.yml:/app/configs/clients/testing.yml:ro
  product-service:
    build:
      context: ../../packages/microservices/masterdata/product-service
      dockerfile: Dockerfile
    ports:
    - 7005:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - CLIENT_CODE=testing
    - ConnectionStrings__DefaultConnection=Data Source=/data/productservice.db
    networks:
    - qalitrack-testing
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - product_service_data:/data
    - ./product-service/logs:/app/logs
    depends_on:
      user-service:
        condition: service_healthy
  customer-service:
    build:
      context: ../../packages/microservices/masterdata/customer-service
      dockerfile: Dockerfile
    ports:
    - 7003:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - CLIENT_CODE=testing
    - ConnectionStrings__DefaultConnection=Data Source=/data/customerservice.db
    networks:
    - qalitrack-testing
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - customer_service_data:/data
    - ./customer-service/logs:/app/logs
    depends_on:
      user-service:
        condition: service_healthy
volumes:
  user_service_data: null
  service_discovery_data: null
  product_service_data: null
  customer_service_data: null
networks:
  qalitrack-testing:
    driver: bridge
