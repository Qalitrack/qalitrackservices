version: '3.8'

# Mock services overlay - use with: docker-compose -f docker-compose.testing.yml -f docker-compose.mock.yml up
services:
  user-service:
    build:
      context: ../../packages/testing/mock-user-service
      dockerfile: Dockerfile
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - CLIENT_CODE=testing
    - Jwt__SecretKey=ProductionSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
    - Jwt__Issuer=MockUserService
    - Jwt__Audience=MockUserService
    volumes: []  # Override any volume mounts from base

  gateway:
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - CLIENT_CODE=testing
    - Jwt__SecretKey=ProductionSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
    - Jwt__Issuer=MockUserService
    - Jwt__Audience=MockUserService
    - USE_MOCK_SERVICES=true