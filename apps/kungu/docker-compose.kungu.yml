version: '3.8'
services:
  gateway:
    build:
      context: ../../packages/qalitrack-gateway
      dockerfile: Dockerfile
    ports:
    - 7000:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Production
    - CLIENT_CODE=kungu
    - Jwt__SecretKey=ProductionSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
    - Jwt__Issuer=UserService
    - Jwt__Audience=UserService
    networks:
    - qalitrack-kungu
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      user-service:
        condition: service_healthy
  user-service:
    build:
      context: ../../packages/microservices/masterdata/user-service
      dockerfile: Dockerfile
    ports:
    - 7001:80
    environment:
    - ASPNETCORE_ENVIRONMENT=Production
    - CLIENT_CODE=kungu
    - ConnectionStrings__DefaultConnection=Data Source=/data/userservice.db
    - Jwt__SecretKey=ProductionSecretKeyForJWTWhichShouldBeAtLeast32CharactersLong!
    - Jwt__Issuer=UserService
    - Jwt__Audience=UserService
    networks:
    - qalitrack-kungu
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
    - user_service_data:/data
    - ./user-service/logs:/app/logs
  organization-service:
