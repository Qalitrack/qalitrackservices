services:
  # Redis Cache (Admin credentials for Vault to manage dynamic users)
  redis:
    image: redis:7-alpine
    container_name: qalitrack-dev-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass dev-vault-redis-admin-pass-65da97fc0f5324dfbb639e7ef868d476
    volumes:
      - redis_data:/data
    networks:
      - qalitrack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "dev-vault-redis-admin-pass-65da97fc0f5324dfbb639e7ef868d476", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "qalitrack.service=cache"
      - "qalitrack.environment=development"

  # RabbitMQ Message Broker (Admin credentials for Vault to manage dynamic users)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: qalitrack-dev-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=vault-rabbitmq-admin
      - RABBITMQ_DEFAULT_PASS=dev-vault-rabbitmq-admin-pass-hyU7BWbk0v44rU1K3AgobdIEhLcbxyGU
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - qalitrack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "qalitrack.service=messaging"
      - "qalitrack.environment=development"

# Volumes and networks defined in 00-volumes-networks.yml