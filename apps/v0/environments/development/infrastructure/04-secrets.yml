services:
  # HashiCorp Vault (Development/Production Mode)
  vault:
    image: hashicorp/vault:latest
    container_name: qalitrack-dev-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=8a5c44e9-6ee7-441f-8d5f-7250c4358b59
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_API_ADDR=http://0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
    networks:
      - qalitrack
    restart: unless-stopped
    command: ["vault", "server", "-dev"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "qalitrack.service=secrets"
      - "qalitrack.environment=development"

# Volumes and networks defined in 00-volumes-networks.yml