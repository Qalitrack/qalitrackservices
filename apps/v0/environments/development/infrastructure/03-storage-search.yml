services:
  # MinIO Object Storage (Admin credentials for Vault to manage dynamic access keys)
  minio:
    image: minio/minio:latest
    container_name: qalitrack-dev-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=vault-minio-admin
      - MINIO_ROOT_PASSWORD=dev-vault-minio-admin-pass-Rx+AV0RxgDVFtRhG43i_duJdtNYH2L4D
    volumes:
      - minio_data:/data
    networks:
      - qalitrack
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      - "qalitrack.service=storage"
      - "qalitrack.environment=development"

  # ZincSearch (Admin credentials for Vault to manage dynamic users)
  zincsearch:
    image: public.ecr.aws/zinclabs/zincsearch:latest
    container_name: qalitrack-dev-zincsearch
    ports:
      - "4080:4080"
    environment:
      - ZINC_FIRST_ADMIN_USER=vault-zinc-admin
      - ZINC_FIRST_ADMIN_PASSWORD=dev-vault-zinc-admin-pass-upyhbY+ulcWjqSIJ1kbbDOz3xwI
      - ZINC_DATA_PATH=/data
    volumes:
      - zincsearch_data:/data
    networks:
      - qalitrack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4080"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "qalitrack.service=search"
      - "qalitrack.environment=development"

# Volumes and networks defined in 00-volumes-networks.yml