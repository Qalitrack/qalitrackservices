# QaliTrack Nginx Configuration
# Auto-generated for production environment

# Default HTTP to HTTPS redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main API Gateway server block
server {
    listen 443 ssl;
    server_name api.yourdomain.com;
    
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # SSL optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Rate limiting for API
    limit_req zone=api burst=20 nodelay;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "QaliTrack API Gateway healthy\n";
        add_header Content-Type text/plain;
    }
    
    # API Gateway routing (main route)
    location /api/ {
        # Remove /api prefix before forwarding to gateway
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://qalitrack-prod-api-gateway:18080;
        include /etc/nginx/conf.d/proxy_common.conf;
        
        # API-specific timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Default route to API Gateway
    location / {
        proxy_pass http://qalitrack-prod-api-gateway:18080;
        include /etc/nginx/conf.d/proxy_common.conf;
    }
}

# Main application/admin server block
server {
    listen 443 ssl;
    server_name yourdomain.com;
    
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # SSL optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers for main app
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    location / {
        # Route to future frontend application
        proxy_pass http://qalitrack-prod-qalitrack-frontend:3000;
        include /etc/nginx/conf.d/proxy_common.conf;
    }
}


# Redirect www to non-www
server {
    listen 443 ssl;
    server_name www.yourdomain.com;
    
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    return 301 https://yourdomain.com$request_uri;
}


# Admin interface server block
server {
    listen 443 ssl;
    server_name admin.yourdomain.com;
    
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # SSL optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    location / {
        proxy_pass http://qalitrack-prod-qalitrack-admin:4000;
        include /etc/nginx/conf.d/proxy_common.conf;
    }
}


# Media server block
server {
    listen 443 ssl;
    server_name media.yourdomain.com;
    
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # SSL optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Root directory for media files
    root /usr/share/nginx/html;
    
    # Media files with caching
    location ~* ^/media/.+\.(jpg|jpeg|png|gif|webp|svg|ico|mp3|wav|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
    }
    
    location / {
        return 404 "Media file not found";
    }
}
