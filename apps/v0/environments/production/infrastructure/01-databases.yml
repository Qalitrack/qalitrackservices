services:
  # Main PostgreSQL Database (Admin credentials for Vault to manage dynamic users)
  postgres:
    image: postgres:15-alpine
    container_name: -postgres
    ports:
      - ":5432"
    environment:
      - POSTGRES_DB=microservices
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
      - POSTGRES_MAX_CONNECTIONS=${POSTGRES_MAX_CONNECTIONS:-200}
      - POSTGRES_SHARED_BUFFERS=${POSTGRES_SHARED_BUFFERS:-256MB}
      - POSTGRES_EFFECTIVE_CACHE_SIZE=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - qalitrack
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U  -d microservices"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "qalitrack.service=database"
      - "qalitrack.environment="

  # Backup Service PostgreSQL Database
  postgres-backup:
    image: postgres:15-alpine
    container_name: -postgres-backup
    ports:
      - ":5432"
    environment:
      - POSTGRES_DB=backupservicedb
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
      - POSTGRES_MAX_CONNECTIONS=${POSTGRES_MAX_CONNECTIONS:-200}
    volumes:
      - postgres_backup_data:/var/lib/postgresql/data
    networks:
      - qalitrack
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U  -d backupservicedb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "qalitrack.service=database-backup"
      - "qalitrack.environment="

# Volumes and networks defined in 00-volumes-networks.yml