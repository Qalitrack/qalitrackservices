services:
  # MinIO Object Storage (Admin credentials for Vault to manage dynamic access keys)
  minio:
    image: minio/minio:latest
    container_name: -minio
    ports:
      - ":9000"
      - ":9001"
    environment:
      - MINIO_ROOT_USER=
      - MINIO_ROOT_PASSWORD=
    volumes:
      - minio_data:/data
    networks:
      - qalitrack
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      - "qalitrack.service=storage"
      - "qalitrack.environment="

  # ZincSearch (Admin credentials for Vault to manage dynamic users)
  zincsearch:
    image: public.ecr.aws/zinclabs/zincsearch:latest
    container_name: -zincsearch
    ports:
      - ":4080"
    environment:
      - ZINC_FIRST_ADMIN_USER=
      - ZINC_FIRST_ADMIN_PASSWORD=
      - ZINC_DATA_PATH=/data
    volumes:
      - zincsearch_data:/data
    networks:
      - qalitrack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4080"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "qalitrack.service=search"
      - "qalitrack.environment="

# Volumes and networks defined in 00-volumes-networks.yml