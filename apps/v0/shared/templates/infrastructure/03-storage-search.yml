services:
  # MinIO Object Storage (Admin credentials for Vault to manage dynamic access keys)
  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME}-minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ADMIN_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ADMIN_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - qalitrack
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      - "qalitrack.service=storage"
      - "qalitrack.environment=${ENVIRONMENT}"

  # ZincSearch (Admin credentials for Vault to manage dynamic users)
  zincsearch:
    image: public.ecr.aws/zinclabs/zincsearch:latest
    container_name: ${COMPOSE_PROJECT_NAME}-zincsearch
    ports:
      - "${ZINCSEARCH_PORT}:4080"
    environment:
      - ZINC_FIRST_ADMIN_USER=${ZINCSEARCH_ADMIN_USER}
      - ZINC_FIRST_ADMIN_PASSWORD=${ZINCSEARCH_ADMIN_PASSWORD}
      - ZINC_DATA_PATH=/data
    volumes:
      - zincsearch_data:/data
    networks:
      - qalitrack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4080"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "qalitrack.service=search"
      - "qalitrack.environment=${ENVIRONMENT}"

# Volumes and networks defined in 00-volumes-networks.yml