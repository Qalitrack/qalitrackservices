services:
  # Vault Initialization Service (Enhanced for Dynamic Secrets)
  vault-init:
    image: hashicorp/vault:latest
    container_name: ${COMPOSE_PROJECT_NAME}-vault-init
    depends_on:
      - vault
      - postgres
      - postgres-backup
      - redis
      - rabbitmq
      - mailpit
      - minio
      - zincsearch
    networks:
      - qalitrack
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_ROOT_TOKEN}
    command: |
      sh -c "
        apk add --no-cache curl &&
        echo 'Waiting for Vault to be ready...' &&
        while ! curl -s http://vault:8200/v1/sys/health > /dev/null; do
          sleep 2
        done &&
        echo 'Vault is ready, initializing dynamic secrets engines...' &&
        
        # Wait a bit more for Vault to be fully initialized
        sleep 5 &&
        
        # Enable PostgreSQL secrets engine for main database
        vault secrets enable -path=database database &&
        
        # Configure PostgreSQL connection for main database
        vault write database/config/postgres-main \
          plugin_name=postgresql-database-plugin \
          connection_url='postgresql://{{username}}:{{password}}@postgres:5432/microservices?sslmode=disable' \
          allowed_roles='postgres-main-role' \
          username='${POSTGRES_ADMIN_USER}' \
          password='${POSTGRES_ADMIN_PASSWORD}' &&
          
        # Create PostgreSQL role for main database
        vault write database/roles/postgres-main-role \
          db_name=postgres-main \
          creation_statements='CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD \"{{password}}\" VALID UNTIL \"{{expiration}}\"; GRANT CONNECT ON DATABASE microservices TO \"{{name}}\"; GRANT USAGE ON SCHEMA public TO \"{{name}}\"; GRANT CREATE ON SCHEMA public TO \"{{name}}\"; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"{{name}}\"; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO \"{{name}}\";' \
          default_ttl='1h' \
          max_ttl='24h' &&
          
        # Configure PostgreSQL connection for backup database  
        vault write database/config/postgres-backup \
          plugin_name=postgresql-database-plugin \
          connection_url='postgresql://{{username}}:{{password}}@postgres-backup:5432/backupservicedb?sslmode=disable' \
          allowed_roles='postgres-backup-role' \
          username='${POSTGRES_BACKUP_ADMIN_USER}' \
          password='${POSTGRES_BACKUP_ADMIN_PASSWORD}' &&
          
        # Create PostgreSQL role for backup database
        vault write database/roles/postgres-backup-role \
          db_name=postgres-backup \
          creation_statements='CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD \"{{password}}\" VALID UNTIL \"{{expiration}}\"; GRANT CONNECT ON DATABASE backupservicedb TO \"{{name}}\"; GRANT USAGE ON SCHEMA public TO \"{{name}}\"; GRANT CREATE ON SCHEMA public TO \"{{name}}\"; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"{{name}}\"; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO \"{{name}}\";' \
          default_ttl='1h' \
          max_ttl='24h' &&
          
        # Enable RabbitMQ secrets engine
        vault secrets enable -path=rabbitmq rabbitmq &&
        
        # Configure RabbitMQ connection
        vault write rabbitmq/config/connection \
          connection_uri='http://rabbitmq:15672' \
          username='${RABBITMQ_ADMIN_USER}' \
          password='${RABBITMQ_ADMIN_PASSWORD}' &&
          
        # Create RabbitMQ role
        vault write rabbitmq/roles/rabbitmq-role \
          vhosts='{\"/\":{\"write\": \".*\", \"read\": \".*\"}}' \
          tags='management' &&
          
        # Store static service configuration (services that don't have Vault secrets engines)
        vault kv put secret/services/redis \
          host='redis' \
          port='${REDIS_PORT}' \
          admin_password='${REDIS_ADMIN_PASSWORD}' &&
          
        vault kv put secret/services/minio \
          endpoint='minio:9000' \
          console_endpoint='minio:9001' \
          admin_access_key='${MINIO_ADMIN_USER}' \
          admin_secret_key='${MINIO_ADMIN_PASSWORD}' &&
          
        vault kv put secret/services/zincsearch \
          host='zincsearch' \
          port='4080' \
          admin_username='${ZINCSEARCH_ADMIN_USER}' \
          admin_password='${ZINCSEARCH_ADMIN_PASSWORD}' &&
          
        vault kv put secret/services/mailpit \
          smtp_host='mailpit' \
          smtp_port='1025' \
          web_port='8025' \
          note='No authentication required - testing service accepts any credentials' &&
          
        echo '${ENVIRONMENT} environment dynamic secrets engines initialization complete!' &&
        echo 'PostgreSQL and RabbitMQ configured with dynamic credential generation.' &&
        echo 'Redis, MinIO, ZincSearch, and Mailpit configured with admin credentials for future dynamic integration.'
      "
    restart: "no"
    labels:
      - "qalitrack.service=secrets-init"
      - "qalitrack.environment=${ENVIRONMENT}"

# Volumes and networks defined in 00-volumes-networks.yml