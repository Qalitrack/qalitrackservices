services:
  mongodb:
    image: mongo:7
    container_name: qs-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: products_dashboard_db
    volumes:
      - mongodb_data_dev:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - website_dev_qs_network

  backend:
    image: ghcr.io/qalitrack/qalitrackservices/qs-website-backend:main
    container_name: qs-backend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      - mongodb
    networks:
      - website_dev_qs_network
      - proxy-network
    labels:
      - "traefik.enable=true"
      # HTTPS router for API subdomain (higher priority)
      - "traefik.http.routers.qs-backend-dev.rule=Host(`dev.qalibrated.co.ke`) && PathPrefix(`/api`)"
      - "traefik.http.routers.qs-backend-dev.entrypoints=websecure"
      - "traefik.http.routers.qs-backend-dev.tls=true"
      - "traefik.http.routers.qs-backend-dev.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qs-backend-dev.service=qs-backend-dev"
      - "traefik.http.routers.qs-backend-dev.priority=100"
      - "traefik.http.services.qs-backend-dev.loadbalancer.server.port=5000"
      # HTTP router (redirects to HTTPS, higher priority)
      - "traefik.http.routers.qs-backend-dev-http.rule=Host(`dev.qalibrated.co.ke`) && PathPrefix(`/api`)"
      - "traefik.http.routers.qs-backend-dev-http.entrypoints=web"
     # - "traefik.http.routers.qs-backend-dev-http.middlewares=redirect-to-https"
      - "traefik.http.routers.qs-backend-dev-http.priority=100"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/products || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/qalitrack/qalitrackservices/qs-website-nextjs:main
    container_name: qs-frontend-dev
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "sed -i 's|__NEXT_PUBLIC_API_BASE_URL__|'$${NEXT_PUBLIC_API_BASE_URL}'|g' /app/public/config.js && sed -i 's|__NEXT_PUBLIC_SITE_URL__|'$${NEXT_PUBLIC_SITE_URL}'|g' /app/public/config.js && sed -i 's|__NEXT_PUBLIC_ASSETS_URL__|'$${NEXT_PUBLIC_ASSETS_URL}'|g' /app/public/config.js && find /app/.next -name '*.js' -type f -exec sed -i 's|__NEXT_PUBLIC_SITE_URL__|'$${NEXT_PUBLIC_SITE_URL}'|g' {} + && find /app/.next -name '*.js' -type f -exec sed -i 's|__NEXT_PUBLIC_ASSETS_URL__|'$${NEXT_PUBLIC_ASSETS_URL}'|g' {} + && find /app/.next -name '*.js' -type f -exec sed -i 's|http://localhost:3001|'$${NEXT_PUBLIC_SITE_URL}'|g' {} + && find /app/.next -name '*.js' -type f -exec sed -i 's|http://localhost:5000|'$${NEXT_PUBLIC_SITE_URL}'|g' {} + && find /app/.next -name '*.html' -type f -exec sed -i 's|http://localhost:3001|'$${NEXT_PUBLIC_SITE_URL}'|g' {} + && node server.js"]
   # ports:
   #   - "3002:80"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=https://dev.qalibrated.co.ke/api
      - NEXT_PUBLIC_SITE_URL=https://dev.qalibrated.co.ke
      - NEXT_PUBLIC_ASSETS_URL=https://dev.qalibrated.co.ke
      - NEXT_PUBLIC_ALLOWED_HOSTS=localhost,dev.qalibrated.co.ke
    depends_on:
      - backend
    networks:
      - website_dev_qs_network
      - proxy-network
    labels:
      - "traefik.enable=true"
      # HTTPS router for dev subdomain
      - "traefik.http.routers.qs-frontend-dev.rule=Host(`dev.qalibrated.co.ke`)"
      - "traefik.http.routers.qs-frontend-dev.entrypoints=websecure"
      - "traefik.http.routers.qs-frontend-dev.tls=true"
      - "traefik.http.routers.qs-frontend-dev.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qs-frontend-dev.service=qs-frontend-dev"
      - "traefik.http.services.qs-frontend-dev.loadbalancer.server.port=3000"
      # HTTP router (redirects to HTTPS)
      - "traefik.http.routers.qs-frontend-dev-http.rule=Host(`dev.qalibrated.co.ke`)"
      - "traefik.http.routers.qs-frontend-dev-http.entrypoints=web"
      - "traefik.http.routers.qs-frontend-dev-http.middlewares=redirect-to-https"
      # Redirect middleware
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

volumes:
  mongodb_data_dev:

networks:
  website_dev_qs_network:
    driver: bridge
    name: website_dev_qs_network
  proxy-network:
    driver: bridge
    external: true
