services:
  mongodb:
    image: mongo:7
    container_name: qs-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: products_dashboard_db
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - qs-network

  backend:
    image: ghcr.io/qalitrack/qalitrackservices/qs-website-backend:main
    container_name: qs-backend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    networks:
      - qs-network

  frontend:
    image: ghcr.io/qalitrack/qalitrackservices/qs-website-frontend:main
    container_name: qs-frontend-dev
    restart: unless-stopped
   # ports:
   #   - "3002:80"
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=https://dev.qalibrated.co.ke/api
      - VITE_ALLOWED_HOSTS=localhost,dev.qalibrated.co.ke
    depends_on:
      - backend
    networks:
      - qs-network

volumes:
  mongodb_data:

networks:
  qs-network:
    driver: bridge
