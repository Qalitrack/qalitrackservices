services:
  mongodb:
    image: mongo:7
    container_name: qs-mongodb-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: products_dashboard_db
    volumes:
      - mongodb_data_prod:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - website_prod_qs_network

  backend:
    image: ghcr.io/qalitrack/qalitrackservices/qs-website-backend:main
    container_name: qs-backend-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - website_prod_qs_network
      - proxy-network
    labels:
      - "traefik.enable=true"

      # HTTPS router for API subdomain (higher priority)
      - "traefik.http.routers.qs-backend-prod.rule=Host(`qalibrated.co.ke`) && PathPrefix(`/api`)"
      - "traefik.http.routers.qs-backend-prod.entrypoints=websecure"
      - "traefik.http.routers.qs-backend-prod.tls=true"
      - "traefik.http.routers.qs-backend-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qs-backend-prod.service=qs-backend-prod"
      - "traefik.http.routers.qs-backend-prod.priority=100"
      - "traefik.http.services.qs-backend-prod.loadbalancer.server.port=5000"

      # HTTP router (redirects to HTTPS, higher priority)
      - "traefik.http.routers.qs-backend-prod-http.rule=Host(`qalibrated.co.ke`) && PathPrefix(`/api`)"
      - "traefik.http.routers.qs-backend-prod-http.entrypoints=web"
      - "traefik.http.routers.qs-backend-prod-http.middlewares=redirect-to-https"
      - "traefik.http.routers.qs-backend-prod-http.priority=100"

    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/products || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/qalitrack/qalitrackservices/qs-website-frontend:main
    container_name: qs-frontend-prod
    restart: unless-stopped
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "sed -i 's|__NEXT_PUBLIC_API_BASE_URL__|'$${NEXT_PUBLIC_API_BASE_URL}'|g' /app/public/config.js && \
         sed -i 's|__NEXT_PUBLIC_SITE_URL__|'$${NEXT_PUBLIC_SITE_URL}'|g' /app/public/config.js && \
         sed -i 's|__NEXT_PUBLIC_ASSETS_URL__|'$${NEXT_PUBLIC_ASSETS_URL}'|g' /app/public/config.js && \
         find /app/.next -name '*.js' -type f -exec sed -i 's|__NEXT_PUBLIC_SITE_URL__|'$${NEXT_PUBLIC_SITE_URL}'|g' {} + && \
         find /app/.next -name '*.js' -type f -exec sed -i 's|__NEXT_PUBLIC_ASSETS_URL__|'$${NEXT_PUBLIC_ASSETS_URL}'|g' {} + && \
         find /app/.next -name '*.js' -type f -exec sed -i 's|http://localhost:3001|'$${NEXT_PUBLIC_SITE_URL}'|g' {} + && \
         find /app/.next -name '*.js' -type f -exec sed -i 's|http://localhost:5000|'$${NEXT_PUBLIC_SITE_URL}'|g' {} + && \
         find /app/.next -name '*.html' -type f -exec sed -i 's|http://localhost:3001|'$${NEXT_PUBLIC_SITE_URL}'|g' {} + && \
         node server.js"
      ]
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=https://qalibrated.co.ke/api
      - NEXT_PUBLIC_SITE_URL=https://qalibrated.co.ke
      - NEXT_PUBLIC_ASSETS_URL=https://qalibrated.co.ke
      - NEXT_PUBLIC_ALLOWED_HOSTS=localhost,qalibrated.co.ke
    depends_on:
      - backend
    networks:
      - website_prod_qs_network
      - proxy-network
    labels:
      - "traefik.enable=true"

      # HTTPS router for main domain
      - "traefik.http.routers.qs-frontend-prod.rule=Host(`qalibrated.co.ke`)"
      - "traefik.http.routers.qs-frontend-prod.entrypoints=websecure"
      - "traefik.http.routers.qs-frontend-prod.tls=true"
      - "traefik.http.routers.qs-frontend-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qs-frontend-prod.service=qs-frontend-prod"
      - "traefik.http.services.qs-frontend-prod.loadbalancer.server.port=3000"

      # HTTP router (redirects to HTTPS)
      - "traefik.http.routers.qs-frontend-prod-http.rule=Host(`qalibrated.co.ke`)"
      - "traefik.http.routers.qs-frontend-prod-http.entrypoints=web"
      - "traefik.http.routers.qs-frontend-prod-http.middlewares=redirect-to-https"

      # Redirect middleware
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

volumes:
  mongodb_data_prod:

networks:
  website_prod_qs_network:
    driver: bridge
    name: website_prod_qs_network

  proxy-network:
    driver: bridge
    external: true
