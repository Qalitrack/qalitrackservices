services:
  postgresql:
    image: postgres:15-alpine
    container_name: qtruck-postgresql-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgresql_data_dev:/var/lib/postgresql/data
    networks:
      - qtruck_dev_qs_network

  minio:
    image: minio/minio:latest
    container_name: qtruck-minio-dev
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data_dev:/data
    networks:
      - qtruck_dev_qs_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  create_minio_buckets:
    image: minio/mc:latest
    container_name: qtruck-create-minio-buckets
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    networks:
      - qtruck_dev_qs_network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb myminio/qtruck-trip-images --ignore-existing;
      /usr/bin/mc mb myminio/qtruck-expense-receipts --ignore-existing;
      /usr/bin/mc mb myminio/qtruck-material-photos --ignore-existing;
      /usr/bin/mc mb myminio/qtruck-driver-profiles --ignore-existing;
      /usr/bin/mc mb myminio/qtruck-receipts --ignore-existing;
      /usr/bin/mc policy set public myminio/qtruck-trip-images;
      /usr/bin/mc policy set public myminio/qtruck-expense-receipts;
      /usr/bin/mc policy set public myminio/qtruck-material-photos;
      /usr/bin/mc policy set public myminio/qtruck-driver-profiles;
      /usr/bin/mc policy set public myminio/qtruck-receipts;
      exit 0;
      "

  qtruck_api:
    image: ghcr.io/qalitrack/qalitrackservices/qtruck-api:main
    container_name: qtruck-api-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_ENGINE=postgresql
      - DB_HOST=qtruck-postgresql-dev
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_SECURE=False
      - USE_MINIO_STORAGE=True
    depends_on:
      - postgresql
      - minio
      - create_minio_buckets
    networks:
      - qtruck_dev_qs_network
      - proxy-network
    labels:
      - "traefik.enable=true"
      # HTTPS router for QTruck API dev subdomain (/api paths)
      - "traefik.http.routers.qtruck-api-dev-https.rule=Host(`${PRIMARY_DOMAIN:-qtruck-dev.qalibrated.cseco.co.ke}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.qtruck-api-dev-https.entrypoints=websecure"
      - "traefik.http.routers.qtruck-api-dev-https.tls=true"
      - "traefik.http.routers.qtruck-api-dev-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qtruck-api-dev-https.service=qtruck-api-dev"
      - "traefik.http.services.qtruck-api-dev.loadbalancer.server.port=8000"
      # HTTP router for API (/api paths)
      - "traefik.http.routers.qtruck-api-dev-http.rule=Host(`${PRIMARY_DOMAIN:-qtruck-dev.qalibrated.cseco.co.ke}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.qtruck-api-dev-http.entrypoints=web"
      - "traefik.http.routers.qtruck-api-dev-http.service=qtruck-api-dev"

  qtruck_frontend:
    image: ghcr.io/qalitrack/qalitrackservices/qtruck-frontend:main
    container_name: qtruck-frontend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - API_URL=http://${PRIMARY_DOMAIN:-qtruck-dev.qalibrated.cseco.co.ke}/api
      - SITE_URL=http://${PRIMARY_DOMAIN:-qtruck-dev.qalibrated.cseco.co.ke}
      - APP_NAME=QTruck
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_SITE_URL=http://${PRIMARY_DOMAIN:-qtruck-dev.qalibrated.cseco.co.ke}
      - NEXT_PUBLIC_APP_NAME=QTruck
    depends_on:
      - qtruck_api
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.request({host: '127.0.0.1', port: 3000, path: '/', timeout: 2000}, (res) => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1)); req.on('timeout', () => process.exit(1)); req.end();"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      # HTTPS router for QTruck Frontend (root path, excluding /api)
      - "traefik.http.routers.qtruck-frontend-dev-https.rule=Host(`${PRIMARY_DOMAIN:-qtruck-dev.qalibrated.cseco.co.ke}`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.qtruck-frontend-dev-https.entrypoints=websecure"
      - "traefik.http.routers.qtruck-frontend-dev-https.tls=true"
      - "traefik.http.routers.qtruck-frontend-dev-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qtruck-frontend-dev-https.service=qtruck-frontend-dev"
      - "traefik.http.services.qtruck-frontend-dev.loadbalancer.server.port=3000"
      # HTTP router for Frontend (root path, excluding /api)
      - "traefik.http.routers.qtruck-frontend-dev-http.rule=Host(`${PRIMARY_DOMAIN:-qtruck-dev.qalibrated.cseco.co.ke}`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.qtruck-frontend-dev-http.entrypoints=web"
      - "traefik.http.routers.qtruck-frontend-dev-http.service=qtruck-frontend-dev"

volumes:
  postgresql_data_dev:
  minio_data_dev:

networks:
  qtruck_dev_qs_network:
    driver: bridge
    name: qtruck_dev_qs_network
  proxy-network:
    driver: bridge
    external: true