services:
  # Microservices Control Hub - Main Dashboard
  microservices-control-hub:
    image: ghcr.io/qalitrack/qalitrackservices/microservices-control-hub:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CONFIG_PATH=/app/config/services.json
    volumes:
      # Mount your service configuration
      - ./config:/app/config:ro
    networks:
      - microservices
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # QaliTrack Services (4 services including backup)
  # Consolidated MasterData Service (replaces 10 individual services)
  qalitrack-masterdata:
    image: ghcr.io/qalitrack/qalitrackservices/qalitrack-masterdata:latest
    ports:
      - "7001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=masterdata;Username=masterdata;Password=masterdata123;Pooling=true;MinPoolSize=5;MaxPoolSize=100;Include Error Detail=true;Command Timeout=60
    depends_on:
      - postgres
    networks:
      - microservices
    restart: unless-stopped

  transaction-service:
    image: ghcr.io/t-qs-builds/qalitrack-microservices-build/transaction-service:latest
    ports:
      - "7002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices
    restart: unless-stopped

  weight-data-service:
    image: ghcr.io/t-qs-builds/qalitrack-microservices-build/weight-data-service:latest
    ports:
      - "7003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices
    restart: unless-stopped

  # DISABLED - HttpClient DI registration issue
  # operational-data-service:
  #   image: ghcr.io/t-qs-builds/qalitrack-microservices-build/operational-data-service:latest
  #   ports:
  #     - "7004:80"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #   networks:
  #     - microservices
  #   restart: unless-stopped

  # DISABLED - Database authentication issue
  # # Backup Service - NEW ADDITION
  # backup-service:
  #   image: ghcr.io/adarlegendre/qalitrackservices/backup-service:latest
  #   ports:
  #     - "7005:80"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ConnectionStrings__DefaultConnection=Host=postgres;Database=backupservicedb;Username=backupservice;Password=backupservice123;Pooling=true;MinPoolSize=5;MaxPoolSize=100;Include Error Detail=true;Command Timeout=60
  #     - UsePostgreSQL=true
  #     - UseRedis=false
  #     - Email__FromEmail=noreply@qalitrack.com
  #     - Email__FromName=QaliTrack System
  #     - Email__SmtpHost=mailpit
  #     - Email__SmtpPort=1025
  #     - Email__SmtpUsername=
  #     - Email__SmtpPassword=
  #     - Email__EnableSsl=false
  #   volumes:
  #     - ./data:/app/data
  #     - ./logs:/app/logs
  #     - ./backups:/app/backups
  #   depends_on:
  #     - postgres
  #     - mailpit
  #   networks:
  #     - microservices
  #   restart: unless-stopped

  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=microservices
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      # Additional databases for backup service
      - POSTGRES_MULTIPLE_DATABASES=backupservicedb:backupservice:backupservice123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - microservices
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservices
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservices
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
      - MP_MAX_MESSAGES=5000
    volumes:
      - mailpit_data:/data
    networks:
      - microservices
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mailpit_data:

networks:
  microservices:
    driver: bridge

# Usage:
# 1. Run: docker-compose -f docker-compose.yml up -d
# 2. Access:
#    - Dashboard: http://localhost:3000
#    - QaliTrack MasterData: http://localhost:7001 (consolidated service)
#    - Transaction Service: http://localhost:7002
#    - Weight Data Service: http://localhost:7003
#    - Operational Data Service: http://localhost:7004
#    - Backup Service: http://localhost:7005