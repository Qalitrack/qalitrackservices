services:
  # Microservices Control Hub - Main Dashboard
  microservices-control-hub:
    image: ghcr.io/qalitrack/qalitrackservices/microservices-control-hub:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CONFIG_PATH=/app/config/services.json
    volumes:
      # Mount your service configuration
      - ./config:/app/config:ro
    networks:
      - microservices
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # QaliTrack Services (4 services including backup)
  # Consolidated MasterData Service (replaces 10 individual services)
  qalitrack-masterdata:
    image: ghcr.io/qalitrack/qalitrackservices/qalitrack-masterdata:latest
    ports:
      - "7001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=masterdata;Username=masterdata;Password=masterdata123;Pooling=true;MinPoolSize=5;MaxPoolSize=100;Include Error Detail=true;Command Timeout=60
    depends_on:
      - postgres
    networks:
      - microservices
    restart: unless-stopped

  transaction-service:
    image: ghcr.io/t-qs-builds/qalitrack-microservices-build/transaction-service:latest
    ports:
      - "7002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices
    restart: unless-stopped

  weight-data-service:
    image: ghcr.io/t-qs-builds/qalitrack-microservices-build/weight-data-service:latest
    ports:
      - "7003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices
    restart: unless-stopped

  # DISABLED - HttpClient DI registration issue
  # operational-data-service:
  #   image: ghcr.io/t-qs-builds/qalitrack-microservices-build/operational-data-service:latest
  #   ports:
  #     - "7004:80"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #   networks:
  #     - microservices
  #   restart: unless-stopped

  # Backup Service - NEW ADDITION
  backup-service:
    image: ghcr.io/adarlegendre/qalitrackservices/backup-service:latest
    ports:
      - "7005:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-backup;Database=backupservicedb;Username=backupservice;Password=backupservice123;Pooling=true;MinPoolSize=5;MaxPoolSize=100;Include Error Detail=true;Command Timeout=60
      - UsePostgreSQL=true
      - UseRedis=false
      - Email__FromEmail=noreply@qalitrack.com
      - Email__FromName=QaliTrack System
      - Email__SmtpHost=mailpit
      - Email__SmtpPort=1025
      - Email__SmtpUsername=
      - Email__SmtpPassword=
      - Email__EnableSsl=false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - postgres-backup
      - mailpit
    networks:
      - microservices
    restart: unless-stopped
  # User Service - NEW ADDITION
  user-service:
    image: ghcr.io/qalitrack/qalitrackservices/user-service:latest
    ports:
      - "7006:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UsePostgreSQL=true
      - UseRedis=true
      - ConnectionStrings__DefaultConnection=Host=postgres-userservice;Port=5432;Database=userservicedb;Username=userservice;Password=userservice123;MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;
      - ConnectionStrings__Redis=redis:6379
      - JWT_SECRET_KEY=mqtNGlrJcW/j+7u73scKbGYVkfAM1qUsfRET77ss5yStSusjT7zAw62WGUZff6Rh
      - JWT_ISSUER=UserService
      - JWT_AUDIENCE=UserService
      - Backup__Path=/app/Backups
      - Notification__EnableEmailNotifications=true
      - Notification__EnableSmsNotifications=false
      - Notification__AdminEmail=admin@qalitrack.com
      - Security__EnableTwoFactorAuthentication=true
      - Security__RequireEmailVerification=true
      - Security__DefaultPasswordExpiryDays=90
      - Security__MaxLoginAttempts=5
      - Security__LockoutDurationMinutes=15
      - Logging__LogLevel__Microsoft=Warning
      - Logging__LogLevel__UserService=Debug
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./userservice-backups:/app/Backups
    depends_on:
      - postgres-userservice
      - redis
      - rabbitmq
      - mailpit
    networks:
      - microservices
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # UserService Database
  postgres-userservice:
    image: postgres:15-alpine
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=userservicedb
      - POSTGRES_USER=userservice
      - POSTGRES_PASSWORD=userservice123
      - POSTGRES_SHARED_BUFFERS=512MB
      - POSTGRES_MAX_CONNECTIONS=600
      - POSTGRES_WORK_MEM=2MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=1GB
    volumes:
      - postgres_userservice_data:/var/lib/postgresql/data
      - ./userservice-scripts:/docker-entrypoint-initdb.d
    networks:
      - microservices
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userservice -d userservicedb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=microservices
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - microservices
    restart: unless-stopped

  postgres-backup:
    image: postgres:15-alpine
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=backupservicedb
      - POSTGRES_USER=backupservice
      - POSTGRES_PASSWORD=backupservice123
    volumes:
      - postgres_backup_data:/var/lib/postgresql/data
    networks:
      - microservices
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservices
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservices
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
      - MP_MAX_MESSAGES=5000
    volumes:
      - mailpit_data:/data
    networks:
      - microservices
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_backup_data:
  postgres_userservice_data:  # ADD THIS LINE
  redis_data:
  rabbitmq_data:
  mailpit_data:

networks:
  microservices:
    driver: bridge

# Usage:
# 1. Run: docker-compose -f docker-compose.yml up -d
# 2. Access:
#    - Dashboard: http://localhost:3000
#    - QaliTrack MasterData: http://localhost:7001 (consolidated service)
#    - Transaction Service: http://localhost:7002
#    - Weight Data Service: http://localhost:7003
#    - Operational Data Service: http://localhost:7004
#    - Backup Service: http://localhost:7005