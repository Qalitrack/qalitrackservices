services:
  # MinIO Object Storage (Admin credentials for Vault to manage dynamic access keys)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=vault-minio-admin
      - MINIO_ROOT_PASSWORD=vault-minio-admin-pass
    volumes:
      - minio_data:/data
    networks:
      - microservices
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ZincSearch (Admin credentials for Vault to manage dynamic users)
  zincsearch:
    image: public.ecr.aws/zinclabs/zincsearch:latest
    ports:
      - "4080:4080"
    environment:
      - ZINC_FIRST_ADMIN_USER=vault-zinc-admin
      - ZINC_FIRST_ADMIN_PASSWORD=vault-zinc-admin-pass
      - ZINC_DATA_PATH=/data
    volumes:
      - zincsearch_data:/data
    networks:
      - microservices
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4080"]
      interval: 30s
      timeout: 10s
      retries: 3

# Volumes and networks defined in 00-volumes-networks.yml