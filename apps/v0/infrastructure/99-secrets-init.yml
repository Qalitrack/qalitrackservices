services:
  # Vault Initialization Service (Enhanced for Phase 1)
  # This service runs AFTER all infrastructure services are healthy
  # Dependencies are handled manually - ensure all other services are running first
  vault-init:
    image: hashicorp/vault:latest
    environment:
      - VAULT_ADDR=http://infrastructure-vault-1:8200
      - VAULT_TOKEN=myroot
    command: |
      sh -c "
        set -e
        apk add --no-cache curl &&
        export VAULT_ADDR=http://infrastructure-vault-1:8200
        export VAULT_TOKEN=myroot
        
        echo '🔐 Waiting for Vault to be ready...' &&
        while ! curl -s \$VAULT_ADDR/v1/sys/health > /dev/null; do
          echo '   Vault not ready, waiting...'
          sleep 3
        done &&
        
        echo '✅ Vault is ready, initializing secrets engines and authentication...' &&
        sleep 3 &&
        
        echo '🔑 Enabling AppRole authentication method...' &&
        vault auth enable approle &&
        
        echo '📊 Creating policy for QaliTrack services...' &&
        printf 'path \"database/creds/*\" { capabilities = [\"read\"] }\npath \"rabbitmq/creds/*\" { capabilities = [\"read\"] }\npath \"secret/services/*\" { capabilities = [\"read\"] }\n' | vault policy write qalitrack-services -
        
        echo '👤 Creating AppRole for QaliTrack services...' &&
        vault write auth/approle/role/qalitrack-services \
          token_policies=qalitrack-services \
          token_ttl=1h \
          token_max_ttl=4h &&
        
        echo '🔢 Getting Role ID and Secret ID...' &&
        ROLE_ID=\$(vault read -field=role_id auth/approle/role/qalitrack-services/role-id)
        SECRET_ID=\$(vault write -field=secret_id -f auth/approle/role/qalitrack-services/secret-id)
        echo \"📋 IMPORTANT: Save these credentials for your applications:\"
        echo \"   VAULT_ROLE_ID=\$ROLE_ID\"
        echo \"   VAULT_SECRET_ID=\$SECRET_ID\"
        
        echo '💾 Enabling PostgreSQL secrets engine...' &&
        vault secrets enable -path=database database &&
        
        echo '🔧 Configuring PostgreSQL main database connection...' &&
        vault write database/config/postgres-main \
          plugin_name=postgresql-database-plugin \
          connection_url=\"postgresql://{{username}}:{{password}}@infrastructure-postgres-1:5432/microservices?sslmode=disable\" \
          allowed_roles=\"postgres-main-role\" \
          username=\"vault-admin\" \
          password=\"vault-postgres-admin-pass\" &&
          
        echo '👥 Creating PostgreSQL main database role...' &&
        vault write database/roles/postgres-main-role \
          db_name=postgres-main \
          creation_statements=\"CREATE ROLE \\\"{{name}}\\\" WITH LOGIN PASSWORD \\\"{{password}}\\\" VALID UNTIL \\\"{{expiration}}\\\";\" \
          default_ttl=\"1h\" \
          max_ttl=\"24h\" &&
          
        echo '🔧 Configuring PostgreSQL backup database connection...' &&
        vault write database/config/postgres-backup \
          plugin_name=postgresql-database-plugin \
          connection_url=\"postgresql://{{username}}:{{password}}@infrastructure-postgres-backup-1:5432/backupservicedb?sslmode=disable\" \
          allowed_roles=\"postgres-backup-role\" \
          username=\"vault-backup-admin\" \
          password=\"vault-backup-admin-pass\" &&
          
        echo '👥 Creating PostgreSQL backup database role...' &&
        vault write database/roles/postgres-backup-role \
          db_name=postgres-backup \
          creation_statements=\"CREATE ROLE \\\"{{name}}\\\" WITH LOGIN PASSWORD \\\"{{password}}\\\" VALID UNTIL \\\"{{expiration}}\\\";\" \
          default_ttl=\"1h\" \
          max_ttl=\"24h\" &&
          
        echo '🐰 Enabling RabbitMQ secrets engine...' &&
        vault secrets enable -path=rabbitmq rabbitmq &&
        
        echo '🔧 Configuring RabbitMQ connection...' &&
        vault write rabbitmq/config/connection \
          connection_uri=\"http://infrastructure-rabbitmq-1:15672\" \
          username=\"vault-rabbitmq-admin\" \
          password=\"vault-rabbitmq-admin-pass\" &&
          
        echo '👥 Creating RabbitMQ role...' &&
        vault write rabbitmq/roles/rabbitmq-role \
          vhosts='{\"./\":\".*\"}' \
          tags=\"management\" &&
          
        echo '🗃️  Storing static service configurations...' &&
        vault kv put secret/services/redis \
          host=\"infrastructure-redis-1\" \
          port=\"6379\" \
          admin_password=\"vault-redis-admin-pass\" &&
          
        vault kv put secret/services/minio \
          endpoint=\"infrastructure-minio-1:9000\" \
          console_endpoint=\"infrastructure-minio-1:9001\" \
          admin_access_key=\"vault-minio-admin\" \
          admin_secret_key=\"vault-minio-admin-pass\" &&
          
        vault kv put secret/services/zincsearch \
          host=\"infrastructure-zincsearch-1\" \
          port=\"4080\" \
          admin_username=\"vault-zinc-admin\" \
          admin_password=\"vault-zinc-admin-pass\" &&
          
        vault kv put secret/services/mailpit \
          smtp_host=\"infrastructure-mailpit-1\" \
          smtp_port=\"1025\" \
          web_port=\"8025\" \
          note=\"No authentication required - testing service accepts any credentials\" &&
          
        echo '' &&
        echo '🎉 Vault initialization complete!' &&
        echo '✅ PostgreSQL dynamic secrets: database/creds/postgres-main-role' &&
        echo '✅ PostgreSQL backup dynamic secrets: database/creds/postgres-backup-role' &&
        echo '✅ RabbitMQ dynamic secrets: rabbitmq/creds/rabbitmq-role' &&
        echo '✅ Static service configs: secret/services/{redis,minio,zincsearch,mailpit}' &&
        echo '' &&
        echo '📋 COPY THESE CREDENTIALS FOR YOUR APPLICATIONS:' &&
        echo \"export VAULT_ROLE_ID=\$ROLE_ID\" &&
        echo \"export VAULT_SECRET_ID=\$SECRET_ID\" &&
        echo ''
      "
    restart: "no"
    networks:
      - microservices

# Networks defined in 00-volumes-networks.yml