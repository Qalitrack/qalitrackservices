services:
  postgresql:
    image: postgres:15-alpine
    container_name: qtruck-postgresql-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgresql_data_dev:/var/lib/postgresql/data
    networks:
      - qtruck_dev_qs_network

  qtruck_api:
    image: ghcr.io/qalitrack/qalitrackservices/qtruck-api:main
    container_name: qtruck-api-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_ENGINE=postgresql
      - DB_HOST=qtruck-postgresql-dev
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgresql
    networks:
      - qtruck_dev_qs_network
      - proxy-network
    labels:
      - "traefik.enable=true"
      # HTTPS router for QTruck API dev subdomain
      - "traefik.http.routers.qtruck-api-dev-https.rule=Host(`${PRIMARY_DOMAIN:-qtruck-dev.qalibrated.cseco.co.ke}`)"
      - "traefik.http.routers.qtruck-api-dev-https.entrypoints=websecure"
      - "traefik.http.routers.qtruck-api-dev-https.tls=true"
      - "traefik.http.routers.qtruck-api-dev-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qtruck-api-dev-https.service=qtruck-api-dev"
      - "traefik.http.services.qtruck-api-dev.loadbalancer.server.port=8000"
      # HTTP router (accepts HTTP traffic directly)
      - "traefik.http.routers.qtruck-api-dev-http.rule=Host(`${PRIMARY_DOMAIN:-qtruck-dev.qalibrated.cseco.co.ke}`)"
      - "traefik.http.routers.qtruck-api-dev-http.entrypoints=web"
      - "traefik.http.routers.qtruck-api-dev-http.service=qtruck-api-dev"

volumes:
  postgresql_data_dev:

networks:
  qtruck_dev_qs_network:
    driver: bridge
    name: qtruck_dev_qs_network
  proxy-network:
    driver: bridge
    external: true