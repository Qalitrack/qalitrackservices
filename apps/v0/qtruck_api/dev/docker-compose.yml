services:
  postgresql:
    image: postgres:15-alpine
    container_name: qtruck-postgresql-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgresql_data_dev:/var/lib/postgresql/data
    networks:
      - qtruck_dev_qs_network

  qtruck_api:
    image: ghcr.io/qalitrack/qalitrackservices/qtruck-api:main
    container_name: qtruck-api-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DB_ENGINE=postgresql
      - DB_HOST=qtruck-postgresql-dev
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgresql
    networks:
      - qtruck_dev_qs_network
    # Django will run on port 8000 inside container
    # Access via container IP since no host ports are exposed

volumes:
  postgresql_data_dev:

networks:
  qtruck_dev_qs_network:
    driver: bridge
    name: qtruck_dev_qs_network