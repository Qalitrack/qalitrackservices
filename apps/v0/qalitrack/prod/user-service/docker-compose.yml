services:
  user-service-prod:
    image: ghcr.io/qalitrack/qalitrackservices/user-service:latest
    container_name: qalitrack-user-service-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - UsePostgreSQL=true
      - UseRedis=true
      - ConnectionStrings__DefaultConnection=Host=postgres-userservice-prod;Port=5432;Database=userservicedb;Username=userservice;Password=userservice123;MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;
      - ConnectionStrings__Redis=redis-cache-prod:6379,password=userservice123
      - JWT_SECRET_KEY=mqtNGlrJcW/j+7u73scKbGYVkfAM1qUsfRET77ss5yStSusjT7zAw62WGUZff6Rh
      - JWT_ISSUER=UserService
      - JWT_AUDIENCE=UserService
      - RABBITMQ_HOST=rabbitmq-prod
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=securepassword
      - Backup__Path=/app/Backups
      - Email__FromEmail=noreply@qalitrack.com
      - Email__FromName=QaliTrack System
      - Email__SmtpHost=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__SmtpUsername=joshuaiska@gmail.com
      - Email__SmtpPassword=dgln ffbs ixvg pxuj
      - Email__EnableSsl=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./userservice-backups:/app/Backups
    depends_on:
      - postgres-userservice-prod
      - redis-cache-prod
      - rabbitmq-prod
    networks:
      - qalitrack-proxy
      - proxy-network
    # NO EXPOSED PORTS - only accessible through Traefik
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # User API routes (PROD)
      - "traefik.http.routers.user-api-prod.rule=Host(`${QALITRACK_PROD_DOMAIN:-qalitrack.cseco.co.ke}`) && PathPrefix(`/api`) && !PathPrefix(`/api/Backup`) && !PathPrefix(`/api/Microservice`)"
      - "traefik.http.routers.user-api-prod.entrypoints=web,websecure"
      - "traefik.http.routers.user-api-prod.service=user-service-prod"
      - "traefik.http.routers.user-api-prod.middlewares=strip-api-prefix"
      - "traefik.http.routers.user-api-prod.tls=true"
      - "traefik.http.routers.user-api-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.user-api-prod.priority=50"
      
      # Service definition
      - "traefik.http.services.user-service-prod.loadbalancer.server.port=80"
      
      # Middleware to strip /api prefix (shared across services)
      - "traefik.http.middlewares.strip-api-prefix.stripprefix.prefixes=/api"
      
      # Health check (PROD)
      - "traefik.http.routers.user-health-prod.rule=Host(`${QALITRACK_PROD_DOMAIN:-qalitrack.cseco.co.ke}`) && PathPrefix(`/api/health`)"
      - "traefik.http.routers.user-health-prod.entrypoints=web,websecure"
      - "traefik.http.routers.user-health-prod.service=user-service-prod"
      - "traefik.http.routers.user-health-prod.middlewares=strip-api-prefix"
      - "traefik.http.routers.user-health-prod.tls=true"
      - "traefik.http.routers.user-health-prod.tls.certresolver=letsencrypt"

  # User Service Database (PROD)
  postgres-userservice-prod:
    image: postgres:15-alpine
    container_name: qalitrack-postgres-userservice-prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=userservicedb
      - POSTGRES_USER=userservice
      - POSTGRES_PASSWORD=userservice123
      - POSTGRES_SHARED_BUFFERS=512MB
      - POSTGRES_MAX_CONNECTIONS=600
      - POSTGRES_WORK_MEM=2MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=1GB
    volumes:
      - postgres_userservice_prod_data:/var/lib/postgresql/data
      - ./userservice-scripts:/docker-entrypoint-initdb.d
    networks:
      - qalitrack-proxy
    # NO EXPOSED PORTS
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userservice -d userservicedb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis for caching (PROD)
  redis-cache-prod:
    image: redis:7-alpine
    container_name: qalitrack-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass userservice123 --maxmemory 1gb --maxmemory-policy allkeys-lru --tcp-keepalive 60 --timeout 300
    volumes:
      - redis_prod_data:/data
    networks:
      - qalitrack-proxy
    # NO EXPOSED PORTS
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ for messaging (PROD)
  rabbitmq-prod:
    image: rabbitmq:3-management-alpine
    container_name: qalitrack-rabbitmq-prod
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=securepassword
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    networks:
      - qalitrack-proxy
    # NO EXPOSED PORTS

volumes:
  postgres_userservice_prod_data:
  redis_prod_data:
  rabbitmq_prod_data:

networks:
  qalitrack-proxy:
    external: true
    name: qalitrack-proxy
  proxy-network:
    external: true
    name: proxy-network