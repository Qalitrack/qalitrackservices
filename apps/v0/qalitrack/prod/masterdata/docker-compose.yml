services:
  masterdata-service-prod:
    image: ghcr.io/qalitrack/qalitrackservices/masterdata-service:latest
    container_name: qalitrack-masterdata-service-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      # ✅ FIXED: DIRECT connection string (like User Service)
      - ConnectionStrings__DefaultConnection=Host=postgres-masterdata-prod;Port=5432;Database=qalitrack_masterdata;Username=masterdata;Password=masterdata123;MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;
      # ✅ REMOVED: All POSTGRES_* & AUTO_MIGRATE vars
      - JWT_SECRET_KEY=mqtNGlrJcW/j+7u73scKbGYVkfAM1qUsfRET77ss5yStSusjT7zAw62WGUZff6Rh
      - JWT_ISSUER=UserService
      - JWT_AUDIENCE=UserService
    volumes:
      - ./logs:/app/logs
      - ./docs:/app/wwwroot/docs
      - ./data:/app/data
    # ✅ FIXED: Simple depends_on (like User Service)
    depends_on:
      - postgres-masterdata-prod
    networks:
      - qalitrack-proxy
      - proxy-network
    # NO EXPOSED PORTS - only accessible through Traefik
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      disable: true
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
        # ✅ CORS Middleware - MUST BE FIRST
      - "traefik.http.middlewares.masterdata-cors.headers.accesscontrolalloworiginlist=http://localhost:5173,http://localhost:3000,https://qalitrack.cseco.co.ke"
      - "traefik.http.middlewares.masterdata-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS,PATCH"
      - "traefik.http.middlewares.masterdata-cors.headers.accesscontrolallowheaders=Content-Type,Authorization,X-Requested-With"
      - "traefik.http.middlewares.masterdata-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.masterdata-cors.headers.accesscontrolmaxage=105"
      - "traefik.http.middlewares.masterdata-cors.headers.addvaryheader=true"
      
      # New shared middleware to strip full /api/MasterData prefix (for Swagger and health)
      - "traefik.http.middlewares.strip-api-masterdata.stripprefix.prefixes=/api/MasterData"
      
      # Existing middleware to strip /api prefix (for general API routes)
      - "traefik.http.middlewares.strip-api-prefix.stripprefix.prefixes=/api"
      
      # JWT ForwardAuth middleware
      - "traefik.http.middlewares.masterdata-jwt-forwardauth.forwardauth.address=http://qalitrack-jwt-auth-service:3000/auth"
      - "traefik.http.middlewares.masterdata-jwt-forwardauth.forwardauth.authResponseHeaders=X-User-Id,X-User-Email"
      
      # General MasterData API routes (PROD) - strips only /api, forwards to /MasterData/... (excludes Swagger/health via priorities
# General MasterData API routes (PROD) - strips /api/MasterData, forwards to /Drivers/...
      - "traefik.http.routers.masterdata-api-prod.rule=Host(`${QALITRACK_PROD_DOMAIN:-qalitrack.cseco.co.ke}`) && PathPrefix(`/api/MasterData`) && !PathPrefix(`/api/MasterData/swagger`) && !PathPrefix(`/api/MasterData/health`)"
      - "traefik.http.routers.masterdata-api-prod.entrypoints=websecure"
      - "traefik.http.routers.masterdata-api-prod.service=masterdata-service-prod"
      - "traefik.http.routers.masterdata-api-prod.middlewares=masterdata-cors,masterdata-jwt-forwardauth,strip-api-masterdata"
      - "traefik.http.routers.masterdata-api-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.masterdata-api-prod.priority=100"
      # Health check endpoint (PROD) - strips full /api/MasterData, forwards to /health (no JWT)
      - "traefik.http.routers.masterdata-health-prod.rule=Host(`${QALITRACK_PROD_DOMAIN:-qalitrack.cseco.co.ke}`) && PathPrefix(`/api/MasterData/health`)"
      - "traefik.http.routers.masterdata-health-prod.entrypoints=websecure"
      - "traefik.http.routers.masterdata-health-prod.service=masterdata-service-prod"
      - "traefik.http.routers.masterdata-health-prod.middlewares=masterdata-cors,strip-api-masterdata"
      - "traefik.http.routers.masterdata-health-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.masterdata-health-prod.priority=110"
      
         # Swagger UI (PROD) - strips /api/MasterData, forwards to / (no JWT)
      - "traefik.http.routers.masterdata-swagger-prod.rule=Host(`${QALITRACK_PROD_DOMAIN:-qalitrack.cseco.co.ke}`) && PathPrefix(`/api/MasterData/swagger`)"
      - "traefik.http.routers.masterdata-swagger-prod.entrypoints=websecure"
      - "traefik.http.routers.masterdata-swagger-prod.service=masterdata-service-prod"  
      - "traefik.http.routers.masterdata-swagger-prod.middlewares=strip-api-masterdata"
      - "traefik.http.routers.masterdata-swagger-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.masterdata-swagger-prod.priority=110"
            
      # Service definition
      - "traefik.http.services.masterdata-service-prod.loadbalancer.server.port=80" 
     
  # MasterData Database (PROD)
  postgres-masterdata-prod:
    image: postgres:16
    container_name: qalitrack-postgres-masterdata-prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=qalitrack_masterdata
      - POSTGRES_USER=masterdata
      - POSTGRES_PASSWORD=masterdata123
      - POSTGRES_INITDB_ARGS=-E UTF8 --locale=en_US.utf8
      - POSTGRES_SHARED_BUFFERS=512MB
      - POSTGRES_MAX_CONNECTIONS=600
      - POSTGRES_WORK_MEM=2MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=1GB
    volumes:
      - postgres_masterdata_prod_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - qalitrack-proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterdata -d qalitrack_masterdata"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # NO EXPOSED PORTS
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

volumes:
  postgres_masterdata_prod_data:
    driver: local
    name: postgres_masterdata_prod_data

networks:
  qalitrack-proxy:
    external: true
    name: qalitrack-proxy
  proxy-network:
    external: true
    name: proxy-network
