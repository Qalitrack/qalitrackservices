services:
  frontend-dev:
    image: ghcr.io/qalitrack/qalitrackservices/frontend:latest
    container_name: qalitrack-frontend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://${QALITRACK_DEV_DOMAIN:-dev.qalitrack.cseco.co.ke}/api
      - VITE_HOST=0.0.0.0
      - HOST=0.0.0.0
    networks:
      - proxy-network
    # NO EXPOSED PORTS - only accessible through Traefik
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # Health check (DEV) - assuming /health endpoint (higher priority for specific path)
      - "traefik.http.routers.frontend-health-dev.rule=Host(`${QALITRACK_DEV_DOMAIN:-dev.qalitrack.cseco.co.ke}`) && PathPrefix(`/health`)"
      - "traefik.http.routers.frontend-health-dev.entrypoints=web"
      - "traefik.http.routers.frontend-health-dev.service=frontend-dev"
      - "traefik.http.routers.frontend-health-dev.priority=100"
      
      # Frontend routes (DEV only) - catch-all for dev domain, excluding /api (lower priority)
      - "traefik.http.routers.frontend-dev.rule=Host(`${QALITRACK_DEV_DOMAIN:-dev.qalitrack.cseco.co.ke}`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.frontend-dev.entrypoints=web"
      - "traefik.http.routers.frontend-dev.service=frontend-dev"
      - "traefik.http.routers.frontend-dev.priority=10"
      
      # Service definition
      - "traefik.http.services.frontend-dev.loadbalancer.server.port=4000"

networks:
  proxy-network:
    external: true
    name: proxy-network