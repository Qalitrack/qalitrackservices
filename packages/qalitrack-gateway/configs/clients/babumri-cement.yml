# Babumri Cement Configuration
client:
  name: "Babumri Cement"
  code: "babumri"
  description: "Babumri Cement Factory - Full weighbridge operations"

deployment:
  environment: "production"
  domain: "babumri.qalitrack.com"
  ports:
    gateway: 7000
    swagger_aggregator: 8000

services:
  # Core services (always required)
  gateway:
    enabled: true
    port: 7000
    image: "qalitrack/gateway:latest"
    replicas: 2
    
  user-service:
    enabled: true
    port: 7001
    image: "qalitrack/user-service:latest"
    replicas: 1
    
  swagger-aggregator:
    enabled: true
    port: 8000
    image: "qalitrack/swagger-aggregator:latest"
    replicas: 1

  # Master data services
  organization-service:
    enabled: true
    port: 7002
    image: "qalitrack/organization-service:latest"
    replicas: 1
    
  vehicle-service:
    enabled: true
    port: 7003
    image: "qalitrack/vehicle-service:latest"
    replicas: 1
    
  driver-service:
    enabled: true
    port: 7004
    image: "qalitrack/driver-service:latest"
    replicas: 1
    
  product-service:
    enabled: true
    port: 7005
    image: "qalitrack/product-service:latest"
    replicas: 1
    
  route-service:
    enabled: true
    port: 7006
    image: "qalitrack/route-service:latest"
    replicas: 1
    
  weighbridge-service:
    enabled: true
    port: 7007
    image: "qalitrack/weighbridge-service:latest"
    replicas: 2
    
  customer-service:
    enabled: true
    port: 7008
    image: "qalitrack/customer-service:latest"
    replicas: 1
    
  supplier-service:
    enabled: true
    port: 7009
    image: "qalitrack/supplier-service:latest"
    replicas: 1
    
  transporter-service:
    enabled: true
    port: 7010
    image: "qalitrack/transporter-service:latest"
    replicas: 1

  # Business services
  weight-data-service:
    enabled: true
    port: 7012
    image: "qalitrack/weight-data-service:latest"
    replicas: 2
    
  compliance-service:
    enabled: true
    port: 7013
    image: "qalitrack/compliance-service:latest"
    replicas: 1
    
  operational-data-service:
    enabled: true
    port: 7014
    image: "qalitrack/operational-data-service:latest"
    replicas: 1
    
  transaction-service:
    enabled: true
    port: 7015
    image: "qalitrack/transaction-service:latest"
    replicas: 2
    
  analytics-service:
    enabled: true
    port: 7016
    image: "qalitrack/analytics-service:latest"
    replicas: 1

  # Optional services (disabled for this client)
  sacco-service:
    enabled: false
    reason: "Not applicable for cement factory"
    
  data-sync-service:
    enabled: false
    reason: "Single location, no sync needed"
    
  archive-service:
    enabled: false
    reason: "Manual archival process"

features:
  multi_tenant: true
  advanced_analytics: true
  compliance_monitoring: true
  real_time_weighing: true
  automated_reporting: true
  mobile_access: false
  
database:
  type: "postgresql"
  host: "babumri-db.internal"
  high_availability: true

monitoring:
  metrics: true
  logging: true
  alerting: true
  health_checks: true