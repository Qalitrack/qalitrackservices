  summary: Saves all changes made in this context to the database.
  remarks: >-
    <p>
        This method will automatically call <xref href="Microsoft.EntityFrameworkCore.ChangeTracking.ChangeTracker.DetectChanges" data-throw-if-not-resolved="false"></xref>
        to discover any changes to entity instances before saving to the underlying database. This can be disabled via
        <xref href="Microsoft.EntityFrameworkCore.ChangeTracking.ChangeTracker.AutoDetectChangesEnabled" data-throw-if-not-resolved="false"></xref>.
    </p>

    <p>
        Entity Framework Core does not support multiple parallel operations being run on the same DbContext instance. This
        includes both parallel execution of async queries and any explicit concurrent use from multiple threads.
        Therefore, always await async calls immediately, or use separate DbContext instances for operations that execute
        in parallel. See <a href="https://aka.ms/efcore-docs-threading">Avoiding DbContext threading issues</a> for more
        information and examples.
    </p>

    <p>
        See <a href="https://aka.ms/efcore-docs-saving-data">Saving data in EF Core</a> for more information and examples.
    </p>
  example: []
  syntax:
    content: public override Task<int> SaveChangesAsync(CancellationToken cancellationToken = default)
    parameters:
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref> to observe while waiting for the task to complete.
    return:
      type: System.Threading.Tasks.Task{System.Int32}
      description: >-
        A task that represents the asynchronous save operation. The task result contains the

        number of state entries written to the database.
    content.vb: Public Overrides Function SaveChangesAsync(cancellationToken As CancellationToken = Nothing) As Task(Of Integer)
