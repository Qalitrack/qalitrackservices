version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DATABASE_PROVIDER=PostgreSQL
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=qalitrack_masterdata_test
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      # MIGRATION SETTINGS - Changed to enable migrations
      - AUTO_MIGRATE=true
      - MIGRATION_MAX_RETRIES=15
      - MIGRATION_RETRY_DELAY=3
      - FAIL_ON_MIGRATION_ERROR=true
      - USE_VAULT=false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - qalitrack-net
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: qalitrack_masterdata_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Performance settings for faster startup
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.utf8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qalitrack_masterdata_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - qalitrack-net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  qalitrack-net:
    driver: bridge