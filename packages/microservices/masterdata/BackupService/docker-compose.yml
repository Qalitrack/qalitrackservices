version: '3.8'

services:
  backup-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backup-service
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Database=backupservicedb;Username=backupservice;Password=backupservice123;Pooling=true;MinPoolSize=5;MaxPoolSize=100;Include Error Detail=true;Command Timeout=60
      - UsePostgreSQL=true
      - UseRedis=false
      - Email__FromEmail=noreply@qalitrack.com
      - Email__FromName=QaliTrack System
      - Email__SmtpHost=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__SmtpUsername=joshuaiska@gmail.com
      - Email__SmtpPassword=dgln ffbs ixvg pxuj
      - Email__EnableSsl=true
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=securepassword
      - RabbitMQ__VirtualHost=/
    ports:
      - "3000:80"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./metadata:/app/backup-metadata
    depends_on:
      - postgres-db
    networks:
      - backup-network
      - userservice-network

  postgres-db:
    image: postgres:14-alpine
    container_name: backup-postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=backupservice
      - POSTGRES_PASSWORD=backupservice123
      - POSTGRES_DB=backupservicedb
    ports:
      - "5532:5432"  # Fixed port mapping
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backup-network

networks:
  backup-network:
    driver: bridge
  userservice-network:
    external: true
    name: userservice-network

volumes:
  postgres_data: