  summary: >-
    Called by the <xref href="Quartz.IScheduler" data-throw-if-not-resolved="false"></xref> when a <xref href="Quartz.ITrigger" data-throw-if-not-resolved="false"></xref>

    fires that is associated with the <xref href="Quartz.IJob" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    The implementation may wish to set a  result object on the 

    JobExecutionContext before this method exits.  The result itself

    is meaningless to Quartz, but may be informative to 

    <xref href="Quartz.IJobListener" data-throw-if-not-resolved="false"></xref>s or 

    <xref href="Quartz.ITriggerListener" data-throw-if-not-resolved="false"></xref>s that are watching the job's 

    execution.
  example: []
  syntax:
    content: public Task Execute(IJobExecutionContext context)
    parameters:
    - id: context
      type: Quartz.IJobExecutionContext
      description: The execution context.
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Function Execute(context As IJobExecutionContext) As Task
