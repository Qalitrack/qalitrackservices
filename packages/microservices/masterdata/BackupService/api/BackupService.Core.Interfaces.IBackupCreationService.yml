  summary: Creates a backup for the specified microservice. The connection string will be retrieved from the database.
  example: []
  syntax:
    content: Task<BackupResult> CreateBackupAsync(BackupType backupType, string microservice, string saveLocation, CancellationToken ct = default)
    parameters:
    - id: backupType
      type: BackupService.Core.Enums.BackupType
      description: Type of backup to create (Full or Incremental)
    - id: microservice
      type: System.String
      description: Name of the microservice to backup
    - id: saveLocation
      type: System.String
      description: Directory path where the backup file will be saved
    - id: ct
      type: System.Threading.CancellationToken
      description: Cancellation token for the operation
    return:
      type: System.Threading.Tasks.Task{BackupService.Core.Dtos.BackupResult}
      description: BackupResult containing details about the created backup
    content.vb: Function CreateBackupAsync(backupType As BackupType, microservice As String, saveLocation As String, ct As CancellationToken = Nothing) As Task(Of BackupResult)
