version: '3.8'
services:
  postgres-db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: userservice-postgres
    environment:
      POSTGRES_DB: userservicedb
      POSTGRES_USER: userservice
      POSTGRES_PASSWORD: userservice123
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_MAX_CONNECTIONS: 600
      POSTGRES_WORK_MEM: 2MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./scripts:/docker-entrypoint-initdb.d
      - pg_wal_archive:/var/lib/postgresql/data/pg_wal_archive   # ✅ added
    networks:
      - userservice-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userservice -d userservicedb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    dns:
      - 8.8.8.8
      - 8.8.4.4

  redis-cache:
    image: redis:7-alpine
    container_name: userservice-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - userservice-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass userservice123 --maxmemory 1gb --maxmemory-policy allkeys-lru --tcp-keepalive 60 --timeout 300
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    dns:
      - 8.8.8.8
      - 8.8.4.4

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: userservice-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8081
      - UsePostgreSQL=true
      - UseRedis=true
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=userservicedb;Username=userservice;Password=userservice123;MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;
      - ConnectionStrings__Redis=redis-cache:6379,password=userservice123
      - JWT_SECRET_KEY=mqtNGlrJcW/j+7u73scKbGYVkfAM1qUsfRET77ss5yStSusjT7zAw62WGUZff6Rh
      - JWT_ISSUER=UserService
      - JWT_AUDIENCE=UserService
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=securepassword
      - Backup__Path=/app/Backups
      - Backup__WalArchivePath=/var/lib/postgresql/data/pg_wal_archive
    ports:
      - "8081:8081"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./var/run/docker.sock:/var/run/docker.sock
      - ./backups:/app/Backups                       # ✅ added
      - pg_wal_archive:/var/lib/postgresql/data/pg_wal_archive   # ✅ added
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    dns:
      - 8.8.8.8
      - 8.8.8.4
    networks:
      - userservice-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP port for MassTransit
      - "15672:15672" # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=securepassword
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - userservice-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  pg_wal_archive:                # ✅ added
    driver: local

networks:
  userservice-network:
    name: userservice-network
    driver: bridge
