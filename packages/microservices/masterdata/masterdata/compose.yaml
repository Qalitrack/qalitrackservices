services:
  postgres-db:
    image: postgres:16
    container_name: masterdata-postgres
    environment:
      POSTGRES_DB: masterdatadb
      POSTGRES_USER: masterdata
      POSTGRES_PASSWORD: masterdata123
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_MAX_CONNECTIONS: 600
      POSTGRES_WORK_MEM: 2MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
    ports:
      - "5435:5632" # Host port 5435 maps to container port 5632
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    command: ["postgres", "-c", "listen_addresses=*", "-c", "port=5632"] # Set PostgreSQL to listen on 5632
    networks:
      - userservice-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterdata -d masterdatadb -p 5632"] # Update to check port 5632
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    dns:
      - 8.8.8.8
      - 8.8.4.4

  masterdata-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masterdata-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - UsePostgreSQL=true
      - UseRedis=false
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5632;Database=masterdatadb;Username=masterdata;Password=masterdata123;Pooling=true;MinPoolSize=5;MaxPoolSize=100;IncludeErrorDetail=true;CommandTimeout=60
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    ports:
      - "7001:80"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - userservice-network

volumes:
  postgres_data:
    driver: local

networks:
  userservice-network:
    name: userservice-network
    driver: bridge