version: '3.8'

services:
  db:
    image: postgres:16
    container_name: technician-db
    environment:
      POSTGRES_DB: techniciandb
      POSTGRES_USER: technician
      POSTGRES_PASSWORD: technician123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - technician-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technician -d techniciandb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technician-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=techniciandb;Username=technician;Password=technician123;Pooling=true;MinPoolSize=5;MaxPoolSize=100
    ports:
      - "5000:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - technician-network
    volumes:
      - ./wwwroot/uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  technician-network:
    driver: bridge

volumes:
  postgres_data: