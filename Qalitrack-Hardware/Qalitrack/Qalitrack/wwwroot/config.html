<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qalitrack Configuration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #f9f9f9;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section h2::before {
            content: '⚙️';
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-restart {
            background: #f59e0b;
            color: white;
        }

        .btn-restart:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .btn-reload {
            background: #10b981;
            color: white;
        }

        .btn-reload:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #d1fae5;
            border-left: 4px solid #10b981;
            color: #065f46;
        }

        .alert-error {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
        }

        .alert-info {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            color: #1e40af;
        }

        .config-path {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Qalitrack Configuration</h1>
            <p>Configure weighbridge, camera, and plate recognition settings</p>
        </div>

        <div class="content">
            <div id="alert" class="alert"></div>

            <div class="config-path">
                📁 Config File: <span id="configPath">Loading...</span>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 15px; color: #666;">Loading configuration...</p>
            </div>

            <form id="configForm" style="display: none;">
                <!-- TCP Listener Settings -->
                <div class="section">
                    <h2>Weighbridge Scale (TCP)</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tcpIp">IP Address:</label>
                            <input type="text" id="tcpIp" placeholder="172.16.1.243" required>
                        </div>
                        <div class="form-group">
                            <label for="tcpPort">Port:</label>
                            <input type="number" id="tcpPort" placeholder="3002" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tcpTimeout">Read Timeout (ms):</label>
                            <input type="number" id="tcpTimeout" placeholder="1000">
                        </div>
                        <div class="form-group">
                            <label for="tcpReconnect">Reconnect Delay (ms):</label>
                            <input type="number" id="tcpReconnect" placeholder="5000">
                        </div>
                    </div>
                </div>

                <!-- Camera Settings -->
                <div class="section">
                    <h2>Camera (RTSP)</h2>
                    <div class="form-group">
                        <label for="cameraUrl">RTSP URL:</label>
                        <input type="text" id="cameraUrl" placeholder="rtsp://172.16.1.227:8557/" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cameraUser">Username:</label>
                            <input type="text" id="cameraUser" placeholder="admin">
                        </div>
                        <div class="form-group">
                            <label for="cameraPass">Password:</label>
                            <input type="password" id="cameraPass" placeholder="admin">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cameraReconnect">Reconnect Delay (ms):</label>
                            <input type="number" id="cameraReconnect" placeholder="5000">
                        </div>
                        <div class="form-group">
                            <label for="cameraBuffer">Frame Buffer Size:</label>
                            <input type="number" id="cameraBuffer" placeholder="100">
                        </div>
                    </div>
                </div>

                <!-- Plate Recognition Settings -->
                <div class="section">
                    <h2>Plate Recognition (NPR)</h2>
                    <div class="form-group">
                        <label for="plateQueryUrl">HTTP Query URL:</label>
                        <input type="text" id="plateQueryUrl" placeholder="http://172.16.1.227:80/api/recognition/latest" required>
                    </div>
                    <div class="form-group">
                        <label for="plateWsUrl">WebSocket URL:</label>
                        <input type="text" id="plateWsUrl" placeholder="ws://172.16.1.227:9080/recognition">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="plateUser">Username:</label>
                            <input type="text" id="plateUser" placeholder="admin">
                        </div>
                        <div class="form-group">
                            <label for="platePass">Password:</label>
                            <input type="password" id="platePass" placeholder="admin">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="platePolling">Polling Interval (ms):</label>
                            <input type="number" id="platePolling" placeholder="1000">
                        </div>
                        <div class="form-group">
                            <label for="plateWebSocket">Use WebSocket:</label>
                            <select id="plateWebSocket">
                                <option value="true">Yes</option>
                                <option value="false">No</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-reload" onclick="loadConfiguration()">🔄 Reload</button>
                    <button type="submit" class="btn-save">💾 Save Configuration</button>
                    <button type="button" class="btn-restart" onclick="restartService()">🔄 Save & Restart</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentConfig = null; // Store the current configuration

        function showAlert(message, type = 'info') {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 5000);
        }

        async function loadConfiguration() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('configForm').style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/api/configuration`);
                const data = await response.json();

                document.getElementById('configPath').textContent = data.configFilePath;

                currentConfig = data.configuration; // Store the loaded config

                // TCP Listener
                document.getElementById('tcpIp').value = currentConfig.tcpListener?.ipAddress || '';
                document.getElementById('tcpPort').value = currentConfig.tcpListener?.port || 0;
                document.getElementById('tcpTimeout').value = currentConfig.tcpListener?.readTimeoutMs || 0;
                document.getElementById('tcpReconnect').value = currentConfig.tcpListener?.reconnectDelayMs || 0;

                // Camera - get first camera or use defaults
                const camera = currentConfig.cameraSettings?.cameras?.[0] || {};
                const rtspUrl = camera.ipAddress 
                    ? `rtsp://${camera.ipAddress}:${camera.port || 554}${camera.rtspPath || '/'}`
                    : '';
                    
                document.getElementById('cameraUrl').value = rtspUrl;
                document.getElementById('cameraUser').value = camera.username || 'admin';
                document.getElementById('cameraPass').value = '';
                document.getElementById('cameraReconnect').value = currentConfig.cameraSettings?.reconnectDelayMs || 5000;
                document.getElementById('cameraBuffer').value = currentConfig.cameraSettings?.frameBufferSize || 100;

                // Plate Recognition - get from first camera's NPR settings or use defaults
                const nprSettings = currentConfig.cameraSettings?.cameras?.[0]?.nprSettings || {};
                document.getElementById('plateQueryUrl').value = nprSettings.cameraQueryUrl || '';
                document.getElementById('plateWsUrl').value = nprSettings.webSocketUrl || '';
                document.getElementById('plateUser').value = nprSettings.username || 'admin';
                document.getElementById('platePass').value = '';
                document.getElementById('platePolling').value = nprSettings.pollingIntervalMs || 1000;
                document.getElementById('plateWebSocket').value = (nprSettings.useWebSocket ?? true).toString();

                document.getElementById('configForm').style.display = 'block';
                showAlert('Configuration loaded successfully', 'success');
            } catch (error) {
                showAlert(`Failed to load configuration: ${error.message}`, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Ensure we have a config to work with
            if (!currentConfig) {
                showAlert('Error: No configuration loaded. Please reload the page.', 'error');
                return;
            }

            // Create a deep copy of the config to modify
            const updatedConfig = JSON.parse(JSON.stringify(currentConfig));
            
            // Initialize config structure if needed
            updatedConfig.tcpListener = updatedConfig.tcpListener || {};
            updatedConfig.cameraSettings = updatedConfig.cameraSettings || {};
            updatedConfig.cameraSettings.cameras = updatedConfig.cameraSettings.cameras || [{}];
            
            // Update TCP Listener settings
            updatedConfig.tcpListener.ipAddress = document.getElementById('tcpIp').value || '';
            updatedConfig.tcpListener.port = parseInt(document.getElementById('tcpPort').value) || 0;
            updatedConfig.tcpListener.readTimeoutMs = parseInt(document.getElementById('tcpTimeout').value) || 0;
            updatedConfig.tcpListener.reconnectDelayMs = parseInt(document.getElementById('tcpReconnect').value) || 0;
            
            const camera = updatedConfig.cameraSettings.cameras[0];
            const rtspUrl = document.getElementById('cameraUrl').value;
            const rtspMatch = rtspUrl.match(/^rtsp:\/\/([^:]+)(?::(\d+))?(\/.*)?$/);
            
            if (rtspMatch) {
                camera.ipAddress = rtspMatch[1];
                camera.port = rtspMatch[2] ? parseInt(rtspMatch[2]) : 554;
                camera.rtspPath = rtspMatch[3] || '/';
            }
            
            camera.username = document.getElementById('cameraUser').value || 'admin';
            camera.password = document.getElementById('cameraPass').value || 'admin';
            
            // Update NPR settings
            camera.nprSettings = camera.nprSettings || {};
            camera.nprSettings.cameraQueryUrl = document.getElementById('plateQueryUrl').value;
            camera.nprSettings.webSocketUrl = document.getElementById('plateWsUrl').value;
            camera.nprSettings.username = document.getElementById('plateUser').value || 'admin';
            camera.nprSettings.password = document.getElementById('platePass').value || 'admin';
            camera.nprSettings.pollingIntervalMs = parseInt(document.getElementById('platePolling').value) || 1000;
            camera.nprSettings.useWebSocket = document.getElementById('plateWebSocket').value === 'true';
            
            // Update other camera settings
            updatedConfig.cameraSettings.reconnectDelayMs = parseInt(document.getElementById('cameraReconnect').value) || 5000;
            updatedConfig.cameraSettings.frameBufferSize = parseInt(document.getElementById('cameraBuffer').value) || 100;
            
            console.log('Updated config:', updatedConfig);

            try {
                console.log('Saving configuration:', updatedConfig);
                const response = await fetch(`${API_BASE}/api/configuration`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedConfig)
                });

                const result = await response.json();
                console.log('Save response:', result);

                if (response.ok) {
                    showAlert('Configuration saved! Restart service to apply changes.', 'success');
                    console.log('Configuration saved to:', result.configFilePath);
                } else {
                    const errorMsg = result.error || 'Unknown error occurred';
                    console.error('Save failed:', errorMsg);
                    showAlert(`Failed to save: ${errorMsg}`, 'error');
                }
            } catch (error) {
                console.error('Error during save:', error);
                showAlert(`Error saving configuration: ${error.message}`, 'error');
            }
        });

        async function restartService() {
            if (!confirm('This will restart the service. Are you sure?')) return;

            // Save first
            document.getElementById('configForm').dispatchEvent(new Event('submit'));

            // Wait a bit for save to complete
            setTimeout(async () => {
                try {
                    await fetch(`${API_BASE}/api/configuration/restart`, { method: 'POST' });
                    showAlert('Service restart initiated. Reloading in 5 seconds...', 'info');
                    setTimeout(() => location.reload(), 5000);
                } catch (error) {
                    showAlert('Service restarting... Page will reload.', 'info');
                    setTimeout(() => location.reload(), 5000);
                }
            }, 1000);
        }

        // Load configuration on page load
        loadConfiguration();
    </script>
</body>
</html>
