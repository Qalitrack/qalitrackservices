<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 28px sans-serif; text-anchor: middle; fill: #2c3e50; }
      .section-title { font: bold 20px sans-serif; text-anchor: middle; fill: #ffffff; }
      .user-label { font: bold 14px sans-serif; text-anchor: middle; fill: #2c3e50; }
      .description { font: 12px sans-serif; text-anchor: middle; fill: #34495e; }
      .system-label { font: bold 12px sans-serif; text-anchor: middle; fill: #ffffff; }
      
      .background { fill: #f8f9fa; }
      .national-section { fill: #e74c3c; stroke: #c0392b; stroke-width: 3; rx: 15; }
      .factory-section { fill: #f39c12; stroke: #e67e22; stroke-width: 3; rx: 15; }
      
      .person { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .admin { fill: #9b59b6; stroke: #8e44ad; stroke-width: 2; }
      .driver { fill: #27ae60; stroke: #229954; stroke-width: 2; }
      
      .vehicle { fill: #34495e; stroke: #2c3e50; stroke-width: 2; rx: 8; }
      .weighbridge { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; rx: 4; }
      .software { fill: #1abc9c; stroke: #16a085; stroke-width: 2; rx: 8; }
      .erp { fill: #e67e22; stroke: #d35400; stroke-width: 2; rx: 8; }
      
      .interaction { stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrow); }
      .data-flow { stroke: #16a085; stroke-width: 2; stroke-dasharray: 5,5; marker-end: url(#arrow); }
      .erp-integration { stroke: #e67e22; stroke-width: 3; marker-end: url(#arrow); }
    </style>
    
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1400" height="1000" class="background"/>

  <!-- Title -->
  <text x="700" y="40" class="title">QaliTrack System - User Interactions &amp; Integrations</text>

  <!-- National Weighing Section -->
  <g>
    <rect x="50" y="80" width="600" height="400" class="national-section"/>
    <text x="350" y="110" class="section-title">National Weighing (KENHA Operations)</text>
    
    <!-- People -->
    <!-- Inspector -->
    <circle cx="120" cy="160" r="25" class="person"/>
    <text x="120" y="167" class="user-label" fill="white">Inspector</text>
    <text x="120" y="200" class="description">Vehicle Compliance</text>
    
    <!-- Traffic Officer -->
    <circle cx="250" cy="160" r="25" class="person"/>
    <text x="250" y="167" class="user-label" fill="white">Traffic Officer</text>
    <text x="250" y="200" class="description">Flow Management</text>
    
    <!-- Admin -->
    <circle cx="380" cy="160" r="25" class="admin"/>
    <text x="380" y="167" class="user-label" fill="white">Admin</text>
    <text x="380" y="200" class="description">System Management</text>
    
    <!-- Driver -->
    <circle cx="510" cy="160" r="25" class="driver"/>
    <text x="510" y="167" class="user-label" fill="white">Driver</text>
    <text x="510" y="200" class="description">Vehicle Operation</text>
    
    <!-- Vehicle -->
    <rect x="450" y="240" width="120" height="60" class="vehicle"/>
    <text x="510" y="265" class="user-label" fill="white">Heavy Vehicle</text>
    <text x="510" y="280" class="description" fill="white">Truck/Trailer</text>
    <text x="510" y="295" class="description" fill="white">Registration: KXX-XXX</text>
    
    <!-- Weighbridge -->
    <rect x="150" y="320" width="200" height="80" class="weighbridge"/>
    <text x="250" y="345" class="user-label">Highway Weighbridge</text>
    <text x="250" y="365" class="description">Load Cells &amp; Sensors</text>
    <text x="250" y="380" class="description">Automated Capture</text>
    
    <!-- QaliTrack Software -->
    <rect x="400" y="320" width="180" height="80" class="software"/>
    <text x="490" y="345" class="system-label">QaliTrack System</text>
    <text x="490" y="365" class="system-label">Weight Processing</text>
    <text x="490" y="380" class="system-label">Compliance Check</text>
    
    <!-- Interactions -->
    <!-- Inspector to System -->
    <line x1="120" y1="185" x2="400" y2="340" class="interaction"/>
    <!-- Traffic Officer to System -->
    <line x1="250" y1="185" x2="450" y2="320" class="interaction"/>
    <!-- Admin to System -->
    <line x1="380" y1="185" x2="490" y2="320" class="interaction"/>
    <!-- Driver to Vehicle -->
    <line x1="510" y1="185" x2="510" y2="240" class="interaction"/>
    <!-- Vehicle to Weighbridge -->
    <line x1="450" y1="270" x2="350" y2="320" class="interaction"/>
    <!-- Weighbridge to System -->
    <line x1="350" y1="340" x2="400" y2="360" class="data-flow"/>
  </g>

  <!-- Factory Weighing Section -->
  <g>
    <rect x="750" y="80" width="600" height="400" class="factory-section"/>
    <text x="1050" y="110" class="section-title">Factory Operations (Bamburi Cement)</text>
    
    <!-- People -->
    <!-- Logistics Coordinator -->
    <circle cx="820" cy="160" r="25" class="person"/>
    <text x="820" y="167" class="user-label" fill="white">Logistics Coord</text>
    <text x="820" y="200" class="description">Supply Planning</text>
    
    <!-- Warehouse Manager -->
    <circle cx="950" cy="160" r="25" class="person"/>
    <text x="950" y="167" class="user-label" fill="white">Warehouse Mgr</text>
    <text x="950" y="200" class="description">Inventory Control</text>
    
    <!-- Gate Security -->
    <circle cx="1080" cy="160" r="25" class="admin"/>
    <text x="1080" y="167" class="user-label" fill="white">Gate Security</text>
    <text x="1080" y="200" class="description">Access Control</text>
    
    <!-- Supplier Driver -->
    <circle cx="1210" cy="160" r="25" class="driver"/>
    <text x="1210" y="167" class="user-label" fill="white">Supplier Driver</text>
    <text x="1210" y="200" class="description">Material Delivery</text>
    
    <!-- Vehicle -->
    <rect x="1150" y="240" width="120" height="60" class="vehicle"/>
    <text x="1210" y="265" class="user-label" fill="white">Supply Vehicle</text>
    <text x="1210" y="280" class="description" fill="white">Cement Truck</text>
    <text x="1210" y="295" class="description" fill="white">Raw Materials</text>
    
    <!-- Factory Weighbridge -->
    <rect x="850" y="320" width="200" height="80" class="weighbridge"/>
    <text x="950" y="345" class="user-label">Factory Weighbridge</text>
    <text x="950" y="365" class="description">Intake/Dispatch</text>
    <text x="950" y="380" class="description">Quality Control</text>
    
    <!-- QaliTrack Software -->
    <rect x="1100" y="320" width="180" height="80" class="software"/>
    <text x="1190" y="345" class="system-label">QaliTrack System</text>
    <text x="1190" y="365" class="system-label">Production Data</text>
    <text x="1190" y="380" class="system-label">Supplier Tracking</text>
    
    <!-- Factory ERP -->
    <rect x="770" y="420" width="180" height="50" class="erp"/>
    <text x="860" y="440" class="system-label">Factory ERP</text>
    <text x="860" y="455" class="system-label">SAP/Oracle System</text>
    
    <!-- Interactions -->
    <!-- Logistics to System -->
    <line x1="820" y1="185" x2="1100" y2="340" class="interaction"/>
    <!-- Warehouse Mgr to System -->
    <line x1="950" y1="185" x2="1150" y2="320" class="interaction"/>
    <!-- Gate Security to System -->
    <line x1="1080" y1="185" x2="1190" y2="320" class="interaction"/>
    <!-- Driver to Vehicle -->
    <line x1="1210" y1="185" x2="1210" y2="240" class="interaction"/>
    <!-- Vehicle to Weighbridge -->
    <line x1="1150" y1="270" x2="1050" y2="320" class="interaction"/>
    <!-- Weighbridge to System -->
    <line x1="1050" y1="340" x2="1100" y2="360" class="data-flow"/>
    <!-- System to ERP Integration -->
    <line x1="1100" y1="380" x2="950" y2="420" class="erp-integration"/>
    <!-- ERP to Logistics -->
    <line x1="820" y1="420" x2="820" y2="185" class="erp-integration"/>
  </g>

  <!-- Central QaliTrack System -->
  <g>
    <rect x="250" y="550" width="900" height="200" class="software"/>
    <text x="700" y="580" class="section-title">QaliTrack Central Platform</text>
    
    <!-- Core Services -->
    <rect x="280" y="600" width="120" height="50" class="weighbridge"/>
    <text x="340" y="620" class="user-label">User Service</text>
    <text x="340" y="635" class="description">Authentication/RBAC</text>
    
    <rect x="420" y="600" width="120" height="50" class="weighbridge"/>
    <text x="480" y="620" class="user-label">Weight Service</text>
    <text x="480" y="635" class="description">Data Processing</text>
    
    <rect x="560" y="600" width="120" height="50" class="weighbridge"/>
    <text x="620" y="620" class="user-label">Master Data</text>
    <text x="620" y="635" class="description">Vehicle Registry</text>
    
    <rect x="700" y="600" width="120" height="50" class="weighbridge"/>
    <text x="760" y="620" class="user-label">Report Service</text>
    <text x="760" y="635" class="description">Analytics Engine</text>
    
    <rect x="840" y="600" width="120" height="50" class="weighbridge"/>
    <text x="900" y="620" class="user-label">API Gateway</text>
    <text x="900" y="635" class="description">Security Layer</text>
    
    <rect x="980" y="600" width="120" height="50" class="weighbridge"/>
    <text x="1040" y="620" class="user-label">Integration Hub</text>
    <text x="1040" y="635" class="description">ERP Connectors</text>
  </g>

  <!-- System Connections -->
  <g>
    <!-- National to Central -->
    <line x1="490" y1="400" x2="550" y2="550" class="data-flow"/>
    <!-- Factory to Central -->
    <line x1="1190" y1="400" x2="850" y2="550" class="data-flow"/>
    <!-- ERP to Integration Hub -->
    <line x1="860" y1="470" x2="1040" y2="600" class="erp-integration"/>
  </g>

  <!-- User Access Devices -->
  <g>
    <rect x="100" y="800" width="100" height="60" class="software"/>
    <text x="150" y="825" class="system-label">Web Dashboard</text>
    <text x="150" y="840" class="system-label">Desktop Access</text>
    
    <rect x="250" y="800" width="100" height="60" class="software"/>
    <text x="300" y="825" class="system-label">Mobile App</text>
    <text x="300" y="840" class="system-label">Field Operations</text>
    
    <rect x="400" y="800" width="100" height="60" class="software"/>
    <text x="450" y="825" class="system-label">Tablet Interface</text>
    <text x="450" y="840" class="system-label">Weighbridge UI</text>
    
    <!-- Device connections -->
    <line x1="150" y1="800" x2="400" y2="750" class="interaction"/>
    <line x1="300" y1="800" x2="500" y2="750" class="interaction"/>
    <line x1="450" y1="800" x2="600" y2="750" class="interaction"/>
  </g>

  <!-- Legend -->
  <g>
    <rect x="950" y="800" width="400" height="180" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="8"/>
    <text x="1150" y="825" class="user-label">System Interaction Legend</text>
    
    <!-- People -->
    <circle cx="980" cy="845" r="12" class="person"/>
    <text x="1000" y="850" class="description">Operations Staff</text>
    
    <circle cx="1150" cy="845" r="12" class="admin"/>
    <text x="1170" y="850" class="description">Administrators</text>
    
    <circle cx="1280" cy="845" r="12" class="driver"/>
    <text x="1300" y="850" class="description">Drivers</text>
    
    <!-- Interactions -->
    <line x1="970" y1="870" x2="1010" y2="870" class="interaction"/>
    <text x="1020" y="875" class="description">User Interaction</text>
    
    <line x1="970" y1="890" x2="1010" y2="890" class="data-flow"/>
    <text x="1020" y="895" class="description">Data Flow</text>
    
    <line x1="970" y1="910" x2="1010" y2="910" class="erp-integration"/>
    <text x="1020" y="915" class="description">ERP Integration</text>
    
    <!-- Systems -->
    <rect x="1150" y="870" width="40" height="20" class="software"/>
    <text x="1200" y="885" class="description">QaliTrack Software</text>
    
    <rect x="1150" y="895" width="40" height="20" class="erp"/>
    <text x="1200" y="910" class="description">Factory ERP System</text>
    
    <rect x="1150" y="920" width="40" height="20" class="weighbridge"/>
    <text x="1200" y="935" class="description">Hardware/Infrastructure</text>
  </g>
</svg>