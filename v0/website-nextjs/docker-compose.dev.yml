# Docker Compose configuration for QS Website Next.js Development

services:
  # QS Website Next.js Development
  qs-website-nextjs-dev:
    build:
      context: ../../apps/qs-website-nextjs
      dockerfile: Dockerfile
      target: development
    container_name: qs-website-nextjs-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - SITE_URL=http://localhost:3001
      - NEXT_PUBLIC_SITE_URL=http://localhost:3001
      - NEXT_PUBLIC_API_BASE_URL=${DEV_API_BASE_URL:-http://localhost:5000/api}
      - NEXT_PUBLIC_ASSETS_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../../apps/qs-website-nextjs:/app
      - /app/node_modules
      - /app/.next
      - ./config/dev-config.js:/app/public/config.js:ro
    ports:
      - "${NEXTJS_PORT:-3001}:3001"
    networks:
      - qs-website-dev-network
    command: npm run dev

  # QS API Development (if needed for local development)
  qs-api-dev:
    build:
      context: ../../apps/qs-api
      dockerfile: Dockerfile
      target: development
    container_name: qs-api-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=5000
      - CORS_ORIGIN=http://localhost:3001
      - DATABASE_URL=${DEV_DATABASE_URL:-postgresql://localhost:5432/qsdb}
      - JWT_SECRET=${DEV_JWT_SECRET:-dev-secret-key}
    volumes:
      - ../../apps/qs-api:/app
      - /app/node_modules
    ports:
      - "${API_PORT:-5000}:5000"
    networks:
      - qs-website-dev-network
    command: npm run dev
    depends_on:
      - postgres-dev

  # PostgreSQL for development
  postgres-dev:
    image: postgres:15-alpine
    container_name: qs-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DEV_POSTGRES_DB:-qsdb}
      - POSTGRES_USER=${DEV_POSTGRES_USER:-qsuser}
      - POSTGRES_PASSWORD=${DEV_POSTGRES_PASSWORD:-qspassword}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - qs-website-dev-network

volumes:
  postgres-dev-data:
    driver: local

networks:
  qs-website-dev-network:
    driver: bridge