# Docker Compose configuration for QS Website Next.js with Traefik

services:
  # QS Website Next.js Application
  qs-website-nextjs:
    image: ${QS_WEBSITE_NEXTJS_IMAGE:-ghcr.io/qalitrack/qalitrackservices/qs-website-nextjs:latest}
    container_name: qs-website-nextjs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SITE_URL=https://${DOMAIN}
      - NEXT_PUBLIC_SITE_URL=https://${DOMAIN}
      - NEXT_PUBLIC_API_BASE_URL=${API_BASE_URL:-https://api.${DOMAIN}}
      - NEXT_PUBLIC_ASSETS_URL=https://${DOMAIN}
    volumes:
      - ./config/runtime-config.js:/app/public/config.js:ro
      - ./logs/app:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - qs-website-network
      - proxy-network
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.qs-website-nextjs.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.qs-website-nextjs.entrypoints=websecure"
      - "traefik.http.routers.qs-website-nextjs.tls=true"
      - "traefik.http.routers.qs-website-nextjs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qs-website-nextjs.service=qs-website-nextjs"
      - "traefik.http.services.qs-website-nextjs.loadbalancer.server.port=3001"
      # HTTP router (redirects to HTTPS)
      - "traefik.http.routers.qs-website-nextjs-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.qs-website-nextjs-http.entrypoints=web"
      - "traefik.http.routers.qs-website-nextjs-http.middlewares=redirect-to-https"
      # Redirect middleware
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

networks:
  # Internal network for services communication
  qs-website-network:
    driver: bridge
    internal: true
  
  # External network for Traefik
  proxy-network:
    driver: bridge
    external: true