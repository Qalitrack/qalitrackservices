# Docker Compose configuration for QTruck with Traefik
# Combined frontend (Next.js) and backend (API) deployment

services:
  # QTruck Next.js Frontend
  qtruck-frontend:
    image: ${QTRUCK_FRONTEND_IMAGE:-ghcr.io/qalitrack/qalitrackservices/qtruck-frontend:latest}
    container_name: qtruck-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Next.js public variables (available at build time and runtime)
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
      - NEXT_PUBLIC_SITE_URL=https://${DOMAIN}
      - NEXT_PUBLIC_APP_NAME=QTruck
    volumes:
      - ./logs/frontend:/app/logs
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - qtruck-network
      - proxy-network
    labels:
      - "traefik.enable=true"
      # HTTPS router for main domain
      - "traefik.http.routers.qtruck-frontend.rule=Host(`${DOMAIN}`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.qtruck-frontend.entrypoints=websecure"
      - "traefik.http.routers.qtruck-frontend.tls=true"
      - "traefik.http.routers.qtruck-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qtruck-frontend.service=qtruck-frontend"
      - "traefik.http.services.qtruck-frontend.loadbalancer.server.port=3000"
      # HTTP router (redirects to HTTPS)
      - "traefik.http.routers.qtruck-frontend-http.rule=Host(`${DOMAIN}`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.qtruck-frontend-http.entrypoints=web"
      - "traefik.http.routers.qtruck-frontend-http.middlewares=redirect-to-https"

  # QTruck API Backend
  qtruck-api:
    image: ${QTRUCK_API_IMAGE:-ghcr.io/qalitrack/qalitrackservices/qtruck-api:latest}
    container_name: qtruck-api
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./logs/api:/app/logs
      - qtruck-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - qtruck-network
      - proxy-network
    labels:
      - "traefik.enable=true"
      # HTTPS router for API
      - "traefik.http.routers.qtruck-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.qtruck-api.entrypoints=websecure"
      - "traefik.http.routers.qtruck-api.tls=true"
      - "traefik.http.routers.qtruck-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qtruck-api.service=qtruck-api"
      - "traefik.http.services.qtruck-api.loadbalancer.server.port=5000"
      # HTTP router for API (redirects to HTTPS)
      - "traefik.http.routers.qtruck-api-http.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.qtruck-api-http.entrypoints=web"
      - "traefik.http.routers.qtruck-api-http.middlewares=redirect-to-https"

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: qtruck-redis
    restart: unless-stopped
    volumes:
      - qtruck-redis-data:/data
    networks:
      - qtruck-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  # Internal network for services communication
  qtruck-network:
    driver: bridge
    internal: true
  
  # External network for Traefik
  proxy-network:
    driver: bridge
    external: true

volumes:
  qtruck-uploads:
    driver: local
  qtruck-redis-data:
    driver: local

# Shared middleware
labels:
  # Redirect middleware
  - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
  - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"