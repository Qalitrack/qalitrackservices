name: Build Vehicle Service

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/microservices/masterdata/vehicle-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/microservices/masterdata/vehicle-service/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  SERVICE_NAME: vehicle-service
  SERVICE_PATH: packages/microservices/masterdata/vehicle-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet restore --verbosity normal

      - name: Build application
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet build --no-restore -c Release --verbosity normal

      - name: Run tests
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet test --no-build -c Release --verbosity normal || echo "Tests failed but continuing build"
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          platforms: linux/amd64
          push: false
          tags: ${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
