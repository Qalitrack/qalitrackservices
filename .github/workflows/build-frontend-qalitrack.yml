name: Build Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/qalitrack_frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/qalitrack_frontend/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  SERVICE_NAME: frontend
  SERVICE_PATH: apps/qalitrack_frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json

      - name: Restore dependencies
        run: |
          cd ${{ env.SERVICE_PATH }}
          npm ci

      - name: Build application
        run: |
          cd ${{ env.SERVICE_PATH }}
          echo "VITE_API_URL=https://qalitrack.cseco.co.ke/api" > .env.production
          echo "VITE_API_URL_BACKUP=https://qalitrack.cseco.co.ke/api" >> .env.production
          cat .env.production
          npm run build
        env:
          VITE_API_URL: https://qalitrack.cseco.co.ke/api
          VITE_API_URL_BACKUP: https://qalitrack.cseco.co.ke/api

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
           images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
           tags: |
              type=ref,event=branch
              type=ref,event=pr
              type=sha,prefix=sha-
              type=raw,value=latest,enable={{is_default_branch}}


      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
