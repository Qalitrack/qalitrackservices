name: Build Transaction Service

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/microservices/masterdata/transaction/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/microservices/masterdata/transaction/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  SERVICE_NAME: transaction-service
  SERVICE_PATH: packages/microservices/masterdata/transaction
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: qalitrack_transactions

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_SHARED_BUFFERS: 512MB
          POSTGRES_MAX_CONNECTIONS: 600
          POSTGRES_WORK_MEM: 2MB
          POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1g
          --tmpfs /tmp:rw,noexec,nosuid,size=100m
          --health-cmd pg_isready
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
          --health-start-period 30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U ${{ env.POSTGRES_USER }}; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Restore dependencies
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet restore src/Transaction.Api/Transaction.Api.csproj --verbosity normal

      - name: Build application
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet build src/Transaction.Api/Transaction.Api.csproj --no-restore -c Release --verbosity normal

      - name: Build tests
        run: |
          cd ${{ env.SERVICE_PATH }}
          if find . -name "*.Tests.csproj" -o -name "*Test*.csproj" -o -name "*.IntegrationTests.csproj" | grep -q .; then
            find . -name "*.Tests.csproj" -o -name "*Test*.csproj" -o -name "*.IntegrationTests.csproj" | while IFS= read -r testproject; do
              echo "Building test project: $testproject"
              dotnet build "$testproject" --no-restore -c Release --verbosity normal || echo "Failed to build $testproject"
            done
          else
            echo "No test projects found - skipping test build"
          fi
        continue-on-error: true

      - name: Run unit tests
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }};MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300"
          UsePostgreSQL: "true"
        run: |
          cd ${{ env.SERVICE_PATH }}
          if find . -name "*.Tests.csproj" -o -name "*Test*.csproj" | grep -q .; then
            find . -name "*.Tests.csproj" -o -name "*Test*.csproj" | while IFS= read -r testproject; do
              echo "Running tests for: $testproject"
              dotnet test "$testproject" -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults/ || echo "Tests failed for $testproject"
            done
          else
            echo "No test projects found - skipping tests"
          fi
        continue-on-error: true

      - name: Run database migrations
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }};MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;"
        run: |
          cd ${{ env.SERVICE_PATH }}
          if [ -d "src/Transaction.Infrastructure/Migrations" ]; then
            echo "Running database migrations..."
            dotnet ef database update \
              --project src/Transaction.Infrastructure/Transaction.Infrastructure.csproj \
              --startup-project src/Transaction.Api/Transaction.Api.csproj \
              --verbose \
              --no-build
            echo "✓ Migrations applied successfully"
          else
            echo "No migrations folder found"
          fi
        continue-on-error: true

      - name: Run integration tests
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }};MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;"
          UsePostgreSQL: "true"
        run: |
          cd ${{ env.SERVICE_PATH }}
          if find . -name "*.IntegrationTests.csproj" | grep -q .; then
            find . -name "*.IntegrationTests.csproj" | while IFS= read -r testproject; do
              echo "Running integration tests for: $testproject"
              dotnet test "$testproject" -c Release --verbosity normal --logger "trx;LogFileName=integration-test-results.trx" --results-directory TestResults/ || echo "Integration tests failed for $testproject"
            done
          else
            echo "No integration test projects found - skipping integration tests"
          fi
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.SERVICE_PATH }}/TestResults/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Transaction Service
            org.opencontainers.image.description=QaliTrack Transaction API with PostgreSQL
            org.opencontainers.image.vendor=QaliTrack
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Print deployment instructions
        run: |
          echo ""
          echo "🎉 BUILD SUCCESSFUL!"
          echo ""
          echo "📦 IMAGE PUSHED:"
          echo "   ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}:latest"
          echo ""
          echo "🚀 TO DEPLOY - Update your docker-compose.yml:"
          echo "   image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}:latest"
          echo ""
          echo "✅ Then run: docker compose up -d"
          echo ""

  deploy-kubernetes:
    needs: build-and-push
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.ENABLE_K8S_DEPLOY == 'true'
    uses: ./.github/workflows/deploy-to-kubernetes.yml
    with:
      service-name: transaction-service
      namespace: qalitrack-prod
      timeout: 5m
    secrets:
      kubeconfig: ${{ secrets.KUBECONFIG }}
