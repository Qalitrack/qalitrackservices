
name: Build User Service

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/microservices/masterdata/user-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/microservices/masterdata/user-service/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  SERVICE_NAME: user-service
  SERVICE_PATH: packages/microservices/masterdata/user-service
  POSTGRES_USER: userservice
  POSTGRES_PASSWORD: userservice123
  POSTGRES_DB: userservicedb
  REDIS_PASSWORD: userservice123
  EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
  RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_SHARED_BUFFERS: 512MB
          POSTGRES_MAX_CONNECTIONS: 600
          POSTGRES_WORK_MEM: 2MB
          POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
        ports:
          - 5434:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1g
          --tmpfs /tmp:rw,noexec,nosuid,size=100m
          --health-cmd pg_isready
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
          --health-start-period 30s
      
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ${{ env.REDIS_PASSWORD }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a $REDIS_PASSWORD --raw incr ping"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5434 -U ${{ env.POSTGRES_USER }}; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
      
      - name: Wait for Redis
        run: |
          echo "Waiting for Redis..."
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 -a ${{ env.REDIS_PASSWORD }} ping | grep -q PONG; then
              echo "Redis is ready!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done
      
      - name: Restore dependencies
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet restore src/UserService.Api/UserService.Api.csproj --verbosity normal
          dotnet restore tests/UserService.Tests/UserService.Tests.csproj --verbosity normal
      
      - name: Build application
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet build src/UserService.Api/UserService.Api.csproj --no-restore -c Release --verbosity normal
          dotnet build tests/UserService.Tests/UserService.Tests.csproj --no-restore -c Release --verbosity normal

      - name: Verify test project
        run: |
          cd ${{ env.SERVICE_PATH }}
          echo "Checking if test DLL exists..."
          ls -la tests/UserService.Tests/bin/Release/net8.0/
          echo "Checking test project for any build issues..."
          dotnet list tests/UserService.Tests/UserService.Tests.csproj package
      
      - name: Run unit tests
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5434;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }};MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300"
          ConnectionStrings__Redis: "localhost:6379,password=${{ env.REDIS_PASSWORD }}"
          UsePostgreSQL: "true"
          UseRedis: "true"
        run: |
          cd ${{ env.SERVICE_PATH }}
          echo "Running unit tests..."
          dotnet test tests/UserService.Tests/UserService.Tests.csproj -c Release --verbosity normal --logger "console;verbosity=detailed" --results-directory TestResults/ --blame --logger:trx;LogFileName=test-results.trx
        continue-on-error: false
      
      - name: Run database migrations
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5434;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }};MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;"
        run: |
          cd ${{ env.SERVICE_PATH }}
          if [ -d "src/UserService.Infrastructure/Migrations" ] || [ -d "src/UserService.Api/Migrations" ]; then
            echo "Running database migrations..."
            dotnet ef database update --project src/UserService.Api/UserService.Api.csproj --verbose
          else
            echo "No Entity Framework migrations found, skipping..."
          fi
        continue-on-error: true
      
      - name: Run integration tests
        env:
          ASPNETCORE_ENVIRONMENT: "Testing"
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5434;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }};MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;"
          ConnectionStrings__Redis: "localhost:6379,password=${{ env.REDIS_PASSWORD }}"
          UsePostgreSQL: "true"
          UseRedis: "true"
        run: |
          cd ${{ env.SERVICE_PATH }}
          find . -name "*.IntegrationTests.csproj" | while read testproject; do
            echo "Running integration tests for: $testproject"
            dotnet test "$testproject" --no-build -c Release --verbosity normal --logger trx --results-directory TestResults/
          done
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.SERVICE_PATH }}/TestResults/
  
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for User Service
        id: meta-user
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=User Service
            org.opencontainers.image.description=QaliTrack User Microservice with PostgreSQL and Redis support
            org.opencontainers.image.vendor=QaliTrack
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      
      - name: Build and push User Service Docker image
        id: build-user
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-user.outputs.tags }}
          labels: ${{ steps.meta-user.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Extract metadata for PostgreSQL
        id: meta-postgres
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/userservice-postgres
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=User Service PostgreSQL
            org.opencontainers.image.description=PostgreSQL database for QaliTrack User Service
            org.opencontainers.image.vendor=QaliTrack
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      
      - name: Build and push PostgreSQL Docker image
        id: build-postgres
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile.postgres
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-postgres.outputs.tags }}
          labels: ${{ steps.meta-postgres.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy-compose:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create deployment artifact
        run: |
          mkdir -p deployment
          cp ${{ env.SERVICE_PATH }}/docker-compose.yml deployment/
          cp -r ${{ env.SERVICE_PATH }}/scripts deployment/scripts
          USER_IMAGE_TAG="${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}:main-${{ github.sha }}"
          POSTGRES_IMAGE_TAG="${{ env.REGISTRY }}/${{ github.repository }}/userservice-postgres:main-${{ github.sha }}"
          
          # Create a clean docker-compose.yml with proper image references
          cat > deployment/docker-compose.yml << EOF
          version: '3.8'

          services:
            user-service:
              image: $USER_IMAGE_TAG
              container_name: user-service
              restart: unless-stopped
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=$POSTGRES_DB;Username=$POSTGRES_USER;Password=$POSTGRES_PASSWORD;MinPoolSize=50;MaxPoolSize=500;Timeout=30;CommandTimeout=60;ConnectionIdleLifetime=300;ConnectionPruningInterval=10;Pooling=true;
                - ConnectionStrings__Redis=redis:6379,password=$REDIS_PASSWORD
                - UsePostgreSQL=true
                - UseRedis=true
                - Email__FromEmail=noreply@qalitrack.com
                - Email__FromName=QaliTrack System
                - Email__SmtpHost=smtp.gmail.com
                - Email__SmtpPort=587
                - Email__SmtpUsername=joshuaiska@gmail.com
                - Email__SmtpPassword=$EMAIL_SMTP_PASSWORD
                - Email__EnableSsl=true
                - RabbitMQ__Host=rabbitmq
                - RabbitMQ__Port=5672
                - RabbitMQ__Username=admin
                - RabbitMQ__Password=$RABBITMQ_PASSWORD
                - RabbitMQ__VirtualHost=/
              ports:
                - "8080:80"
              volumes:
                - ./data:/app/data
                - ./logs:/app/logs
              depends_on:
                - postgres-db
                - redis
                - rabbitmq
              networks:
                - userservice-network

            postgres-db:
              image: $POSTGRES_IMAGE_TAG
              container_name: userservice-postgres-db
              restart: unless-stopped
              environment:
                - POSTGRES_USER=userservice
                - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
                - POSTGRES_DB=userservicedb
              ports:
                - "5434:5432"
              volumes:
                - postgres_data:/var/lib/postgresql/data
              networks:
                - userservice-network

            redis:
              image: redis:7-alpine
              container_name: userservice-redis
              restart: unless-stopped
              command: redis-server --requirepass userservice123
              ports:
                - "6379:6379"
              volumes:
                - redis_data:/data
              networks:
                - userservice-network

            rabbitmq:
              image: rabbitmq:3-management-alpine
              container_name: userservice-rabbitmq
              restart: unless-stopped
              environment:
                - RABBITMQ_DEFAULT_USER=admin
                - RABBITMQ_DEFAULT_PASS=securepassword
              ports:
                - "5672:5672"
                - "15672:15672"
              volumes:
                - rabbitmq_data:/var/lib/rabbitmq
              networks:
                - userservice-network

          networks:
            userservice-network:
              driver: bridge

          volumes:
            postgres_data:
            redis_data:
            rabbitmq_data:
          EOF
      
      - name: Upload deployment files
        uses: actions/upload-artifact@v4
        with:
          name: deployment-files
          path: deployment/
      
      - name: Validate Docker Compose
        run: |
          cd deployment
          docker compose config

  deploy-kubernetes:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/deploy-to-kubernetes.yml
    with:
      service-name: user-service
      namespace: qalitrack-prod
      timeout: 5m