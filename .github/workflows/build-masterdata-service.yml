name: Build MasterData Service

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/QaliTrack.MasterData/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/QaliTrack.MasterData/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  SERVICE_NAME: masterdata-service
  SERVICE_PATH: packages/QaliTrack.MasterData
  POSTGRES_USER: masterdata
  POSTGRES_PASSWORD: masterdata123
  POSTGRES_DB: qalitrack_masterdata_test

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U ${{ env.POSTGRES_USER }}; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
      
      - name: Restore dependencies
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet restore src/QaliTrack.MasterData.Api/QaliTrack.MasterData.Api.csproj --verbosity normal
      
      - name: Build application
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet build src/QaliTrack.MasterData.Api/QaliTrack.MasterData.Api.csproj --no-restore -c Release --verbosity normal
      
      - name: Run unit tests
        env:
          DATABASE_PROVIDER: PostgreSQL
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: ${{ env.POSTGRES_DB }}
          POSTGRES_USERNAME: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          cd ${{ env.SERVICE_PATH }}
          # Find and run all test projects
          find . -name "*.Tests.csproj" -o -name "*Test*.csproj" | while read testproject; do
            echo "Running tests for: $testproject"
            dotnet test "$testproject" --no-build -c Release --verbosity normal --logger trx --results-directory TestResults/
          done
        continue-on-error: false
      
      - name: Run database migrations
        env:
          DATABASE_PROVIDER: PostgreSQL
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: ${{ env.POSTGRES_DB }}
          POSTGRES_USERNAME: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          cd ${{ env.SERVICE_PATH }}
          # Check if Entity Framework migrations exist
          if [ -d "src/QaliTrack.MasterData.Infrastructure/Migrations" ]; then
            echo "Running database migrations..."
            dotnet ef database update \
              --project src/QaliTrack.MasterData.Infrastructure/QaliTrack.MasterData.Infrastructure.csproj \
              --startup-project src/QaliTrack.MasterData.Api/QaliTrack.MasterData.Api.csproj \
              --verbose
          else
            echo "No Entity Framework migrations found, skipping..."
          fi
        continue-on-error: true
      
      - name: Run integration tests
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          DATABASE_PROVIDER: PostgreSQL
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: ${{ env.POSTGRES_DB }}
          POSTGRES_USERNAME: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          AUTO_MIGRATE: false
        run: |
          cd ${{ env.SERVICE_PATH }}
          # Run integration tests if they exist
          find . -name "*.IntegrationTests.csproj" | while read testproject; do
            echo "Running integration tests for: $testproject"
            dotnet test "$testproject" --no-build -c Release --verbosity normal --logger trx --results-directory TestResults/
          done
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.SERVICE_PATH }}/TestResults/
  
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=MasterData Service
            org.opencontainers.image.description=QaliTrack MasterData API - Master data management for weighbridge system
            org.opencontainers.image.vendor=QaliTrack
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy-compose:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create deployment artifact
        run: |
          mkdir -p deployment
          IMAGE_TAG="${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}:main-${{ github.sha }}"
          
          cat > deployment/docker-compose.yml << 'EOF'
          version: '3.8'

          services:
            api:
              image: IMAGE_TAG_PLACEHOLDER
              container_name: masterdata-api
              restart: unless-stopped
              ports:
                - "8080:80"
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - DATABASE_PROVIDER=PostgreSQL
                - POSTGRES_HOST=db
                - POSTGRES_PORT=5432
                - POSTGRES_DATABASE=qalitrack_masterdata
                - POSTGRES_USERNAME=masterdata
                - POSTGRES_PASSWORD=masterdata_prod_pass
                - AUTO_MIGRATE=true
                - MIGRATION_MAX_RETRIES=15
                - MIGRATION_RETRY_DELAY=3
                - FAIL_ON_MIGRATION_ERROR=true
                - USE_VAULT=false
              depends_on:
                db:
                  condition: service_healthy
              volumes:
                - ./logs:/app/logs
                - ./docs:/app/wwwroot/docs
              healthcheck:
                test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 60s
              networks:
                - qalitrack-net

            db:
              image: postgres:16
              container_name: masterdata-postgres
              restart: unless-stopped
              environment:
                POSTGRES_DB: qalitrack_masterdata
                POSTGRES_USER: masterdata
                POSTGRES_PASSWORD: masterdata_prod_pass
                POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.utf8"
              ports:
                - "5432:5432"
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U masterdata -d qalitrack_masterdata"]
                interval: 5s
                timeout: 5s
                retries: 10
                start_period: 10s
              networks:
                - qalitrack-net

          volumes:
            postgres_data:
              driver: local

          networks:
            qalitrack-net:
              driver: bridge
          EOF
          
          # Replace the placeholder with actual image tag
          sed -i "s|IMAGE_TAG_PLACEHOLDER|$IMAGE_TAG|g" deployment/docker-compose.yml
      
      - name: Upload deployment files
        uses: actions/upload-artifact@v4
        with:
          name: deployment-files
          path: deployment/
      
      - name: Validate Docker Compose
        run: |
          cd deployment
          docker compose config
      
      - name: Create deployment summary
        run: |
          