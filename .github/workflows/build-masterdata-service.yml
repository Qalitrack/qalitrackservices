name: Build MasterData Service

on:
  push:
    branches: [ main ]
    paths:
      - 'packages//microservices/masterdata/masterdata/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/microservices/masterdata/masterdata/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  SERVICE_NAME: masterdata-service
  SERVICE_PATH: packages/QaliTrack.MasterData
  POSTGRES_USER: masterdata
  POSTGRES_PASSWORD: masterdata123
  POSTGRES_DB: masterdatadb
  POSTGRES_PORT: 5632

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          PGDATA: /var/lib/postgresql/data/pgdata
          POSTGRES_SHARED_BUFFERS: 512MB
          POSTGRES_MAX_CONNECTIONS: 600
          POSTGRES_WORK_MEM: 2MB
          POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
        ports:
          - 5635:5632
        command: ["postgres", "-c", "listen_addresses=*", "-c", "port=5632"]
        options: >-
          --health-cmd "pg_isready -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -p 5632"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
          --health-start-period 30s
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL on port 5632..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5635 -U ${{ env.POSTGRES_USER }}; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
      
      - name: Install EF Core tools
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.*
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      
      - name: Restore dependencies
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet restore src/QaliTrack.MasterData.Api/QaliTrack.MasterData.Api.csproj --verbosity normal
      
      - name: Build application
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet build src/QaliTrack.MasterData.Api/QaliTrack.MasterData.Api.csproj --no-restore -c Release --verbosity normal
      
      - name: Build tests
        run: |
          cd ${{ env.SERVICE_PATH }}
          if find . -name "*.Tests.csproj" -o -name "*Test*.csproj" -o -name "*.IntegrationTests.csproj" | grep -q .; then
            find . -name "*.Tests.csproj" -o -name "*Test*.csproj" -o -name "*.IntegrationTests.csproj" | while IFS= read -r testproject; do
              echo "Building test project: $testproject"
              dotnet build "$testproject" --no-restore -c Release --verbosity normal || echo "Failed to build $testproject"
            done
          else
            echo "No test projects found - skipping test build"
          fi
        continue-on-error: true
      
      - name: Run unit tests
        env:
          UsePostgreSQL: true
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5635;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }};Pooling=true;MinPoolSize=5;MaxPoolSize=100;IncludeErrorDetail=true;CommandTimeout=60
        run: |
          cd ${{ env.SERVICE_PATH }}
          if find . -name "*.Tests.csproj" -o -name "*Test*.csproj" | grep -q .; then
            find . -name "*.Tests.csproj" -o -name "*Test*.csproj" | while IFS= read -r testproject; do
              echo "Running tests for: $testproject"
              dotnet test "$testproject" -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults/ || echo "Tests failed for $testproject"
            done
          else
            echo "No test projects found - skipping tests"
          fi
        continue-on-error: true
      
      - name: Run database migrations
        env:
          UsePostgreSQL: true
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5635;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }};Pooling=true;MinPoolSize=5;MaxPoolSize=100;IncludeErrorDetail=true;CommandTimeout=60
        run: |
          cd ${{ env.SERVICE_PATH }}
          if [ -d "src/QaliTrack.MasterData.Infrastructure/Migrations" ]; then
            echo "Running database migrations..."
            dotnet ef database update \
              --project src/QaliTrack.MasterData.Infrastructure/QaliTrack.MasterData.Infrastructure.csproj \
              --startup-project src/QaliTrack.MasterData.Api/QaliTrack.MasterData.Api.csproj \
              --verbose \
              --no-build
            echo "✓ Migrations applied successfully"
          else
            echo "No migrations folder found"
          fi
        continue-on-error: true
      
      - name: Run integration tests
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          UsePostgreSQL: true
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5635;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }};Pooling=true;MinPoolSize=5;MaxPoolSize=100;IncludeErrorDetail=true;CommandTimeout=60
        run: |
          cd ${{ env.SERVICE_PATH }}
          if find . -name "*.IntegrationTests.csproj" | grep -q .; then
            find . -name "*.IntegrationTests.csproj" | while IFS= read -r testproject; do
              echo "Running integration tests for: $testproject"
              dotnet test "$testproject" -c Release --verbosity normal --logger "trx;LogFileName=integration-test-results.trx" --results-directory TestResults/ || echo "Integration tests failed for $testproject"
            done
          else
            echo "No integration test projects found - skipping integration tests"
          fi
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.SERVICE_PATH }}/TestResults/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=MasterData Service
            org.opencontainers.image.description=QaliTrack MasterData API
            org.opencontainers.image.vendor=QaliTrack
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Print deployment instructions
        run: |
          echo ""
          echo "🎉 BUILD SUCCESSFUL!"
          echo ""
          echo "📦 IMAGE PUSHED:"
          echo "   ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}:latest"
          echo ""
          echo "🚀 TO DEPLOY - Update your docker-compose.yml:"
          echo "   image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}:latest"
          echo ""
          echo "✅ Then run: docker compose up -d"
          echo ""