name: Build QTruck API
# Workflow for building and publishing QTruck API Docker images

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/qtruck/qtruck_api/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  SERVICE_NAME: qtruck-api
  SERVICE_PATH: apps/qtruck/qtruck_api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libspatialite-dev spatialite-bin

      - name: Install dependencies
        run: |
          cd ${{ env.SERVICE_PATH }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: |
          cd ${{ env.SERVICE_PATH }}
          python manage.py check

      - name: Run tests
        run: |
          cd ${{ env.SERVICE_PATH }}
          python manage.py test
        continue-on-error: true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy-kubernetes:
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.ENABLE_K8S_DEPLOY == 'true'
    uses: ./.github/workflows/deploy-to-kubernetes.yml
    with:
      service-name: qtruck-api
      namespace: qalitrack-prod
      timeout: 5m
    secrets:
      kubeconfig: ${{ secrets.KUBECONFIG }}