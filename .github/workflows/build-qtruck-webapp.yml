name: Build QTruck Frontend
# Workflow for building and publishing QTruck Frontend (Next.js) Docker images

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/qtruck/qtruck-webapp/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  SERVICE_NAME: qtruck-frontend
  SERVICE_PATH: apps/qtruck/qtruck-webapp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ env.SERVICE_PATH }}
          npm ci

      - name: Run linting
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_APP_NAME: QTruck
        run: |
          cd ${{ env.SERVICE_PATH }}
          npm run lint
        continue-on-error: true

      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_APP_NAME: QTruck
        run: |
          cd ${{ env.SERVICE_PATH }}
          npm run build
        continue-on-error: false

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy-kubernetes:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/deploy-to-kubernetes.yml
    with:
      service-name: qtruck-frontend
      namespace: qalitrack-prod
      timeout: 5m