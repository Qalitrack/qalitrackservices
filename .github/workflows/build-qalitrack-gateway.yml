name: Build Gateway Service
on:
  push:
    branches: [ main ]
    paths:
      - 'packages/microservices/QalitrackGateWay**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/microservices/QalitrackGateWay**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  SERVICE_NAME: gateway-service
  SERVICE_PATH: packages/microservices/QalitrackGateWay

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet restore QalitrackGateWay.sln --verbosity normal

      - name: Build application
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet build QalitrackGateWay/QalitrackGateWay.csproj --no-restore -c Release --verbosity normal
      
      - name: Run unit tests
        env:
          ASPNETCORE_ENVIRONMENT: "Testing"
        run: |
          cd ${{ env.SERVICE_PATH }}
          if find . -name "*.Tests.csproj" -o -name "*Test*.csproj" | grep -q .; then
            find . -name "*.Tests.csproj" -o -name "*Test*.csproj" | while IFS= read -r testproject; do
              echo "Running tests for: $testproject"
              dotnet test "$testproject" -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults/ || echo "Tests failed for $testproject"
            done
          else
            echo "No test projects found - skipping tests"
          fi
        continue-on-error: true

      - name: Run integration tests
        env:
          ASPNETCORE_ENVIRONMENT: "Testing"
        run: |
          cd ${{ env.SERVICE_PATH }}
          if find . -name "*.IntegrationTests.csproj" | grep -q .; then
            find . -name "*.IntegrationTests.csproj" | while IFS= read -r testproject; do
              echo "Running integration tests for: $testproject"
              dotnet test "$testproject" -c Release --verbosity normal --logger "trx;LogFileName=integration-test-results.trx" --results-directory TestResults/ || echo "Integration tests failed for $testproject"
            done
          else
            echo "No integration test projects found - skipping integration tests"
          fi
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.SERVICE_PATH }}/TestResults/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Gateway Service
            org.opencontainers.image.description=QaliTrack Gateway Microservice for JWT Authentication
            org.opencontainers.image.vendor=QaliTrack
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy-kubernetes:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-to-kubernetes.yml
    with:
      service-name: gateway-service
      namespace: qalitrack-prod
      timeout: 5m
