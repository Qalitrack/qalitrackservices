name: Build Gateway Service
on:
  push:
    branches: [ main ]
    paths:
      - 'packages/microservices/QalitrackGateWay**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/microservices/QalitrackGateWay**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  SERVICE_NAME: gateway-service
  SERVICE_PATH: packages/microservices/QalitrackGateWay

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet restore GatewayService.API/GatewayService.API.csproj --verbosity normal
      
      - name: Build application
        run: |
          cd ${{ env.SERVICE_PATH }}
          dotnet build GatewayService.API/GatewayService.API.csproj --no-restore -c Release --verbosity normal
      
      - name: Run unit tests
        env:
          ASPNETCORE_ENVIRONMENT: "Testing"
          UsePostgreSQL: "false"
          UseRedis: "false"
        run: |
          cd ${{ env.SERVICE_PATH }}
          # Find and run all test projects
          find . -name "*.Tests.csproj" -o -name "*Test*.csproj" | while read testproject; do
            echo "Running tests for: $testproject"
            dotnet test "$testproject" --no-build -c Release --verbosity normal --logger trx --results-directory TestResults/
          done
        continue-on-error: false
      
      - name: Run database migrations (if applicable)
        env:
          ASPNETCORE_ENVIRONMENT: "Testing"
        run: |
          cd ${{ env.SERVICE_PATH }}
          # Check if Entity Framework migrations exist
          if [ -d "GatewayService.Infrastructure/Migrations" ] || [ -d "GatewayService.API/Migrations" ]; then
            echo "Running database migrations..."
            # For gateway, if no DB, this might skip; adjust if needed
            echo "No migrations expected for gateway service, skipping..."
          else
            echo "No Entity Framework migrations found, skipping..."
          fi
        continue-on-error: true
      
      - name: Run integration tests
        env:
          ASPNETCORE_ENVIRONMENT: "Testing"
          UsePostgreSQL: "false"
          UseRedis: "false"
        run: |
          cd ${{ env.SERVICE_PATH }}
          # Run integration tests if they exist
          find . -name "*.IntegrationTests.csproj" | while read testproject; do
            echo "Running integration tests for: $testproject"
            dotnet test "$testproject" --no-build -c Release --verbosity normal --logger trx --results-directory TestResults/
          done
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.SERVICE_PATH }}/TestResults/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Gateway Service
            org.opencontainers.image.description=QaliTrack Gateway Microservice for JWT Authentication
            org.opencontainers.image.vendor=QaliTrack
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy-compose:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create deployment artifact
        run: |
          mkdir -p deployment
          # Create a simple docker-compose for gateway deployment
          IMAGE_TAG="${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}:main-${{ github.sha }}"
          
          cat > deployment/docker-compose.yml << EOF
          version: '3.8'

          services:
            gateway-service:
              image: $IMAGE_TAG
              container_name: gateway-service
              restart: unless-stopped
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - ASPNETCORE_URLS=http://+:3000
                - JWT_SECRET_KEY=
                - JWT_ISSUER=qalitrack
                - JWT_AUDIENCE=qalitrack
              ports:
                - "3000:3000"
              networks:
                - gateway-network

          networks:
            gateway-network:
              driver: bridge
          EOF
      
      - name: Upload deployment files
        uses: actions/upload-artifact@v4
        with:
          name: deployment-files
          path: deployment/
      
      - name: Validate Docker Compose
        run: |
          cd deployment
          docker compose config
