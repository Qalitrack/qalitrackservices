name: S/4HANA Mock Server CI

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/s4hana-mock-server/**'
      - '.github/workflows/s4hana-mock-server-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/s4hana-mock-server/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: s4hana-mock-server

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # Code Quality and Testing
  test:
    name: Test and Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/s4hana-mock-server/package-lock.json

    - name: Install dependencies
      run: |
        cd apps/s4hana-mock-server
        npm ci

    - name: Run lint checks
      run: |
        cd apps/s4hana-mock-server
        npm run lint

    - name: Run tests
      run: |
        cd apps/s4hana-mock-server
        npm test

    - name: Test server startup
      run: |
        cd apps/s4hana-mock-server
        timeout 10 npm start &
        sleep 5
        curl -f http://localhost:5001/health || exit 1

  # Docker Build and Security Scan
  build-and-scan:
    name: Build Docker Image and Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: apps/s4hana-mock-server
        file: apps/s4hana-mock-server/Dockerfile
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/s4hana-mock-server-image.tar

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: s4hana-mock-server-image
        path: /tmp/s4hana-mock-server-image.tar
        retention-days: 1

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        input: /tmp/s4hana-mock-server-image.tar
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Trivy vulnerability scanner (JSON output)
      uses: aquasecurity/trivy-action@master
      with:
        input: /tmp/s4hana-mock-server-image.tar
        format: 'json'
        output: 'trivy-results.json'

    - name: Upload Trivy JSON results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-scan-results
        path: trivy-results.json

  # Integration Tests
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-scan
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: s4hana-mock-server-image
        path: /tmp

    - name: Load Docker image
      run: docker load --input /tmp/s4hana-mock-server-image.tar

    - name: Run integration tests with docker-compose
      run: |
        cd apps/s4hana-mock-server
        # Override image in docker-compose for testing
        export S4HANA_MOCK_SERVER_IMAGE=$(docker images --format "table {{.Repository}}:{{.Tag}}" | grep s4hana-mock-server | head -n1)
        docker compose up -d
        
        # Wait for service to be ready
        sleep 15
        
        # Run health checks
        curl -f http://localhost:5001/health || exit 1
        
        # Test web interface
        curl -f http://localhost:5001/ | grep "S/4HANA Mock Server" || exit 1
        
        # Test API endpoints structure (check if JSON response is valid)
        curl -s http://localhost:5001/health | jq . || exit 1
        
        # Check container is running
        docker compose ps
        
        # Cleanup
        docker compose down -v

    - name: Collect container logs
      if: failure()
      run: |
        cd apps/s4hana-mock-server
        mkdir -p logs
        docker compose logs s4hana-mock-server > logs/s4hana-mock-server.log

    - name: Upload container logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: container-logs
        path: apps/s4hana-mock-server/logs/

  # Push Docker Image
  push-image:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, build-and-scan, integration-test]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest

    - name: Build and push Docker image
      id: build-and-push
      uses: docker/build-push-action@v5
      with:
        context: apps/s4hana-mock-server
        file: apps/s4hana-mock-server/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v1
      with:
        subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.build-and-push.outputs.digest }}
        push-to-registry: true