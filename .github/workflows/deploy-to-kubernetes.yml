# GitOps deployment — updates image tag in the sub-chart's values.yaml,
# repackages its tgz, and commits. ArgoCD detects the tgz change and
# auto-syncs to the cluster.
#
# Why repackage? ArgoCD uses the pre-packaged .tgz files in charts/.
# Editing source values.yaml alone has no effect — the tgz must be
# rebuilt for the change to reach the cluster.

name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Service name (e.g., gateway-service, user-service)'
        required: true
        type: string
      namespace:
        required: false
        type: string
        default: 'qalitrack-prod'
      timeout:
        required: false
        type: string
        default: '5m'

jobs:
  deploy:
    if: github.repository == 'Qalitrack/qalitrackservices'
    runs-on: ubuntu-latest
    concurrency:
      group: helm-chart-update
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Compute short SHA image tag
        id: tag
        run: echo "value=main-$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Verify image exists in GHCR
        run: |
          SERVICE="${{ inputs.service-name }}"
          TAG="${{ steps.tag.outputs.value }}"
          case "$SERVICE" in
            technician-service) IMAGE_NAME="technician-api" ;;
            *) IMAGE_NAME="$SERVICE" ;;
          esac
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/${IMAGE_NAME}:${TAG}"
          echo "Verifying image exists: $IMAGE"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker manifest inspect "$IMAGE" || { echo "❌ Image $IMAGE not found in GHCR — deploy aborted to prevent broken rollout"; exit 1; }

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Update image tag in sub-chart values and repackage
        run: |
          SERVICE="${{ inputs.service-name }}"
          TAG="${{ steps.tag.outputs.value }}"
          CHARTS_DIR="kubernetes/helm-charts/qalitrack-platform/charts"

          case "$SERVICE" in
            gateway-service)
              yq e ".image.tag = \"$TAG\"" -i "kubernetes/helm-charts/gateway-service/values.yaml"
              helm package kubernetes/helm-charts/gateway-service --destination "$CHARTS_DIR"
              ;;
            user-service)
              yq e ".image.tag = \"$TAG\"" -i "kubernetes/helm-charts/user-service/values.yaml"
              helm package kubernetes/helm-charts/user-service --destination "$CHARTS_DIR"
              # Also update the technician-service's embedded user-service (same image)
              yq e ".userService.image.tag = \"$TAG\"" -i "kubernetes/helm-charts/technician-service/values.yaml"
              helm package kubernetes/helm-charts/technician-service --destination "$CHARTS_DIR"
              ;;
            masterdata-service)
              yq e ".image.tag = \"$TAG\"" -i "kubernetes/helm-charts/masterdata-service/values.yaml"
              helm package kubernetes/helm-charts/masterdata-service --destination "$CHARTS_DIR"
              ;;
            transaction-service)
              yq e ".image.tag = \"$TAG\"" -i "kubernetes/helm-charts/transaction-service/values.yaml"
              helm package kubernetes/helm-charts/transaction-service --destination "$CHARTS_DIR"
              ;;
            backup-service)
              yq e ".image.tag = \"$TAG\"" -i "kubernetes/helm-charts/backup-service/values.yaml"
              helm package kubernetes/helm-charts/backup-service --destination "$CHARTS_DIR"
              ;;
            technician-api|technician-service)
              yq e ".image.tag = \"$TAG\"" -i "kubernetes/helm-charts/technician-service/values.yaml"
              helm package kubernetes/helm-charts/technician-service --destination "$CHARTS_DIR"
              ;;
            qtruck-api)
              yq e ".api.image.tag = \"$TAG\"" -i "kubernetes/helm-charts/qtruck-service/values.yaml"
              helm package kubernetes/helm-charts/qtruck-service --destination "$CHARTS_DIR"
              ;;
            qtruck-frontend)
              yq e ".frontend.image.tag = \"$TAG\"" -i "kubernetes/helm-charts/qtruck-service/values.yaml"
              helm package kubernetes/helm-charts/qtruck-service --destination "$CHARTS_DIR"
              ;;
            *)
              echo "No sub-chart entry for $SERVICE — nothing to update"
              exit 0
              ;;
          esac

          echo "Updated $SERVICE image tag → $TAG and repackaged tgz"

      - name: Commit and push (ArgoCD will auto-sync)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add kubernetes/helm-charts/
          if git diff --staged --quiet; then
            echo "No changes — image tag already up to date"
            exit 0
          fi

          git commit -m "deploy: ${{ inputs.service-name }} → ${{ steps.tag.outputs.value }} [skip ci]"
          git push origin main
          echo "Pushed to git — ArgoCD will detect the tgz change and redeploy"
