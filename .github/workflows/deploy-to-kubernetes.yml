# GitOps deployment — updates image tag in Helm values and commits to git.
# ArgoCD detects the change and auto-syncs to the cluster.

name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Service name matching the values.yaml key (e.g., gateway-service)'
        required: true
        type: string
      namespace:
        required: false
        type: string
        default: 'qalitrack-prod'
      timeout:
        required: false
        type: string
        default: '5m'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Compute short SHA image tag
        id: tag
        run: echo "value=main-$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update image tag in platform values.yaml
        run: |
          SERVICE="${{ inputs.service-name }}"
          TAG="${{ steps.tag.outputs.value }}"
          VALUES="kubernetes/helm-charts/qalitrack-platform/values.yaml"

          case "$SERVICE" in
            gateway-service)    yq e ".gateway.image.tag = \"$TAG\""             -i "$VALUES" ;;
            user-service)       yq e ".userService.image.tag = \"$TAG\""         -i "$VALUES" ;;
            masterdata-service) yq e ".masterdata.image.tag = \"$TAG\""          -i "$VALUES" ;;
            transaction-service) yq e ".transaction.image.tag = \"$TAG\""        -i "$VALUES" ;;
            backup-service)     yq e ".backup.image.tag = \"$TAG\""              -i "$VALUES" ;;
            technician-api|technician-service) yq e ".technicianService.image.tag = \"$TAG\"" -i "$VALUES" ;;
            qtruck-api)         yq e ".qtruckService.api.image.tag = \"$TAG\""   -i "$VALUES" ;;
            qtruck-frontend)    yq e ".qtruckService.frontend.image.tag = \"$TAG\"" -i "$VALUES" ;;
            *)
              echo "No Helm chart entry for $SERVICE — nothing to update"
              exit 0
              ;;
          esac

          echo "Set $SERVICE image tag → $TAG"

      - name: Commit and push (ArgoCD will auto-sync)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes — image tag already up to date"
            exit 0
          fi

          git add kubernetes/helm-charts/qalitrack-platform/values.yaml
          git commit -m "deploy: ${{ inputs.service-name }} → ${{ steps.tag.outputs.value }} [skip ci]"
          git push
          echo "Pushed to git — ArgoCD will detect the change and redeploy"
